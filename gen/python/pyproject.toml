[project]
name = "kusinta-iot-schema"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.80.0",
  "protobuf>=7.35.0",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.80.0",
  "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["kusinta_iot_schema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
