[project]
name = "kusinta-iot-schema"
# Set via ./set-version.sh <version>
version = "0.1.0-beta.14"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.80.0",
  "protobuf>=7.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["kusinta"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
