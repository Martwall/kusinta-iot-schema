version: v2
# Dart-only generation. Run with:
#   buf generate --template buf.gen.dart.yaml --include-imports --include-wkt
#
# Why a separate template + flags:
# - protocolbuffers/dart:v22.5.0 imports well-known types (e.g. Timestamp) by
#   relative path and expects them generated locally. protobuf ^4.x (forced by
#   connectrpc 1.0.0, which caps protobuf <5.0.0) does NOT bundle them, so we
#   must generate google/protobuf/*.dart ourselves via --include-wkt.
# - Those flags are global, so keeping dart out of buf.gen.yaml avoids emitting
#   redundant WKT for js/python, whose runtimes already provide them.
plugins:
  # Dart — message types (protobuf over WebRTC DataChannel)
  - remote: buf.build/protocolbuffers/dart:v22.5.0
    out: gen/dart/lib

  # ConnectRPC Dart — service client stubs for Flutter app signaling
  - remote: buf.build/connectrpc/dart:v1.0.0
    out: gen/dart/lib
