version: v2
# JS + Python generation. Dart is generated separately via buf.gen.dart.yaml
# (it needs --include-imports --include-wkt; see that file for why).
plugins:
  # JavaScript + TypeScript declarations — messages and service descriptors
  # Service descriptors are included in *_pb.js, usable with @connectrpc/connect v2
  - remote: buf.build/bufbuild/es:v2.12.0
    out: gen/js/src
    opt:
      - target=js+dts
      - import_extension=js

  # Python — gRPC stubs (depends on protocolbuffers/python)
  - remote: buf.build/grpc/python:v1.80.0
    out: gen/python

  # Python — message types (depends on protocolbuffers/pyi)
  - remote: buf.build/protocolbuffers/python:v34.1
    out: gen/python

  # Python — type stubs
  - remote: buf.build/protocolbuffers/pyi:v34.1
    out: gen/python

  # ConnectRPC Python — service client/server stubs for registration and signaling
  - remote: buf.build/connectrpc/python:v0.10.1
    out: gen/python
