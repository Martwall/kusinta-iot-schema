syntax = "proto3";

package kusinta.iot.v1.access;

import "google/protobuf/timestamp.proto";
import "identity/identity.proto";
import "access/roles.proto";

option optimize_for = SPEED;

// PropertyConstraint bounds a single Matter cluster attribute.
// attribute_name uses PascalCase Matter attribute naming (e.g. "MaxHeatSetpointLimit").
// MaxHeatSetpointLimit and MinHeatSetpointLimit are actual Matter Thermostat cluster
// attributes (0x0016, 0x0015) — the gateway writes them directly via the connector.
message PropertyConstraint {
  string attribute_name = 1;

  oneof constraint {
    sint32 int_max  = 2;
    sint32 int_min  = 3;
    uint32 uint_max = 4;
    uint32 uint_min = 5;
  }

  string cluster_id_hex = 6;
}

message DeviceAcl {
  kusinta.iot.v1.identity.DeviceId device_id = 1;
  kusinta.iot.v1.identity.UserId   user_id   = 2;
  Role                             role      = 3;
  repeated PermissionAction        allowed_actions     = 4;
  repeated string                  allowed_attributes  = 5; // empty = all attributes allowed
  repeated PropertyConstraint      property_constraints = 6;
}

message EffectivePermissions {
  kusinta.iot.v1.identity.UserId    user_id    = 1;
  kusinta.iot.v1.identity.GatewayId gateway_id = 2;
  repeated DeviceAcl                device_acls = 3;
  google.protobuf.Timestamp         valid_at   = 4;
}
