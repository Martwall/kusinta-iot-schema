syntax = "proto3";

package kusinta.iot.webrtc.v1;

import "google/protobuf/timestamp.proto";
import "kusinta/iot/access/v1/acl.proto";
import "kusinta/iot/access/v1/roles.proto";
import "kusinta/iot/accountlink/v1/account_link.proto";
import "kusinta/iot/climate/v1/climate.proto";
import "kusinta/iot/commissioning/v1/commissioning.proto";
import "kusinta/iot/common/v1/types.proto";
import "kusinta/iot/heating/v1/heating.proto";
import "kusinta/iot/identity/v1/identity.proto";
import "kusinta/iot/link/v1/link.proto";
import "kusinta/iot/planning/v1/planning.proto";
import "kusinta/iot/space/v1/space.proto";
import "kusinta/iot/vendor/lorawan/v1/lorawan.proto";
import "kusinta/iot/webrtc/v1/household.proto";
import "kusinta/iot/webrtc/v1/invite.proto";
import "kusinta/iot/webrtc/v1/members.proto";

option optimize_for = SPEED;

// Filing: the operations that decide which devices a user may see.
//
// The device-streaming half of this leg answers "what is there and what is it
// doing". This half answers "whose is it" — spaces, who belongs to them, which
// devices sit in them, and who owns a device outright. The gateway's own records
// are authoritative for all of it; DeviceDescriptor.space_id and .ownership are
// downstream copies the gateway populates and never reads back as authority.
//
// Every operation is authorized against the caller's reach, not against a
// gateway-wide role alone: reaching a space is what lets you act on it. A target
// the caller cannot reach is refused as NOT_ENTITLED whether or not it exists,
// so no operation here can be used to enumerate ids the caller may not see.
// Results come back as ManagementResult on the gateway envelope, correlated by
// AppMessage.message_id.
//
// HEATING ACROSS A HOME. No heating record (heating.v1) reaches across a home's boundary. A
// change crosses it when, as it would leave things:
//   * a device a record binds or reads lies on the other side of the record's home boundary —
//     in another home, outside homes while the record is in one, in a home while the record is
//     outside homes, or filed in no space;
//   * a floor zone's rooms lie on both sides of a home's boundary;
//   * a household's record — a plant in a home with its circuits and their zones, or a floor
//     zone or comfort load in a home — is carried out of its home whole, or a building's record
//     — a plant outside homes with its circuits and zones, or a floor zone outside homes — into
//     a home. A plant is carried whenever its space is, and a floor zone whenever all its rooms
//     are, whatever its plant. A deletion carries a record when it changes whose the record is:
//     a home's comfort load whose room is deleted would be the building's.
// Only what the change touches is weighed: a crossing it leaves as it was, made before this
// rule, refuses nothing and is undone by nothing.
//
// A heating put (PutHeatingPlant, PutHeatingCircuit, PutFloorZone, PutComfortLoad) never makes
// a crossing: one binding or reading a device on the other side of the record's home boundary,
// or filed in no space, is refused as NOT_ENTITLED with the metadata of a device out of reach,
// so the answer says nothing of where the device is filed. A binding the put leaves as stored
// is not judged again, unless the put moves the record across the boundary.
//
// A change that crosses it by PlaceDeviceInSpace, ClaimDevice (with initial_space_id or
// without), RemoveDeviceFromSpace, UpdateSpace (a reparent, a detach or a change of type) or
// DeleteSpace is refused when the caller is given a record in the way, as NOT_ENTITLED with
// metadata "reason":
//   "heating_across_home"            the caller may change every such record: unbind the
//                                    device, or move the record, first;
//   "heating_across_home_not_yours"  the caller is given one they may not change.
// A caller who does not see every device those records name is refused as NOT_ENTITLED with no
// "reason", so the refusal names nothing they do not see.
//
// Records the caller is not given never refuse a change: it applies, and the crossing is undone
// in the same change. A binding or reading across the boundary is removed from its record. A
// floor zone is cut on the side it was whose before the change — a room in a home makes it that
// home's — losing the rooms the change took across or deleted, its control room cleared if that
// went, and the area shares of the rooms it keeps made whole again in proportion. A household's
// record carried out of its home whole is removed as a household's data goes at a wipe, with
// what lies under it (a plant's circuits and zones), its bindings, a comfort load's windows, a
// zone's rooms and duty, and what the household answered of it (commissioning.v1), comfort
// facts among it; house facts and tests of it stay, naming nobody. What the household answered
// of a space the change takes out of its home goes too. A building's record carried into a
// home is removed likewise. The same holds, never refused for it, for ReleaseDevice, for
// RemoveFromGateway's releases of the member's own devices, for devices filed by pairing or by
// a linked account, and for a household's wipe (household.proto, WIPE). Each record changed so
// has its revision bumped, so a put naming the revision it had is stale and a pass held against
// a binding it lost is no longer current, and every output no longer bound is returned to rest
// once the change is committed (heating.v1). heating.v1 pushes no record: whoever is given one
// sees it changed, or gone, at their next ListHeating. A deletion that crosses nothing cuts
// every floor zone naming a room it deletes the same way, whoever is given the zone, and keeps
// a zone it leaves with no room (heating.v1, UNCONTROLLED ZONES). A floor zone whose control
// room was cleared is not driven until whoever may put it names a new one among the rooms it
// keeps: a put with none is refused as "ZONE_CONTROL_ROOM" (PutHeatingPlant).
//
// START-UP. A crossing stored before this rule is undone once, when the gateway starts, before
// it first reads its heating records: a binding or reading across a boundary is removed, and a
// floor zone stored with rooms on both sides is cut as above, keeping the home it is whose — a
// room in a home makes it that home's — and losing its rooms outside it. The step writes no
// output: none of those outputs has been driven since they were held at rest, and a lease still
// running lapses on its own. A record stored carried across before the rule is not removed by
// it.

// Creates a space. A space with no parent_space_id is top level, which is a
// stronger request than it looks: there is no parent whose reach could authorize
// it, so it is reserved to the gateway's administrator.
//
// Under an apartment only a room may be created. Creating in a home is guarded as
// UpdateSpace is, and refused whatever the caller where UpdateSpace's structure rules would
// refuse it.
//
// An apartment is created by the property owner or the gateway's administrators, with a name
// that identifies it in the building (space.v1.Space.name); an empty name is INVALID_REQUEST.
message CreateSpace {
  kusinta.iot.common.v1.SpaceType space_type = 1;
  string name = 2;
  string description = 3;
  int32 floor = 4; // meaningful for FLOOR type
  kusinta.iot.identity.v1.SpaceId parent_space_id = 5; // unset = top level

  // An IANA time zone name, e.g. "Europe/Stockholm". Accepted only on a building — a
  // top-level space — and refused on any other. Unset leaves it unknown.
  optional string time_zone = 6;
  // On a ROOM only (space.v1.Space.room_type); refused on any other type as INVALID_REQUEST.
  kusinta.iot.space.v1.RoomType room_type = 7;
}

// Changes a space in place. Changes that would take a space into or out of a home, or move
// a home, are guarded by the gateway; a caller not allowed is refused as NOT_ENTITLED. A
// change is refused whatever the caller if it would leave anything but a room under an
// apartment, an apartment in a home, or — among what the caller can see — a device in two
// homes or a link across a home's boundary. What the caller cannot see never refuses it: a
// device a resident owns that would leave its owner's home, enter a home not theirs or sit
// in two homes is taken out of the moving space instead — staying in its owner's home,
// filed on the apartment, where it was in it — and any link it would carry across a
// boundary is removed. Changing the type of a space that has members needs
// ROLE_PROPERTY_OWNER or ROLE_GATEWAY_ADMIN, who see them, and is refused if it would
// leave a RESIDENT membership on a room, as INVALID_REQUEST with metadata
// {"reason": "resident_on_room"}.
//
// An apartment keeps its type while its household data is there. A change of an apartment's
// type is refused as FAILED_PRECONDITION with metadata {"reason": "handover_pending"} while a
// handover of the home is under way: pending (household.proto, HANDOVER, VACANCY), confirmed
// but its wipe not yet done, or its last residency ended and no handover recorded yet. It is
// refused as FAILED_PRECONDITION with metadata {"reason": "home_occupied"} while any residency
// of the home names someone: a current resident, or a past household whose data has not been
// wiped. The home's household data goes by a handover first (household.proto, HANDOVER, WIPE),
// never by a retype away and back. Neither refuses a change that leaves the type as it is, a
// rename among them. Every other check is made first — who may make the change, and the
// refusals of its shape as INVALID_REQUEST, "resident_on_room" among them — and
// "handover_pending" before "home_occupied".
//
// The name of an apartment is the building's identifier for it (space.v1.Space.name), and is
// changed only by the property owner or the gateway's administrators: from anyone else, a
// request setting it is refused whole as NOT_ENTITLED. The household names its home with
// SetHomeName instead.
//
// A heating record the change would leave across a home's boundary is refused or undone as
// HEATING ACROSS A HOME says.
//
// Every descriptive field carries explicit presence: absent means leave it alone, present
// means set it to this — including to the empty string, which is how a description is
// cleared.
message UpdateSpace {
  kusinta.iot.identity.v1.SpaceId space_id = 1;
  optional kusinta.iot.common.v1.SpaceType space_type = 2;
  optional string name = 3;
  optional string description = 4;
  optional int32 floor = 5;

  // Reparenting needs three states, not two: leave the parent alone, move to a
  // new one, or become top level. A bare optional parent_space_id can only
  // express the first two, so detaching gets its own case rather than being
  // spelled as an empty id.
  oneof parent_change {
    kusinta.iot.identity.v1.SpaceId parent_space_id = 6;
    bool detach = 7;
  }

  // An IANA time zone name, e.g. "Europe/Stockholm". Accepted only on a building — a
  // top-level space — and refused on any other. Unset leaves it unchanged; the empty
  // string clears it.
  optional string time_zone = 8;
  // Set: the room's type changes (UNSPECIFIED clears it). On a ROOM only.
  optional kusinta.iot.space.v1.RoomType room_type = 9;
}

// Deletes a space. Refused if the space still holds devices or sub-spaces unless
// cascade is set, so that emptying a building is always something the caller
// asked for rather than something a stale client did by accident. Deleting a home, or
// anything in one, is guarded as UpdateSpace is, heating records included
// (HEATING ACROSS A HOME).
//
// Refused as FAILED_PRECONDITION with metadata {"reason": "handover_pending"}, cascade or not,
// while a handover is under way, as UpdateSpace has it, of the home deleted or of any home
// beneath the space: a household's records go by its wipe (household.proto, WIPE), never by a
// deletion. Refused as FAILED_PRECONDITION with metadata {"reason": "home_occupied"}, cascade or
// not, while any residency of the home deleted, or of any home beneath the space, names someone:
// a current resident, or a past household whose data has not been wiped. The home's household
// data goes by a handover first (household.proto, HANDOVER, WIPE), and no residency names a home
// that was deleted. "handover_pending" is checked before "home_occupied".
message DeleteSpace {
  kusinta.iot.identity.v1.SpaceId space_id = 1;
  bool cascade = 2;
}

// Adds a user to a space, granting them reach of it and everything beneath it — except
// that a RESIDENT membership reaches no home beneath it (see access.v1.MembershipRelation).
// The user need not be known to the gateway beforehand — identities are minted by
// the token issuer, and this records that one of them belongs here.
//
// Assigning a user who is already a member changes their relation to the space.
// RESIDENT is refused on a room; see access.v1.MembershipRelation.
//
// Nobody is made a household admin through it: HOUSEHOLD_ADMIN is refused as
// INVALID_REQUEST, since that comes only by promotion or appointment (household.proto). A
// HOUSEHOLD_ADMIN membership is never changed through it either: assigning onto one is refused
// as FAILED_PRECONDITION with metadata {"reason": "household_admin"}; DemoteHouseholdAdmin and
// RemoveUserFromSpace are how it ends.
//
// Who may change who belongs to a home is restricted by the gateway; a caller not allowed is
// refused as NOT_ENTITLED. Residents see who is filed on their home in Space.members.
//
// A membership the caller is not told of under this user id (a residency, to anyone outside
// its household: access.v1.MembershipRelation, RESIDENCY IDS) is never changed through it:
// assigning onto it is refused as NOT_ENTITLED, and RemoveUserFromSpace answers as for one
// that does not exist. user_id is never a residency id.
//
// While a vacated handover of the home is pending, the property owner or a gateway
// administrator assigning RESIDENT to someone outside the departing household completes it
// first rather than being refused as "handover_pending" (household.proto, QUICK TURNOVER).
message AssignUserToSpace {
  reserved 3; // held for a per-space Role, should roles stop being gateway-wide

  kusinta.iot.identity.v1.SpaceId space_id = 1;
  kusinta.iot.identity.v1.UserId user_id = 2;

  // How the user stands to the space — whether they live there or are there for the
  // building. Required: UNSPECIFIED is refused, never defaulted. See
  // access.v1.MembershipRelation for what each lets a member see of a home.
  kusinta.iot.access.v1.MembershipRelation relation = 4;
}

// Removes a user's membership of a space. Losing reach also drops whatever the
// user was streaming from it, announced by LivePermissionUpdate.
//
// Removing someone else from a home is guarded as assigning is: within the household, it is a
// household admin's (household.proto). Anyone may remove themselves, save the last household
// admin of a home that has other residents ("last_household_admin", household.proto, LAST
// ADMIN, which also refuses a household admin removing another when that would leave none). A
// membership the caller is not told of under the user id given (see AssignUserToSpace) is
// answered as one that does not exist, and stays.
//
// user_id may be a residency id (access.v1.MembershipRelation, RESIDENCY IDS): it then ends
// that residency, if space_id is its home, and answers as for one that does not exist
// otherwise. This is how a property owner or an administrator ends the residency of
// someone who moved out.
message RemoveUserFromSpace {
  kusinta.iot.identity.v1.SpaceId space_id = 1;
  kusinta.iot.identity.v1.UserId user_id = 2;
}

// Files a device into a space. A device may sit in several spaces at once; this
// is additive, and filing a device where it already sits is a no-op.
//
// Into a home go only the building's own devices and devices its residents own, and a
// device belongs to one home at most; filing into, out of or beside a home is guarded by
// the gateway, and within the household it is a household admin's, save a device a resident
// owns, which its owner files (household.proto). A caller not allowed is refused as
// NOT_ENTITLED, and filing that would leave a link the caller can see across a home's
// boundary is refused whatever the caller; one they cannot see is removed instead. A heating
// record left across it is refused or undone as HEATING ACROSS A HOME says.
message PlaceDeviceInSpace {
  kusinta.iot.identity.v1.DeviceId device_id = 1;
  kusinta.iot.identity.v1.SpaceId space_id = 2;
}

// Takes a device out of one space, leaving any others intact. A device in no
// space and with no owner is unfiled, and visible only to the administrator.
//
// Taking a device out of a home is guarded as PlaceDeviceInSpace is, and removes its links
// to devices still in the home; a heating record it would leave across the boundary is refused
// or undone as HEATING ACROSS A HOME says.
message RemoveDeviceFromSpace {
  kusinta.iot.identity.v1.DeviceId device_id = 1;
  kusinta.iot.identity.v1.SpaceId space_id = 2;
}

// Takes ownership of a device. Ownership is reach in its own right: an owner may
// see and control their device whatever their gateway-wide role permits, and may
// file it into spaces they belong to, and the rooms of a home they live in — though into a
// home only if they live there (see PlaceDeviceInSpace).
//
// Only a RESIDENT claim makes the caller the owner. A COMPANY claim records that the
// building owns the device, names no person, and grants the caller no reach. The gateway keeps
// who made it for 24 hours only, for ReleaseDevice's undo, shows it to nobody, and erases it
// then, or sooner with that person. Claims of a device in a home, or of one already claimed,
// are restricted by the gateway. A claim, with initial_space_id or without, that would leave a
// heating record across a home's boundary is refused or undone as HEATING ACROSS A HOME says.
//
// WHICH CLAIM. The claim states its ownership, and the gateway never defaults it: one with
// neither is refused as INVALID_REQUEST. A COMPANY claim is accepted only from a filing role,
// and refused as NOT_ENTITLED from anyone else, since it would grant them nothing of the device.
// A filing role may make either, in a home it lives in too: someone who both lives in a home
// and files for the building (the property owner, a technician or the gateway's administrator,
// filing the building's equipment in their own home) says which the device is, the building's
// or their own, and nothing about the caller decides it for them. A client SHOULD ask that person, and may choose
// for everyone else: COMPANY for a filing role outside the homes it lives in, RESIDENT for
// anyone without one.
message ClaimDevice {
  kusinta.iot.identity.v1.DeviceId device_id = 1;
  kusinta.iot.common.v1.DeviceOwnershipType ownership = 2;
  kusinta.iot.identity.v1.SpaceId initial_space_id = 3;

  // Evidence the claimant is standing at the device: the identifier printed on it,
  // matched against DeviceDescriptor.serial_number.
  //
  // The match is by SUFFIX, because what a connector announces is not always the whole
  // of what is printed and the announced value is commonly the tail of the printed one.
  // Both sides are normalised first — lowercased, with whitespace and ASCII hyphens
  // removed, since a label prints the value in groups and a scan does not — and the proof
  // is accepted when what remains ends with the announced serial. Spelled out because two
  // gateways normalising differently would accept different proofs for the same device.
  //
  // A serial shorter than eight characters cannot be proved at all: under a suffix rule a
  // short one is proved by almost anything ending with it. Required precisely when the
  // caller cannot already reach the device, which is the ordinary case for a
  // resident claiming something they just bought — an unfiled device is invisible
  // to them, so possession is the only thing left that can distinguish them from
  // someone guessing ids. The administrator, who can already reach it, needs no
  // proof. A device whose connector reports no serial can only be claimed by the
  // administrator.
  string possession_proof = 4;
}

// Gives up ownership. The device keeps whatever space filing it has, except that a device in a
// home stays filed in the home alone, as one of the building's own devices there — as when its
// owner moves out; if it has none it becomes unfiled. A device a person owns is released by
// that person alone. One claimed for the building is released by the property owner or a
// gateway administrator who reaches it, at any time; and, within 24 hours of the claim, by the
// filing role who made it, while they still reach it, no heating record binds it and no asset
// owner is recorded, so that a building claim made by mistake is undone by whoever made it.
// Anyone else is refused as NOT_ENTITLED. A heating record the release would leave
// across a home's boundary is undone, never refused (HEATING ACROSS A HOME).
message ReleaseDevice {
  kusinta.iot.identity.v1.DeviceId device_id = 1;
}

// Registers a device with the system that will admit it, so that it can join
// later. For a technology where a device is enrolled as a record rather than
// adopted during a window — see common.v1.PairingWindow for the other case, where
// something joins a hub during a window and the arrival is attributed to the
// caller. A LoRaWAN device has no window: it is written into a network server and
// joins whenever it is next powered, which may be minutes, days, or never.
//
// Answered with the ordinary ManagementAck. A provision writes a record and returns
// nothing to show; the device itself is announced by device_added if and when it
// joins, the same path every other device takes — which is why this adds no
// ManagementResult arm. A new result arm is a compile error in a consumer that
// matches the result exhaustively; a new request arm is not. What is registered and
// has not joined is read with ListProvisionedDevices.
//
// WHO MAY. A filing role — the property owner, a technician, the gateway's administrators —
// and an installer under an active commissioning grant (commissioning.v1, GRANTS) covering
// initial_space_id. Never a resident as such, and never service. Anyone else is refused as
// NOT_ENTITLED, as is a connector_id the caller is not told of.
//
// WHERE IT IS FILED. As StartPairing files a device that arrives during a window, and by its
// rules, save one: initial_space_id is required of every caller. It names where the device
// is — a room, or a common or technical space for the building's equipment — so that no
// registered device arrives unfiled, and whoever registered it knows where it went. One
// without it is refused as INVALID_REQUEST {"reason": "space"}; an installer names a space
// their grant covers. The gateway keeps initial_space_id and ownership as a pending
// registration, keyed by connector_id and the identifier in its technology's canonical form
// (LorawanProvisioning.dev_eui), and applies it when that connector first announces a device
// whose DeviceDescriptor.serial_number, normalised the same way, is that identifier: filed
// into initial_space_id, owned as ownership says. The device id is the connector's to derive
// and is not known before then. Into a home only as PlaceDeviceInSpace allows. Unset
// ownership lets the gateway decide from the caller's role, and an ownership the caller may
// not confer is refused (ClaimDevice, WHICH CLAIM). A pending registration holds no
// credential, and goes with the registration (DeprovisionDevice).
//
// Registering and owning remain distinct acts: ClaimDevice carries possession_proof, and
// because the connector derives the device id and the serial from the identifier here, a
// device registered without an ownership is still claimable by whoever holds it once it has
// joined.
//
// AN IDENTIFIER ALREADY REGISTERED. Replacing a registration is explicit, because a code is
// easily scanned twice or typed wrong. Checked in this order, the gateway's administrators
// excepted from the reach checks:
//   * a caller who does not reach the space an identifier's pending registration names is
//     refused as FAILED_PRECONDITION {"reason": "registration_known"}, with replace or
//     without, before anything else is said: so that they cannot tell where it is pending,
//     or whether by a registration or a device that has joined — the refusal itself says
//     the identifier is registered somewhere, which its label already discloses to whoever
//     holds the device — and an installer granted one space cannot take over a
//     registration made into another, breaking its join and moving it to theirs;
//   * without replace, a ProvisionDevice for an identifier that already has a pending
//     registration — registered, its device not yet joined — is refused as
//     FAILED_PRECONDITION {"reason": "registration_pending"}, whoever sends it. Two people
//     scanning the same device, or one request sent twice, never silently swap its key or
//     its space;
//   * with replace, it replaces the pending registration's credentials, model, space and
//     ownership: the deliberate correction of a mistyped key, without removing the
//     registration first;
//   * replace for an identifier with no pending registration, and no device that has joined
//     under it, is an ordinary registration;
//   * a device that has joined is re-keyed only deliberately, and only by one who reaches it.
//     A caller who does not reach a space it is filed in is refused as FAILED_PRECONDITION
//     {"reason": "device_known"}, with replace or without: otherwise anyone who may register
//     would silence a working device elsewhere by replacing the key it joined with. A caller
//     who reaches it, without replace, is refused as FAILED_PRECONDITION
//     {"reason": "device_joined"}, so a double send never re-keys a joined device; with
//     replace, it is re-keyed. A re-key takes effect only when the device next joins; until
//     then it keeps the session it has.
//
// THE ROOT KEY. The credentials are handled as their technology's message says
// (LorawanProvisioning.app_key). The gateway passes them to the connector
// (connector.v1 RegisterDevice) and keeps them nowhere: not in a log, not in its database,
// not in the pending registration, not in an answer, a refusal or a listing.
//
// REFUSALS, beyond NOT_ENTITLED, each a GatewayError with metadata {"reason": ...}:
//   INVALID_REQUEST "space"
//       initial_space_id is unset (WHERE IT IS FILED);
//   INVALID_REQUEST "dev_eui", "app_key", "join_eui"
//       that field is not the hex its technology's message states;
//   INVALID_REQUEST "default_app_key"
//       a key anyone can compute from the label or that ships as a default — the identifier
//       written twice, all zeros, a vendor's published default. A key of the registering
//       party's own is set on the device first;
//   INVALID_REQUEST "model_unknown"
//       model_id is empty or none the connector states (ConnectorDescriptor.provisioning_models);
//   FAILED_PRECONDITION "registration_known", "registration_pending"
//       for an identifier pending, as AN IDENTIFIER ALREADY REGISTERED says, in that order;
//   FAILED_PRECONDITION "device_known", "device_joined"
//       for an identifier whose device has joined, likewise in that order: "device_joined"
//       tells one who may re-key it that replace is what does;
//   FAILED_PRECONDITION "identifier_taken"
//       the registry holds the identifier somewhere this connector cannot write — another
//       tenant or application — so it is neither registered nor replaced here;
//   FAILED_PRECONDITION "provisioning_unsupported"
//       the connector does not declare supports_provisioning;
//   UNAVAILABLE "connector_unavailable"
//       the connector is not connected, or was asked and did not answer in time. Where it
//       was asked, what became of the registration is not known: the registry may hold it;
//   UNAVAILABLE "registry_unavailable"
//       the connector could not reach its registry; nothing was written;
//   UNAVAILABLE "registry_outcome_unknown"
//       the connector started writing the record and could not tell whether it landed: the
//       registry may hold it;
//   INTERNAL "registry_refused"
//       the registry would not take the record.
// A refusal adds nothing and changes nothing already held: no registration, credential or
// pending registration is written, replaced or removed by it. The two outcomes not known are
// the exception — "registry_outcome_unknown", and "connector_unavailable" once the connector
// was asked: the registry may hold the key, so the gateway keeps the registration pending as
// asked, listed (ListProvisionedDevices) and removable (DeprovisionDevice), until its device
// joins or it is removed. The app does not hold the key to retry.
message ProvisionDevice {
  // Required, unlike a pairing window's connector target. A registration is written
  // to one specific registry; there is no sensible "open them all and see what
  // joins". The app names it from the connector enumeration, targeting a connector
  // that declares ConnectorInfo.supports_provisioning.
  kusinta.iot.identity.v1.ConnectorId connector_id = 1;

  // What the registry needs to admit the device, which differs entirely by
  // technology — a oneof per technology rather than a flat set of fields, for the
  // reason LinkSettings gives: the second technology to arrive must not turn this
  // into a bag of unrelated optionals named after the first.
  oneof credentials {
    kusinta.iot.vendor.lorawan.v1.LorawanProvisioning lorawan = 2;
  }

  // Where to file the device when it joins, and what it becomes: as StartPairing's fields of
  // the same names, kept as a pending registration (WHERE IT IS FILED). initial_space_id is
  // required here, unlike there.
  kusinta.iot.identity.v1.SpaceId initial_space_id = 3;
  kusinta.iot.common.v1.DeviceOwnershipType ownership = 4;

  // Replace what is registered under the identifier, if anything is: its pending
  // registration, or the key of a device that has joined (AN IDENTIFIER ALREADY REGISTERED).
  // Unset, an identifier already pending is refused (registration_pending) and so is one whose
  // device has joined (device_joined), rather than replaced. Set only where the person asked
  // to correct a registration, never by default and never to retry a send.
  bool replace = 5;
}

// Removes a registration (ProvisionDevice) from the registry that holds it, so that a device
// registered by mistake — a mistyped identifier, a device going elsewhere — leaves no record
// holding its key. The undo of ProvisionDevice: distinct from ReleaseDevice, which gives up
// ownership, and RemoveDeviceFromSpace, which unfiles. Answered with ManagementAck; the
// gateway forwards it to the connector (connector.v1 UnregisterDevice) and drops the pending
// registration.
//
// WHO MAY. As ProvisionDevice: a filing role, and an installer under an active grant covering
// the space its pending registration names. Anyone else is refused as NOT_ENTITLED,
// as is an identifier the caller is not told of.
//
// A device in use is not removed: one that is claimed or filed anywhere is refused as
// FAILED_PRECONDITION {"reason": "device_in_use"} until it is released and taken out of its
// spaces (ReleaseDevice, RemoveDeviceFromSpace), so that removing a record never strands a
// device someone relies on. A registration whose device has not joined is neither.
//
// Refused otherwise as ProvisionDevice is: "provisioning_unsupported",
// "connector_unavailable", "registry_unavailable", "registry_outcome_unknown",
// "registry_refused". On any of these the pending registration is kept, so the removal can be
// asked again. Removing an identifier the registry does not hold succeeds.
message DeprovisionDevice {
  // The connector the device was registered with.
  kusinta.iot.identity.v1.ConnectorId connector_id = 1;

  // Which registration, by its technology's identifier.
  oneof identifier {
    // As LorawanProvisioning.dev_eui, in its canonical form; normalised by the gateway.
    string lorawan_dev_eui = 2;
  }
}

// Lists the registrations (ProvisionDevice) whose device has not yet joined, answered with
// ProvisionedDevices. A device that never joins — a wrong key, a device not powered, one out
// of range — is otherwise seen nowhere, and its registration can be removed only once it is
// found (DeprovisionDevice). A registration leaves the list when its device joins or the
// registration is removed.
//
// To a filing role, every such registration. To an installer under an active grant, those
// whose pending registration names a space the grant covers. Anyone else is refused as
// NOT_ENTITLED.
message ListProvisionedDevices {}

// One registration whose device has not yet joined. What identifies it and what was asked of
// it, never a credential. Who registered it is not given.
message ProvisionedDevice {
  kusinta.iot.identity.v1.ConnectorId connector_id = 1;

  // Was the device id it would be announced under. Not known before the join: that id is
  // the connector's to derive, and a registration is keyed by its connector and identifier.
  reserved 2;
  reserved "device_id";

  // As registered (LorawanProvisioning.model_id).
  string model_id = 3;

  // The pending registration (ProvisionDevice, WHERE IT IS FILED): where the device will be filed.
  kusinta.iot.identity.v1.SpaceId initial_space_id = 4;
  kusinta.iot.common.v1.DeviceOwnershipType ownership = 5;

  // When it was last registered: a re-key moves it.
  google.protobuf.Timestamp provisioned_at = 6;

  // The technology's identifier, in its canonical form (LorawanProvisioning.dev_eui): with
  // connector_id, what the registration is keyed by.
  oneof identifier {
    string lorawan_dev_eui = 7;
  }
}

// The answer to ListProvisionedDevices.
message ProvisionedDevices {
  repeated ProvisionedDevice devices = 1;
}

// Asks for the spaces the caller can reach. Unset root_space_id means all of
// them, which for most users is one apartment and for an administrator is the
// building.
message ListSpaces {
  kusinta.iot.identity.v1.SpaceId root_space_id = 1;
}

// The spaces themselves, flat: each Space carries its own parent_space_id, so the
// structure travels with the elements and a client rebuilds the tree from them.
// A flat list also degrades honestly when it is truncated — a partial tree with
// dangling parents is still readable, where a nested one would lose whole
// subtrees.
//
// device_ids on each Space are filtered to what the caller may see. An
// unfiltered tree would list every device on the gateway by id, which is the
// enumeration channel the snapshot filter exists to close. To a caller who sees a home as
// service, what is new in it is listed as it happens and what is gone at once, its members
// included where they are shown (see Space.members).
message SpaceTree {
  repeated kusinta.iot.space.v1.Space spaces = 1;
}

// The answer to an operation that changes something and has nothing to return.
// Deliberately empty: ManagementResult.in_reply_to says which request succeeded,
// and what the change did to the caller's reach arrives on LivePermissionUpdate
// rather than here.
message ManagementAck {}

// A single filing operation, app → gateway. One wrapper rather than ten payload
// cases on AppMessage: authorization for filing depends on the target, not on the
// message kind, so these can never be gated by a table keyed on the envelope case
// the way device messages are. Keeping them behind one case means one place that
// must authorize, and one refusal path that must not leak whether a target exists.
// Links one device to another, so the sender leads the receiver. The gateway
// resolves which underlying connections that needs and asks the connector for
// them; a caller names two devices and what the link is for.
//
// Authorized against both ends, and not symmetrically. Leading a device is a
// standing grant of control over it, so the receiver requires ownership or a
// servicing role. The sender's requirement depends on the mode: a gateway-kept
// link only reads what the caller can already see, while a device-to-device one
// writes configuration to the sender and spends its battery, which is a change
// to someone else's hardware.
//
// In a home it is the other way round: links between its devices are its residents' to
// make, change and remove, and in an empty home (household.proto, EMPTY HOME) the property
// owner's and the gateway administrators' who reach it; any other caller who reaches it as
// service is refused as NOT_ENTITLED. A link between a device in a home and one outside it is
// refused to anyone.
// The same holds for UpdateDeviceLink and RemoveDeviceLink.
message CreateDeviceLink {
  kusinta.iot.identity.v1.DeviceId sender = 1;
  kusinta.iot.identity.v1.DeviceId receiver = 2;
  kusinta.iot.link.v1.LinkFunction function = 3;

  // Unset lets the gateway choose, which prefers a device-to-device link where
  // one can be brokered: it survives a gateway outage and runs at the devices'
  // own rate. Name one to override that.
  kusinta.iot.link.v1.LinkMode mode = 4;

  // How a gateway-kept link is to behave, set as it is made. Carried here as
  // well as on UpdateDeviceLink so that a link does not have to exist in a
  // configured-by-nobody state first — a soft climate link created without a
  // target is one that holds the room at nothing until a second request
  // arrives, and every reader would have to handle that transient forever.
  //
  // Unset is still allowed and still means unconfigured, since a hard link has
  // nothing to configure and a caller may genuinely not know the target yet.
  kusinta.iot.link.v1.LinkSettings settings = 5;
}

// Removes a link. Note that on at least one vendor, removing a link disturbs the
// receiver's own settings and the connector must repair them, so this is not the
// no-op it appears to be.
message RemoveDeviceLink {
  string link_id = 1;
}

// Changes how a gateway-kept link behaves — for a climate lead, the temperature
// it is to hold.
//
// Refused on a link that has nothing to configure — see LinkSettings — rather
// than accepted as a no-op, so that a caller who has mistaken which link they
// are holding is told.
//
// Authorized against both ends, as creating and removing the link are: deciding
// what temperature a room is held at is directing a device, not adjusting one,
// so it takes ownership of the ends or a servicing role, not the permission to
// turn a thermostat up. In a home it is its residents' instead (see CreateDeviceLink).
message UpdateDeviceLink {
  string link_id = 1;

  // Replaces the link's settings rather than patching them: the settings of one
  // function are few and are set together, so there is no half-update worth
  // expressing. This is why it does not follow UpdateSpace's per-field optional
  // shape, which exists for a message whose fields genuinely move alone.
  //
  // Unset is refused rather than being given a meaning. It would have to mean
  // either "leave everything alone", making the request a no-op, or "clear the
  // settings", which is the one thing that reads like an accident — and the
  // wire cannot tell those two callers apart.
  kusinta.iot.link.v1.LinkSettings settings = 2;
}

// Lists links. Unset device_id lists every link among devices the caller can
// reach; naming one narrows it to that device's own, in either direction.
//
// A link with an end in a home reaches a caller who sees it as service with
// DeviceLink.details_withheld set, and what that withholds unset — a new link
// as it is made, a removed one at once — and not at all when either end is a
// device a resident owns.
message ListDeviceLinks {
  kusinta.iot.identity.v1.DeviceId device_id = 1;
}

// Sets the temperature a room is to be held at.
//
// Authorized as adjusting, not directing: WRITE on the room is enough. It is the same act
// as turning a radiator's knob; setting up what the room obeys is ConfigureRoomClimate,
// and stays with owners, except the lock in a home.
//
// In a home, only its residents may set it, and in an empty home the property owner and the
// gateway administrators who reach it (household.proto, EMPTY HOME); any other caller who
// reaches the room as service is refused as NOT_ENTITLED.
//
// Clamped to the room's inner limits (climate.v1.InnerRoomLimits) rather than refused outside
// them, and the clamped value is what the room's RoomClimate then reports; never to the outer
// ones (climate.v1.OuterRoomLimits, WHAT THEY BIND).
message SetRoomTarget {
  kusinta.iot.identity.v1.SpaceId room_id = 1;

  // Unset clears the target: the room goes back to having none (NO_TARGET) and its
  // devices to their own behaviour. With presence, so that a request that forgot the
  // field is not read as 0 °C and clamped to the room's minimum.
  optional sint32 target_centidegrees = 2;
}

// The sensors a room measures with, in order of preference. A message of its own so that
// "leave the sensors alone" (unset) differs from "set" on the wire. It orders the
// building's sensors only (see climate.v1.RoomClimate.sensor_ids); set but empty returns
// them to the default, every building temperature sensor filed in the room in filing
// order.
message RoomSensors {
  repeated kusinta.iot.identity.v1.DeviceId sensor_ids = 1;
}

// A room's limits. A message of its own so that "leave the limits alone" (unset) differs
// from "set" — and, set, an unset bound inside it removes that bound, which a bare
// optional on the request could not say.
message RoomLimits {
  optional sint32 min_centidegrees = 1;
  optional sint32 max_centidegrees = 2;
}

// One bound that moves alone, for the same reason as RoomLimits: unset leaves the bound as it
// is; set, an unset centidegrees removes it.
message RoomLimitValue {
  optional sint32 centidegrees = 1;
}

// Configures what a room obeys: its outer limits, its sensors, and whether a change made by
// hand at one of its devices counts. Authorized as directing, because this decides what
// everybody in the room can do, and each part by its own deciders:
//   * the outer limits — limits, away_min, move_in_target (climate.v1.OuterRoomLimits) — the
//     property owner or a gateway administrator who reaches the room, or an installer under an
//     active commissioning grant covering it (commissioning.v1, GRANTS), in a home or not. A
//     household's own limits are SetInnerRoomLimits;
//   * sensors — ROLE_PROPERTY_OWNER or a filing role. It orders only the building's own
//     sensors (see RoomClimate.sensor_ids);
//   * lock_device_controls — in a home, its residents', who may send this request with nothing
//     else set, and in an empty home the property owner's and the gateway administrators' who
//     reach it (household.proto, EMPTY HOME); outside homes, ROLE_PROPERTY_OWNER's or a filing
//     role's, as the sensors are.
// A request that sets anything its caller may not is refused whole as NOT_ENTITLED, so nothing
// of it applies, with metadata {"field": the first such part, by its proto field name —
// "limits", "away_min", "move_in_target", "sensors" or "lock_device_controls"}, which tells the
// caller only what they may not set. Rollout note: outer limits were once a filing role's; a
// filing role that is neither ROLE_PROPERTY_OWNER nor ROLE_GATEWAY_ADMIN, without a grant, is
// now refused them, so an app offers the outer limits to those roles alone and sends sensors on
// their own.
//
// Each outer bound the request changes is stamped with the caller's role and the time
// (climate.v1.OuterLimit); one set to the value it has keeps its stamp. As the outer limits
// will stand, min above max, away_min above min or max, or move_in_target outside [min, max]
// where those are set, is refused as INVALID_REQUEST with metadata {"reason": "limits_order"}.
// A min changed to below the gateway's public-health threshold — its own setting, which no
// operation in this contract changes; none while unset — needs accept_below_threshold, and is
// refused without it as FAILED_PRECONDITION with metadata {"reason": "below_threshold",
// "threshold_centidegrees": the threshold}. Outer limits that change so that a valve they bind
// could not be set between them — no step of its setpoint grid, or of its own limit settings,
// whichever is coarser, lies in [min, max], or in [away_min, max] where min is unset — are
// refused as INVALID_REQUEST with metadata {"reason": "limits_no_setpoint",
// "step_centidegrees": that coarsest step, as a decimal string}. It is judged only over valves
// the caller sees, so it tells them nothing of a device hidden from them; a valve filed later,
// or hidden from whoever set the limits, whose grid leaves no step between them is held at the
// minimum. Limits the request leaves as they are are not judged again. In a home, limits_order
// is judged on the room's own limits as they will be stored, and limits_no_setpoint on them as
// read within the building's home bounds, which is what its valves are held at; a bound set
// outside the home bounds is accepted as it is, and read within them (climate.v1
// .OuterRoomLimits, HOME BOUNDS). Nothing in the answer to the outer limits depends
// on the home's state — its targets, inner limits, modes, or who lives there — so setting them
// tells the caller nothing of it; what they clamp is told to the household alone
// (RoomClimate.outer_limit_clamp). Only the lock in the same request is decided by whether the
// home is empty, as EMPTY HOME says.
//
// Each field moves alone, as on UpdateSpace: unset leaves it as it is.
message ConfigureRoomClimate {
  kusinta.iot.identity.v1.SpaceId room_id = 1;

  // The outer limits' min and max (climate.v1.OuterRoomLimits); replaces both bounds, see
  // RoomLimits.
  RoomLimits limits = 2;

  // Only the building's sensors filed in this room; any other — including a sensor a
  // resident owns — is refused, the same way whether or not it exists.
  RoomSensors sensors = 3;

  optional bool lock_device_controls = 4;

  // The outer limits' away minimum and move-in target, each alone; see RoomLimitValue.
  RoomLimitValue away_min = 5;
  RoomLimitValue move_in_target = 6;

  // The caller accepts a min below the public-health threshold, recorded with the bound
  // (OuterRoomLimits.min_accepted_threshold_centidegrees). Ignored on a request that sets no
  // such min.
  bool accept_below_threshold = 7;
}

// Sets a room's inner limits (climate.v1.InnerRoomLimits). Answered with ManagementAck. A
// household admin of the home the room is in only (household.proto, HOUSEHOLD ADMIN); anyone
// else, and a room in no home, is refused as NOT_ENTITLED — never covered by a commissioning
// grant. min above max is refused as INVALID_REQUEST with metadata {"reason": "limits_order"}.
// Bounds outside the outer limits are accepted as they are (climate.v1.OuterRoomLimits, HELD).
// The room's target is clamped into the new limits.
message SetInnerRoomLimits {
  kusinta.iot.identity.v1.SpaceId room_id = 1;

  // Replaces both bounds: a bound unset in it, or limits unset, removes them.
  kusinta.iot.climate.v1.InnerRoomLimits limits = 2;
}

// Sets the comfort preference of a home or of one of its rooms (climate.v1.ComfortPreference),
// or clears it. Answered with ManagementAck; the rooms it changes are sent again
// (RoomClimateChanged): the room, or every room of the home that follows the home's.
//
// Any resident of the home, household admins included, as SetRoomTarget is, an admin-less home's
// residents among them (household.proto, ADMIN-LESS HOME): the household admins' inner limits
// still fence the band (climate.v1.ComfortPreference, THE BAND). Anyone else is refused as
// NOT_ENTITLED — never covered by a commissioning grant, and never the property owner's or a
// gateway administrator's, the home empty or not; a staff member who is a resident of the home
// sets it as a resident. A space that is neither
// an apartment nor a room in one is refused as NOT_ENTITLED with the same metadata, so the answer
// tells nothing of where a home is. Refused as INVALID_REQUEST with metadata {"reason":
// "comfort_preference"} for preset UNSPECIFIED, and for CUSTOM with below_target_centidegrees
// above 500 or above_target_centidegrees above 200. A band reaching below the public-health
// floor is not refused: its low edge stops there (climate.v1.ComfortPreference, THE BAND).
//
// Unset preference clears it: a room then follows its home's again, and a home goes back to the
// default. A preference equal to the one held is acked and changes nothing.
//
// Rollout note: a gateway that predates comfort preferences does not know this request. An app
// offers it only to a gateway that sends RoomClimate.home_comfort_preference.
message SetComfortPreference {
  // An apartment, or a room in one.
  kusinta.iot.identity.v1.SpaceId space_id = 1;

  kusinta.iot.climate.v1.ComfortPreference preference = 2;
}

// Switches a mode on a space on, or off with kind UNSPECIFIED. WRITE on the space.
// Switching one on needs setback_centidegrees; a mode with nothing to set back to is
// refused. Switching one on is refused on a room inside an apartment, whose rooms follow
// the apartment's mode alone; such a room carries none (see climate.v1.ClimateMode), and
// switching one off there is accepted and does nothing — for those who may switch modes in
// that home at all, which is checked first: anyone else is refused as NOT_ENTITLED.
//
// In a home, only its residents may switch one on or off: whether a home stands empty is
// theirs to say. A caller who reaches it as service is refused as NOT_ENTITLED — except
// that, while the home is empty (household.proto, EMPTY HOME), ROLE_PROPERTY_OWNER or
// ROLE_GATEWAY_ADMIN may switch one on, and switch off one that is on, so that no mode
// outlives everyone who could end it. Any other switch-off from them — in a home that is not
// empty, or with no mode on — is accepted and does nothing, so the answer tells them nothing of
// whether a mode was on.
message SetClimateMode {
  kusinta.iot.identity.v1.SpaceId space_id = 1;
  kusinta.iot.climate.v1.ClimateModeKind kind = 2;
  optional sint32 setback_centidegrees = 3;

  // HOLIDAY only; both required there. Refused on AWAY.
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
}

// Lists the room climates and modes a caller may see. Unset root_space_id lists every
// one the caller can reach; naming a space narrows it to that space and those below.
//
// A caller who reaches a room inside an apartment as service gets it with
// RoomClimate.state_withheld set — what is new as it happens, what is gone at once — and
// gets no ClimateMode set on that apartment or its rooms; save the property owner and the
// gateway administrators while the home is empty, who get both as for a space outside homes
// (household.proto, EMPTY HOME).
message ListRoomClimates {
  kusinta.iot.identity.v1.SpaceId root_space_id = 1;
}

// Reads a room's history at one resolution, answered with a climate.v1.RoomHistory. Needs
// READ on the room.
//
// The range is half-open: a bucket is returned when from_time <= at < to_time, so
// back-to-back windows neither repeat nor skip a bucket. Unset to_time means now; unset
// from_time means RoomHistory.kept_from. Both are clamped to [kept_from, now]. A long range is
// answered newest first, in capped pages (RoomHistory.covered_from).
//
// A room in a home is readable by its residents only, and only from the start of their
// current residency (see access.v1.MembershipRelation). A caller who reaches it as service is
// refused as NOT_ENTITLED; one who reaches the apartment itself has
// GetApartmentClimateSummary instead.
message GetRoomHistory {
  kusinta.iot.identity.v1.SpaceId room_id = 1;
  google.protobuf.Timestamp from_time = 2;
  google.protobuf.Timestamp to_time = 3;

  // The resolution wanted. Unset, or one the gateway does not give, and the gateway chooses
  // from the request and the resolutions alone, never from what it holds: the finest
  // resolution it gives that it keeps for long enough to reach back to from_time, and whose
  // bucket length fits the span from from_time to to_time (unset: now) into no more buckets
  // than one answer may give samples (RoomHistory.covered_from); where none does, or from_time
  // is unset, the coarsest. How long each is kept is the gateway's, the same for every room and
  // recipient, so the choice tells nothing of a room or of who may read it.
  kusinta.iot.climate.v1.RoomHistoryResolution resolution = 4;
}

// Reads a heat source's history at one resolution, answered with a climate.v1.PlantHistory, as
// GetRoomHistory reads a room's: the same range, clamping, paging and choice of resolution.
// Whose buckets the caller is given is as climate.v1.PlantHistory says: a home's plant to its
// residents only, from the start of their current residency; a plant outside homes to the
// property owner and the gateway administrators. Anyone else, and a plant that does not exist,
// is refused as NOT_ENTITLED with the same metadata, as is a caller who reaches the home only as
// service: a heat source's readings with their times are never service's.
message GetPlantHistory {
  string plant_id = 1;
  google.protobuf.Timestamp from_time = 2;
  google.protobuf.Timestamp to_time = 3;
  kusinta.iot.climate.v1.RoomHistoryResolution resolution = 4;
}

// BUILDING PLANNING. What a building's planner is given from outside it (planning.v1): the
// day-ahead bidding zone its electricity is priced in, and the forecast cell it lies in. One
// record per building — a top-level space — read with GetBuildingPlanning and replaced whole
// with PutBuildingPlanning. A gateway serving several buildings asks the api-server for each
// distinct zone and cell its records name, and for nothing a record does not name.
//
// Neither value is household data: a household's handover keeps the record, and deleting the
// building removes it. It is never reported to the api-server, which learns the zone and the
// cell only as planning.v1 asks carry them.
//
// THE CELL, NEVER A POSITION. A client that takes the building's position from its own device
// rounds it down to the forecast cell's corner on that device (planning.v1.ForecastCell) and
// sends only the corner. The exact position is never put, stored, logged or sent, by a client
// or by the gateway. A client that offers the cell from the device's location asks for the
// location only when the person chooses to give it, and offers typing the cell's position in
// as the alternative.
//
// WHO. Given to and put by the property owner and the gateway's administrators
// (access.v1.ROLE_PROPERTY_OWNER, access.v1.ROLE_GATEWAY_ADMIN) who reach the building, and by
// an installer under a commissioning grant on the building (commissioning.v1, GRANTS), as
// facts about spaces outside homes are. Where the building is itself a home (a detached house,
// whose one top-level space is the home), its household admins (household.v1) are given and
// put it too: there is no other owner to set it for them. A household admin of a home inside a
// building is not. Anyone else is refused as NOT_ENTITLED. The prices themselves are given
// more widely: GetDayAheadPrices.

// Reads a building's planning record. Answered as BuildingPlanning.
message GetBuildingPlanning {
  // The building: a top-level space. Any other space is refused as INVALID_REQUEST.
  kusinta.iot.identity.v1.SpaceId space_id = 1;
}

// Replaces a building's planning record whole. Answered as BuildingPlanning, as it now stands.
//
// A zone and a cell together turn the building's planning inputs on: the gateway asks for
// prices and the forecast from then on. Without either, it asks for nothing for the building,
// and no PLANNING_INPUTS_STALE is opened for it (reporting.v1). A put without a zone and a cell
// removes them: nothing of them is kept.
message PutBuildingPlanning {
  // The building: a top-level space. Any other space is refused as INVALID_REQUEST.
  kusinta.iot.identity.v1.SpaceId space_id = 1;

  // The bidding zone's short code, as planning.v1.GetPlanningInputsRequest.bidding_zone names
  // it: "SE1" to "SE4". A client offers the zone the building's grid connection is in. Its
  // location may suggest one, but the connection decides, and the zone is printed on the
  // grid operator's invoice. A code the gateway does not know is refused as INVALID_REQUEST
  // with metadata {"reason": "bidding_zone"}. Empty: none.
  string bidding_zone = 2;

  // The forecast cell's corner. A cell planning.v1.ForecastCell refuses is refused here as
  // INVALID_REQUEST with metadata {"reason": "forecast_cell"}. Unset: none.
  kusinta.iot.planning.v1.ForecastCell forecast_cell = 3;

  // The owner's choice to keep the building's planning inputs off while both values are
  // set: the gateway asks for nothing for the building. False, the default, leaves them on.
  bool inputs_off = 4;
}

// A building's planning record, and how its inputs stand.
message BuildingPlanning {
  kusinta.iot.identity.v1.SpaceId space_id = 1;

  // As put. Empty, unset: none.
  string bidding_zone = 2;
  kusinta.iot.planning.v1.ForecastCell forecast_cell = 3;
  bool inputs_off = 4;

  // The end of the last price interval the gateway holds for the zone without a gap from the
  // current interval on, as the stale rule reads them. Unset where it holds no current one.
  google.protobuf.Timestamp prices_through = 5;

  // When the forecast the gateway holds for the cell was issued. Unset where it holds none.
  google.protobuf.Timestamp forecast_issued_at = 6;

  // Whether the building's inputs are stale, by the rule of reporting.v1
  // PROBLEM_KIND_PLANNING_INPUTS_STALE. False while the inputs are off, or while the gateway
  // has not yet asked for them since they were put.
  bool stale = 7;
}

// BUILDING ROOM LIMITS. Two settings per building — a top-level space — each a minimum and a
// maximum, each optional (climate.v1.BuildingLimits):
//   * HOMES, for the rooms of every home in it, a home's rooms being those under an apartment:
//     hard outer bounds, set as policy without seeing any reading. Every room in a home has its
//     own outer limits read within them, at once and for as long as they stand
//     (climate.v1.OuterRoomLimits, HOME BOUNDS), and whoever sets a room's own limits, or the
//     household's (SetInnerRoomLimits), sets them inside the bounds as before. The household is
//     told them on each of its rooms (climate.v1.RoomClimate.home_bounds);
//   * COMMON_AREAS, for every other room in the building: not a bound, but the rooms' own outer
//     limits, given to them by DEFAULT and APPLY below and by nothing else. A room's limits may be
//     changed room by room afterwards (ConfigureRoomClimate), as before.
// Each acts on rooms of its kind in two ways:
//   * DEFAULT. A room created in the building (CreateSpace, SPACE_TYPE_ROOM) takes its kind's
//     setting as its own outer min and max: each bound the setting has, with the setting's stamp
//     (climate.v1.OuterLimit) and, for min, its acceptance of the threshold. A room that changes
//     kind later — moved into or out of a home, or its space becoming or ceasing to be an
//     apartment — takes nothing: its own limits stay, and in a home are read within the home
//     bounds;
//   * APPLY. A setting applied (SetBuildingRoomLimits.apply_to_rooms) is written, as it then
//     stands, into every room of its kind in the building, empty homes included, each bound the
//     setting has replacing the room's own, with the acceptance of the threshold for min: each
//     bound it changes stamped with the caller's role and the time, one at the value it has
//     keeping its stamp. A bound the setting lacks leaves the rooms' as it is. Where a room's
//     own bound would then stand out of order with those written — its max below the min
//     written or its min above the max written, its away_min above its min or its max, or its
//     move_in_target outside [min, max] — it is moved to the bound it passes, stamped likewise,
//     so that every room takes the setting and none is refused.
// Changing or clearing a setting rewrites no room: the rooms keep the limits they have. In a
// home, a room's own limits that the home bounds hold back come back into force as they stand
// when the bounds loosen or are cleared (climate.v1.OuterRoomLimits, HOME BOUNDS). A room whose
// climate a change moves is sent again (RoomClimateChanged) to each recipient as what they are
// sent of it changes. To a recipient sent the room with state_withheld, a room is sent again only
// where what they are sent of it changed (outer_limits as read, home_bounds), never for what only
// the household is shown: a change of the home bounds sends every home room of the building
// again to them, since its home_bounds changed, whatever it did to each home.
//
// PRIVACY. Staff write into homes and read nothing of them back. Nothing in an answer depends on
// any home's state — its targets, its limits, its devices, who lives there or whether anyone
// does. A setting is judged on its own values alone, never against the valves of the rooms it
// reaches (ConfigureRoomClimate, "limits_no_setpoint"): a valve whose grid leaves no step
// between the bounds is held at the minimum, as one filed later is. Applying is answered with a
// count of the rooms written, and nothing per room or per home. What the home bounds clamp is
// told to the household alone (climate.v1.RoomClimate.outer_limit_clamp).
//
// WHO. Given to and set by the property owner and the gateway's administrators
// (access.v1.ROLE_PROPERTY_OWNER, access.v1.ROLE_GATEWAY_ADMIN) who reach the building. No
// commissioning grant covers them, and anyone else is refused as NOT_ENTITLED. Each bound is
// stamped with the role its setter acted in: ROLE_PROPERTY_OWNER where they hold it, else
// ROLE_GATEWAY_ADMIN. Neither setting is household data: a household's handover keeps them, and
// deleting the building removes them. A resident is told the home bounds on their rooms, and
// nothing of the common areas' setting beyond the limits of the rooms they are sent.

// Which of a building's two room-limit settings (BUILDING ROOM LIMITS).
enum BuildingRoomKind {
  BUILDING_ROOM_KIND_UNSPECIFIED = 0;

  // The rooms of every home in the building: those under an apartment.
  BUILDING_ROOM_KIND_HOMES = 1;

  // Every other room in the building.
  BUILDING_ROOM_KIND_COMMON_AREAS = 2;
}

// Reads a building's room-limit settings. Answered as BuildingRoomLimits.
message GetBuildingRoomLimits {
  // The building: a top-level space. Any other space is refused as INVALID_REQUEST.
  kusinta.iot.identity.v1.SpaceId space_id = 1;
}

// Sets, changes or clears one of a building's room-limit settings, and applies it to every room
// of its kind where asked (BUILDING ROOM LIMITS). Answered as BuildingRoomLimits, as it now
// stands.
//
// Each bound it changes is stamped with the caller's role and the time
// (climate.v1.BuildingLimits); one set to the value it has keeps its stamp. Refused, changing
// nothing and applying nothing:
//   * kind UNSPECIFIED, as INVALID_REQUEST with metadata {"reason": "kind"};
//   * min above max, as INVALID_REQUEST with metadata {"reason": "limits_order"};
//   * a min changed to below the gateway's public-health threshold without
//     accept_below_threshold, as FAILED_PRECONDITION with metadata {"reason": "below_threshold",
//     "threshold_centidegrees": the threshold}, as ConfigureRoomClimate refuses one.
// Nothing else is judged, the rooms it reaches least of all (BUILDING ROOM LIMITS, PRIVACY).
message SetBuildingRoomLimits {
  // The building: a top-level space. Any other space is refused as INVALID_REQUEST.
  kusinta.iot.identity.v1.SpaceId space_id = 1;

  BuildingRoomKind kind = 2;

  // Replaces both bounds of the setting, see RoomLimits: a bound unset in it, or limits unset,
  // removes it, and with neither bound the setting is cleared, which rewrites no room.
  RoomLimits limits = 3;

  // The caller accepts a min below the public-health threshold, recorded with the setting
  // (climate.v1.BuildingLimits.min_accepted_threshold_centidegrees). Ignored on a request that
  // sets no such min.
  bool accept_below_threshold = 4;

  // Also write the setting, as it then stands, into every room of its kind in the building, in
  // the same step (BUILDING ROOM LIMITS, APPLY). Sent with the limits the setting already has, it
  // applies them again and changes nothing of the setting.
  bool apply_to_rooms = 5;
}

// A building's room-limit settings.
message BuildingRoomLimits {
  kusinta.iot.identity.v1.SpaceId space_id = 1;

  // Each unset where the building has none.
  kusinta.iot.climate.v1.BuildingLimits homes = 2;
  kusinta.iot.climate.v1.BuildingLimits common_areas = 3;

  // Set only in the answer to a request with apply_to_rooms: how many rooms the setting was
  // written to — every room of its kind in the building, or none where the setting has no bound.
  // Nothing per room or per home.
  optional uint32 rooms_applied = 4;
}

// Reads the day-ahead prices for the bidding zone of the building a space is in, so that a
// client can draw them. Answered as DayAheadPrices.
//
// Given to anyone who reaches the space, residents and service included: a price is for a
// zone, never for a home, and says nothing of anyone. Only the raw market price is answered.
// What a household pays on top of it — the grid fee, taxes, the supplier's margin — is not
// part of this record.
message GetDayAheadPrices {
  // Any space the caller reaches. Answered for the building it is in.
  kusinta.iot.identity.v1.SpaceId space_id = 1;

  // [from_time, to_time). Intervals overlapping it are answered. Unset from_time: the start of
  // the current day in the bidding zone's own time. Unset to_time: from_time plus 31 days,
  // and no further than the last interval held; where none is held after from_time, the
  // answer is empty. A to_time the caller sets more than 31 days after from_time, or not
  // after it, is refused as INVALID_REQUEST with metadata {"reason": "span"}.
  google.protobuf.Timestamp from_time = 2;
  google.protobuf.Timestamp to_time = 3;
}

// The prices GetDayAheadPrices asked for.
message DayAheadPrices {
  // The zone they are for. Empty where the building has none, and then no prices are given.
  string bidding_zone = 1;

  // Oldest first and never overlapping, as the gateway holds them. A time no interval covers
  // is a gap, never a price of zero, and a client draws it as one. Empty where the gateway
  // holds none in the span.
  repeated kusinta.iot.planning.v1.PriceInterval prices = 2;

  // The reference rates a client converts the prices at, as planning.v1.ExchangeRate says:
  // every rate the gateway holds from the day of the first price on, and the last one before
  // it, oldest first. Empty where it holds none; a client then shows the prices in euros.
  repeated kusinta.iot.planning.v1.ExchangeRate exchange_rates = 3;
}

// SPACE ADDRESS. The street address of a building or a home, kept on the gateway so that the
// people who look after the building can find it: its owner, and a technician sent to fix
// something. A block of flats keeps one address on the building; row houses keep one on each
// home, since each has its own street number.
//
// Only a top-level space or a home (household.v1) holds an address. Any other space is
// refused as INVALID_REQUEST.
//
// KEPT ON THE GATEWAY. An address is never part of any message the gateway sends upstream,
// never logged, and never used to look anything up with a third party. A household's
// handover keeps it, since it describes the house, not the household; deleting the space
// removes it.
//
// WHO. Given to anyone who reaches the space, service included. Put by the property owner and
// the gateway's administrators who reach it, and on a home by the home's household admins.
// Anyone else is refused as NOT_ENTITLED. Residents of a home inside a building reach the
// home, not the building, so they read their home's address but not the building's. That
// service sees a home's address is disclosed to its residents (access.v1
// SERVICE_SIGNAL_ADDRESS in PrivacyDisclosure).

// Reads a space's address. Answered as SpaceAddress.
message GetSpaceAddress {
  kusinta.iot.identity.v1.SpaceId space_id = 1;
}

// Replaces a space's address whole. Answered as SpaceAddress, as it now stands.
message PutSpaceAddress {
  kusinta.iot.identity.v1.SpaceId space_id = 1;

  // Unset: the address is removed, and nothing of it is kept.
  PostalAddress address = 2;
}

// A postal address, as a person writes it. Free text in each field; a field's bound counts
// Unicode code points, not bytes or UTF-16 code units. A set address without a street, a
// field longer than its bound, or a country that is not two capital letters is refused as
// INVALID_REQUEST with metadata {"reason": "address"}.
message PostalAddress {
  // The street and number, with any entrance or flat: "Exempelgatan 1". Up to 200 characters.
  string street = 1;
  // As written locally: "123 45". Up to 16 characters. Empty: none.
  string postal_code = 2;
  // Up to 100 characters. Empty: none.
  string town = 3;
  // ISO 3166-1 alpha-2: "SE". Empty: none.
  string country = 4;
}

// A space's address.
message SpaceAddress {
  kusinta.iot.identity.v1.SpaceId space_id = 1;

  // Unset: the space has none.
  PostalAddress address = 2;
}

// What the parties who do not live in a private space learn of it — the answer to a
// resident asking who can see what in their home, in reply to GetPrivacyDisclosure.
//
// It states the policy, the kinds of party it applies to now and the people counted under
// each (ServiceParty.names): a resident learns which technicians can see the battery of
// their radiator valve. The names say who has reach, never where anyone lives.
message PrivacyDisclosure {
  // An apartment, or a room in one.
  kusinta.iot.identity.v1.SpaceId space_id = 1;

  reserved 2 to 3; // held by a flat list of roles and signals in a draft; per party instead

  // The kinds of party who see this space, or any part of it, as service now — or would
  // through another membership, were they not its residents — each role once, with what
  // that role brings here. Each party is listed under every role it holds other than
  // ROLE_RESIDENT, and sees what its entries say together; one with no other role, or whose
  // role the gateway has not yet learnt, counts as ROLE_UNSPECIFIED. ROLE_GATEWAY_ADMIN is
  // always listed, and ROLE_PROPERTY_OWNER whenever anyone holds it, wherever they are
  // filed: both may file themselves on the home. So the list reads the same whether or not
  // anyone lives in the home, and never understates who has reach or what they see. Devices a
  // resident owns are not shown to service at all.
  repeated ServiceParty service_parties = 5;

  // How finely the space's climate is summarised for service, as means over periods of
  // this length (climate.v1.ApartmentClimateSummary). UNSPECIFIED: no summary is given.
  // The gateway's own setting, WEEK unless it is configured otherwise; no operation in this
  // contract changes it. A change applies to periods that open after it: service is given
  // no period that opened before the last change. A household's clear of its climate history
  // (ClearClimateHistory) likewise leaves service no period from before the clear, and none
  // until the first period that starts at or after it has closed.
  kusinta.iot.climate.v1.ClimateSummaryPeriod climate_summary_period = 4;

  // The name of the organisation that owns the gateway, and so the property, as the vouched
  // set gives it (signaling.v1.VouchedAdministrators.organisation_name); empty while the
  // gateway holds no vouched set. Never its organisation number. SetOwnerOrganisation, which
  // once set it, is superseded.
  string owner_organisation_name = 6;

  // Set when ServiceParty.names are not given to this caller, so that empty lists are not
  // read as nobody being named. Names are given to the home's own residents and to a
  // caller holding ROLE_GATEWAY_ADMIN or ROLE_PROPERTY_OWNER, and withheld from anyone
  // else: a technician who reaches the home learns the kinds of party, not who they are.
  bool names_withheld = 7;

  // Each staff appointment (household.proto, STAFF APPOINTMENT) of a member who lives in this
  // home now, made during their current residency — the one that began at an appointment
  // invite's redeem included — oldest first: whoever joins the household later learns who put
  // its admins there. Given to the home's residents only, and so never to a caller who sees it
  // as service: a client shows it to residents alone.
  repeated StaffAppointment staff_appointments = 8;

  // Each commissioning grant on this home that was granted since it was last wiped, oldest
  // first, active ones included, and those the property owner or a gateway administrator
  // granted while it stood empty among them (commissioning.v1, GRANTS): who held commissioning
  // access to the home, and when. Given to the home's residents only, as staff_appointments is.
  repeated kusinta.iot.commissioning.v1.CommissioningGrantRecord commissioning_grants = 9;
}

// One kind of party with service reach of a home, and what it sees there. Every service
// party sees the same kinds of thing of the part of the home it reaches — a whole
// ServiceStatus, nothing withheld from it — so signals differ between parties only in
// RESIDENTS. How much of the home that part is, a room or all of it, the disclosure does
// not say.
message ServiceParty {
  kusinta.iot.access.v1.Role role = 1;
  repeated kusinta.iot.access.v1.ServiceSignal signals = 2;

  // Each person counted under this role, by the name they gave their account
  // (AppTokenClaims.name), once each: everyone holding ROLE_GATEWAY_ADMIN or
  // ROLE_PROPERTY_OWNER, every vouched administrator included whether or not the gateway has
  // seen their token, and everyone else counted here by a SERVICE membership. A person counted
  // under several roles is named under each. An empty string stands for a person whose name
  // the gateway has not learnt, so the list is as long as the number of people. Self-chosen,
  // so the app shows it as the name they gave rather than as a verified identity. Empty for
  // every party when PrivacyDisclosure.names_withheld is set.
  repeated string names = 3;
}

// Asks what the parties who do not live in a space learn of it, answered with a
// PrivacyDisclosure. For an apartment or a room in one, and refused on any other
// space. Needs READ on the space.
message GetPrivacyDisclosure {
  kusinta.iot.identity.v1.SpaceId space_id = 1;
}

// Reads an apartment's climate as means over whole periods, answered with a
// climate.v1.ApartmentClimateSummary. Needs READ on the apartment itself. Refused on a
// space that is not an apartment, and while the building's time zone (Space.time_zone) is
// unknown, since periods are cut at its midnights.
//
// The range is half-open over the periods' starts: a period is returned when from_time <=
// starts_at < to_time. Unset from_time means kept_from; unset to_time means now. Both are
// clamped to [kept_from, the start of the period running now — or now, if none is] (see
// ApartmentClimateSummary).
message GetApartmentClimateSummary {
  kusinta.iot.identity.v1.SpaceId apartment_id = 1;

  // Unset asks for the period the apartment's privacy disclosure names
  // (PrivacyDisclosure.climate_summary_period), or weeks when it names none. Anyone but the
  // apartment's residents may ask for that period only, and is refused as NOT_ENTITLED for
  // any other or when it names none. Its residents may ask for any, and are given only
  // periods that began in their current residency.
  kusinta.iot.climate.v1.ClimateSummaryPeriod period = 2;

  google.protobuf.Timestamp from_time = 3;
  google.protobuf.Timestamp to_time = 4;
}

// Asks the gateway to have a connector re-initialise its backend connection: reconnect to
// its radio central or network server. Meant to be offered while a
// reporting.v1.PROBLEM_KIND_CONNECTOR_ERROR is open for the connector — its
// ConnectorDescriptor.backend_health is FAILING — and only for a connector listed in
// ConnectorsAnnounced. A request for a connector that is not listed is refused, as
// CONNECTOR_OFFLINE or UNKNOWN_CONNECTOR below. For a listed one it is accepted whatever its
// health, since re-initialising a healthy backend is harmless.
//
// Authorized against the caller's role alone, as StartPairing is: a connector is not a
// target the caller reaches the way a space is. ROLE_TECHNICIAN and ROLE_GATEWAY_ADMIN may
// ask; anyone else is refused as NOT_ENTITLED, before the connector is looked up, so the
// refusal says nothing of which connectors exist.
//
// The gateway forwards it as connector.v1.ReinitializeBackend and answers once the
// connector has: with ManagementAck when the attempt was made. That says the attempt
// finished, not that it worked. Whether it worked is the connector's backend health, and
// when that changed the gateway pushes it in ConnectorsAnnounced before the ack. One
// request at a time per connector.
//
// So a failure found only by attempting — credentials the backend rejects, a backend that
// does not answer — is not a refusal. It arrives as a ManagementAck, with the backend
// health it left (FAILING, e.g. with AUTH_FAILED, UNREACHABLE or BACKEND_ERROR) already
// pushed: after the ack, the app reads ConnectorDescriptor.backend_health for the outcome,
// and a FAILING health there means the reconnect did not help. The app handles any reason
// there, one its schema does not know included. No push precedes the ack when the attempt
// left health as it was; the descriptor the app holds is then still the outcome.
//
// A refusal is a GatewayError whose metadata "reason" says which, as CommandError.metadata
// describes, and whose "detail" is a sentence the app may show. The app branches on
// "reason" for this operation; the code is only the fallback for a reason it does not know,
// since GatewayErrorCode is too coarse to say what to do here. The role refusal above is
// the code NOT_ENTITLED alone, with no "reason"; the reasons are for a caller who may ask:
//   "UNKNOWN_CONNECTOR"    UNAVAILABLE. The gateway does not track a connector by that id:
//                          it never had one, or has stopped tracking it. Not a client bug:
//                          the list the app holds may be stale.
//   "CONNECTOR_OFFLINE"    UNAVAILABLE. A connector the gateway tracks, whose stream to the
//                          gateway is down now, before or while the request was
//                          outstanding; that is CONNECTOR_OFFLINE, and a reconnect of its
//                          backend cannot help it.
//   "NOT_SUPPORTED"        FAILED_PRECONDITION. The connector does not declare
//                          ConnectorDescriptor.supports_backend_reinitialize, or declared it
//                          and answered that it has nothing to re-initialise. Not a client
//                          bug, and not worth retrying as is.
//   "ALREADY_IN_PROGRESS"  UNAVAILABLE. A reconnect of this connector is outstanding, from
//                          this caller or another. It ends within 60 seconds of being
//                          asked, answered or timed out; retry after that. Only the caller
//                          who asked is answered, but a change of health it causes reaches
//                          every session in ConnectorsAnnounced.
//   "TIMED_OUT"            UNAVAILABLE. The connector did not answer within the gateway's
//                          deadline. The attempt may still finish, and its outcome still
//                          arrives as backend health.
//   "REINITIALIZE_FAILED"  The connector could not attempt it at all
//                          (connector.v1.REINITIALIZE_OUTCOME_FAILED, or an outcome the
//                          gateway's schema does not know, read as FAILED). The code
//                          depends on the reason: FAILED_PRECONDITION when it is
//                          MISCONFIGURED, which needs a person to correct the connector's
//                          configuration before asking again can help; UNAVAILABLE for
//                          any other — INTERNAL, UNSPECIFIED, a value the gateway does not
//                          know — since a retry may work. Rejected credentials are never
//                          this: they are found by attempting, and come back as an ack
//                          (see above). metadata "backend_failure" is always set: the
//                          common.v1.BackendFailureReason by its enum name, e.g.
//                          "BACKEND_FAILURE_REASON_MISCONFIGURED". A reason that is
//                          UNSPECIFIED, or a value the gateway's schema does not know, is
//                          sent as "BACKEND_FAILURE_REASON_BACKEND_ERROR", as
//                          BackendFailureReason has it; an app reading a name its own
//                          schema does not know treats it as BACKEND_ERROR too.
// The connector's own detail is never in a refusal; GatewayError.message is the gateway's.
message ReconnectConnector {
  // As ConnectorDescriptor.connector_id, and the id a CONNECTOR_ERROR problem's subject
  // names (reporting.v1.ProblemSubject.connector_id).
  kusinta.iot.identity.v1.ConnectorId connector_id = 1;
}

// Lists the heating records (heating.v1) a caller may see under a space: unset
// root_space_id lists every one the caller can reach. Answered with a HeatingLayout.
message ListHeating {
  kusinta.iot.identity.v1.SpaceId root_space_id = 1;
}

// Creates a plant (empty plant_id) or replaces one. Answered with the HeatingRecord as
// stored. The puts of heating records refuse, with metadata "reason":
//
//   INVALID_REQUEST
//   "ZONE_CONTROL_ROOM"     a floor zone whose control room is unset or not one of its rooms.
//   "ZONE_ROOMS_ACROSS_HOMES" a floor zone with rooms in two homes, or in a home and outside
//                           homes.
//   "ZONE_AREA_SHARES"      a floor zone with a room listed twice, a share of 0, or shares
//                           that do not sum to 1000.
//   "ROOM_OUTSIDE_PLANT"    a zone room outside its plant's space; metadata "room_id" names it.
//   "ZONE_NOT_ON_FLOOR"     a floor zone on a circuit that is not a floor circuit.
//   "SG_READY_HALF_BOUND"   one SG Ready input bound without the other.
//   "CONTROL_EMPTY"         a plant control that binds no input.
//   "NO_ENDPOINT"           an attribute on the Matter branch with no endpoint_id.
//   "WINDOWS_IN_PUT"        a comfort load put with windows (see SetComfortWindows).
//
//   FAILED_PRECONDITION
//   "STALE_REVISION"        the record changed since the revision the request names.
//   "CHILDREN_INVALID"      a plant or circuit put that would leave a record under it
//                           invalid: a circuit with zones no longer a floor circuit, or a
//                           space or plant change leaving a zone's room outside its plant.
//   "OUTPUT_BOUND_TWICE"    an output already bound in another role or record.
//   "OUTPUT_NOT_LEASED"     an output whose write its producer does not state as leased.
//   "REST_STATE"            an output whose lapse value, read through closed_value, does not
//                           leave the contact where its role rests.
//   "TEST_RUNNING"          a put that would change what a running commissioning test drives
//                           or judges: an output binding of a record whose output it drives,
//                           or a floor zone's rooms, control room or circuit while a test runs
//                           on the zone or on a circuit it leaves or joins (PUMP_ALL_ZONES_OFF). metadata "record_id"
//                           names the test's record. A name, an area share or a supply cap
//                           may change meanwhile.
//
// A refusal about one binding names it in metadata "field", by its proto field name:
// "sg_ready_block", "sg_ready_boost", "add_on_heater_block", "hot_water_block",
// "curve_adjustment", "meter", "output", "supply_probe", "return_probe".
//
// A device or room the caller cannot reach, a parent it may not use (see heating.v1) and an
// id that does not exist are all refused as NOT_ENTITLED with the same metadata, so no answer
// tells one from another. HAS_CHILDREN, CHILDREN_INVALID and OUTPUT_BOUND_TWICE may count
// records the caller cannot see — a zone in a home under a circuit outside it. That one bit
// is accepted, as it is for the members listing; their metadata never names or counts such
// a record.
message PutHeatingPlant {
  kusinta.iot.heating.v1.HeatingPlant plant = 1;
}

// Creates or replaces a circuit of a plant; as PutHeatingPlant.
message PutHeatingCircuit {
  kusinta.iot.heating.v1.HeatingCircuit circuit = 1;
}

// Creates or replaces a floor zone of a floor circuit; as PutHeatingPlant.
//
// While a home is empty (household.proto, EMPTY HOME), the property owner and the gateway
// administrators who reach it may change which of its rooms a stored floor zone of the home
// heats, and so bring a zone left uncontrolled back under control (heating.v1, UNCONTROLLED
// ZONES). From them, only a stored zone's rooms and control_room_id may change, its rooms
// staying in that home. Any other change from them — its output, its circuit, its name — a new
// zone, and removing one (RemoveHeatingRecord) are refused as NOT_ENTITLED, the same answer as
// for a zone out of reach. A caller not given the home's zones is refused NOT_ENTITLED first.
// For one given the zone, a put naming a revision the zone has moved on from is refused as
// FAILED_PRECONDITION "STALE_REVISION" before any of the changes above is judged, so a racing
// put is told to re-read. It ends at MOVE-IN (household.proto), and the zone mapping they left
// is kept: MOVE-IN's reset does not touch heating records.
message PutFloorZone {
  kusinta.iot.heating.v1.FloorZone zone = 1;
}

// Creates or replaces a comfort load's room, name and output, keeping its windows; as
// PutHeatingPlant.
message PutComfortLoad {
  kusinta.iot.heating.v1.ComfortLoad comfort_load = 1;
}

// Removes a heating record by its id, naming the revision it removes. Refused as
// FAILED_PRECONDITION with metadata "reason" "STALE_REVISION" when it changed since, and
// "HAS_CHILDREN" while records lie under it — a plant's circuits, a circuit's zones — so
// nothing is removed that the caller did not name, and "TEST_RUNNING" while a running
// commissioning test drives one of its outputs or judges it: a zone under its own test or
// its circuit's PUMP_ALL_ZONES_OFF, a circuit while a test runs on it or on one of its
// zones, a plant while a test runs on one of its outputs; metadata "record_id" names the
// test's record. Removing it would change what the test's verdict covers while it runs.
// Its outputs are returned to rest at once
// (see heating.v1). Acked. An empty home's floor zone is not removed by the property owner or
// the gateway administrators who are given it: NOT_ENTITLED, as PutFloorZone says.
message RemoveHeatingRecord {
  string id = 1;
  uint64 revision = 2;
}

// Replaces a comfort load's windows: a resident's setting, apart from the binding and its
// revision. Answered with the HeatingRecord as stored. Refused as FAILED_PRECONDITION
// "STALE_REVISION" when windows_revision is set and the windows changed since, and as
// INVALID_REQUEST "WINDOW" for a window that ComfortWindow does not allow or more than 16.
// From an installer under a commissioning grant, NOT_ENTITLED.
message SetComfortWindows {
  string comfort_load_id = 1;
  repeated kusinta.iot.heating.v1.ComfortWindow windows = 2;

  // The ComfortLoad.windows_revision these windows replace. Unset: whatever is stored.
  optional uint64 windows_revision = 3;
}

// Switches one price rule of a plant Off, to Shadow or Live (heating.v1 PRICE RULES), recording
// the change with its setter and time (heating.v1.PriceRuleChange). Answered with the
// HeatingRecord of the plant as stored. A mode equal to the rule's mode now is answered the same
// and records nothing.
//
// For a plant in a home, its household admins and an installer under a commissioning grant
// covering the home; for one outside homes, the property owner, the gateway's administrators who
// reach its space and an installer under a commissioning grant covering it (heating.v1, WHO
// SWITCHES THEM). Anyone else — a resident who is not a household admin, service, a home's
// plant to staff — and a plant that does not exist, are refused as NOT_ENTITLED with the same
// metadata. Refused, with metadata "reason":
//
//   INVALID_REQUEST
//   "price_rule"          rule UNSPECIFIED, or one the gateway does not run for this plant (not
//                         listed in HeatingPlant.price_rules).
//   "price_rule_mode"     mode UNSPECIFIED.
//
//   FAILED_PRECONDITION
//   "STALE_REVISION"      price_rules_revision is set and the plant's rules changed since.
//   "rule_input_unbound"  LIVE for a rule whose input the plant does not bind: metadata "field"
//                         names it by its proto field name, "add_on_heater_block" for
//                         ADD_ON_HEATER_BLOCK and "hot_water_block" for HOT_WATER; for
//                         FLOOR_PRE_HEAT and FLOOR_TIME_SHARE, no floor zone of the plant
//                         binds an output, and "field" is "output". SHADOW and OFF need no input bound.
//   "rule_not_drivable"   LIVE for a rule the gateway does not yet drive (it decides it in shadow
//                         only); SHADOW and OFF are taken. Checked before rule_input_unbound,
//                         since binding an input would not help.
//   "rule_input_untested" LIVE for a rule whose bound input holds no current pass of
//                         OUTPUT_LEASE (commissioning.v1.TEST_KIND_OUTPUT_LEASE) on the output it
//                         is bound to now, since the gateway would drive nothing: metadata "field"
//                         as for rule_input_unbound. Checked after rule_not_drivable and
//                         rule_input_unbound. SHADOW and OFF need no pass. A rule already LIVE
//                         whose pass stops being current stays LIVE and drives nothing until a
//                         new pass is held.
//   "rule_periodic_increase_unknown"
//                         LIVE for HOT_WATER, or for ADD_ON_HEATER_BLOCK on a plant with a
//                         hot-water tank, while the heat source's periodic increase is not known
//                         (heating.v1 PRICE_RULE_HOT_WATER), since the rule would drive nothing:
//                         metadata "key" names the first commissioning.v1 key neither reported
//                         nor answered with a value, of "hot_water.periodic_increase",
//                         "hot_water.periodic_increase_interval_days" and
//                         "hot_water.periodic_increase_start_minute" in that order. Checked after
//                         rule_input_untested. "hot_water.periodic_increase" false, reported or
//                         answered, is an answer and lets LIVE through. SHADOW and OFF need it
//                         not. A rule already LIVE whose periodic increase stops being known
//                         stays LIVE and drives nothing until it is known again, the plant's
//                         feature status naming the keys as needs.
//   "rule_own_price_function"
//                         LIVE for a rule steered by price (any but FLOOR_TIME_SHARE) while the
//                         heat source's own price function is not answered off
//                         ("plant.own_price_function" false, commissioning.v1), since it and
//                         the rule would fight or stack: metadata "key" names
//                         "plant.own_price_function", and "state" is "on" where it is answered
//                         true and "unknown" where it is not answered with a value, so that a
//                         client names the step: turning it off at the heat source, or answering
//                         it. Checked after rule_periodic_increase_unknown. SHADOW and OFF need it
//                         not, and a rule's readiness is not changed by it: the rule's readiness
//                         names it beside its gates, with the same reason and metadata
//                         (commissioning.v1 PriceRuleReadiness.live_holds). A rule already LIVE
//                         whose answer stops being false stays LIVE and drives nothing until it is
//                         false again, its readiness naming the hold, and the plant's feature
//                         status naming the key as a need while it is unknown.
//
// Switching a rule from LIVE ends its blocks under way (heating.v1.HEAT_BLOCK_END_RULE_SWITCHED)
// and writes the lapse value of each input it held, at once, as at unbinding. Switching to LIVE
// drives nothing the plant may not be driven by (heating.v1.PRICE_RULE_MODE_LIVE).
//
// Rollout note: a gateway that predates price rules sends HeatingPlant.price_rules empty, and an
// app offers no switch to it.
message SetPriceRuleMode {
  string plant_id = 1;
  kusinta.iot.heating.v1.PriceRule rule = 2;
  kusinta.iot.heating.v1.PriceRuleMode mode = 3;

  // The HeatingPlant.price_rules_revision this change is made against. Unset: whatever is
  // stored.
  optional uint64 price_rules_revision = 4;
}

// Releases a plant's heat blocks by hand (heating.v1 HEAT BLOCKS), or ends or changes the hold
// a release set. Answered with the plant's HeatBlockStatus as it now stands, and recorded
// (heating.v1.HeatBlockRelease) with its maker and time.
//
// With hold_off_minutes above 0: every LIVE block of the plant under way ends
// (heating.v1.HEAT_BLOCK_END_RELEASED), the lapse value of each input it held is written at once,
// as at unbinding, and the plant's blocking rules start no LIVE block until hold_off_minutes from
// now. A hold already running is replaced, sooner or later. It needs no block under way: a hold
// set ahead keeps the next from starting. It never shortens what a compressor block's release
// keeps released (commissioning.v1, BLOCKS ON A COMPRESSOR). SHADOW rules are not held: they
// drive nothing.
//
// With hold_off_minutes 0: a hold running ends at once, and blocks may start again as the rules
// plan them; with none running, acked as it stands and recorded nothing. So a release made by
// mistake is undone.
//
// Who may:
//   * a plant in a home — the home's own heat source: any resident of the home, household
//     admins included. Nobody else: not service, not the property owner or the gateway
//     administrators, not an installer under a commissioning grant;
//   * a plant outside homes — a building's shared heat source: the property owner, the gateway's
//     administrators and technicians who reach the plant's space. Not a resident as such: a
//     household on a shared plant moves its rooms' comfort instead (SetComfortPreference,
//     SetRoomTarget).
// Anyone else, and a plant that does not exist, are refused as NOT_ENTITLED with the same
// metadata. Refused as INVALID_REQUEST with metadata {"reason": "hold_off_minutes"} for a value
// that is not a whole number of quarter hours or is above 1440, and as FAILED_PRECONDITION with
// metadata {"reason": "no_live_block_rule"} where hold_off_minutes is above 0 and no blocking
// rule of the plant is LIVE (heating.v1.PriceRule): nothing would be held.
message ReleaseHeatBlock {
  string plant_id = 1;

  // How long to hold blocks off, in minutes: 0, or 15 to 1440 in whole quarter hours.
  uint32 hold_off_minutes = 2;
}

// Lists how the blocks of each plant the caller is given them for (heating.v1, WHO SEES THEM)
// stand now, under a space: unset root_space_id lists every one the caller reaches. Answered
// with a heating.v1.HeatBlockStatuses: a plant whose blocks the caller is not given is left
// out, never refused, so the list tells nothing of the plants left out.
message ListHeatBlockStatus {
  kusinta.iot.identity.v1.SpaceId root_space_id = 1;
}

// Reads a plant's blocks, releases and changes of mode over a range, answered with a
// heating.v1.HeatBlockHistory. Given as heating.v1 WHO SEES THEM says: a home's plant to its
// residents only, from the start of their current residency; a plant outside homes to the
// property owner, the gateway's administrators and technicians who reach its space. Anyone else,
// and a plant that does not exist, are refused as NOT_ENTITLED with the same metadata.
//
// [from_time, to_time): a block is answered where it started in it, a release or a change where
// it was made in it. Both are clamped to [kept_from, now]. Unset to_time: now. Unset from_time:
// 31 days before to_time. A range longer than 31 days is refused as INVALID_REQUEST with
// metadata {"reason": "span"}; an app pages back with the next range ending at this one's start.
message GetHeatBlockHistory {
  string plant_id = 1;
  google.protobuf.Timestamp from_time = 2;
  google.protobuf.Timestamp to_time = 3;
}

// Reads what a home's price rules would have saved, and cost in comfort, under each comfort band
// the gateway scores (heating.v1.ShadowSummary), so that the household can choose its comfort
// preference. The home's residents only: anyone else — service, the property owner, the
// gateway's administrators, an installer under a commissioning grant, a resident of another
// home — and a space that is not an apartment, are refused as NOT_ENTITLED with the same
// metadata.
//
// Dates are the building's local dates, as ISO 8601 calendar dates (YYYY-MM-DD), half-open:
// [from_date, to_date). Both are clamped to [ShadowSummary.kept_from, today]. Unset to_date:
// today, so the last day given is the last one scored. Unset from_date: 31 days before to_date.
// A range longer than 93 days is refused as INVALID_REQUEST with metadata {"reason": "span"},
// and a date that is not a calendar date with {"reason": "date"}. Unset rule: every rule.
message GetShadowSummary {
  kusinta.iot.identity.v1.SpaceId home_id = 1;
  kusinta.iot.heating.v1.PriceRule rule = 2;
  string from_date = 3;
  string to_date = 4;
}

// Reads a payer's energy price adder (heating.v1 ENERGY PRICE ADDER), answered with a
// heating.v1.EnergyPriceAdder. A home's: to its residents only. A plant outside homes': to the
// property owner and the gateway's administrators who reach its space. Anyone else — service on a
// home, an installer under a commissioning grant, a technician — a home or plant that does not
// exist, and a home_id that is not an apartment, are refused as NOT_ENTITLED with the same
// metadata. A home's own plant (heating.v1 ENERGY PRICE ADDER) is priced with its home's adder: one
// named by a resident of that home is refused as INVALID_REQUEST with metadata {"reason":
// "payer"}, and a client names the home; so is a request naming neither.
//
// Rollout note: a gateway that predates the adder does not know this request or
// SetEnergyPriceAdder. An app offers a home's adder only to a gateway whose shadow days state a
// price basis (heating.v1.ShadowDay.price_basis), and a plant's only once this request is answered
// with an adder.
message GetEnergyPriceAdder {
  kusinta.iot.heating.v1.EnergyPricePayer payer = 1;
}

// States a payer's energy price adder, or resets it to the gateway's default (heating.v1 ENERGY
// PRICE ADDER). Answered with the heating.v1.EnergyPriceAdder as it now stands. It prices the days
// scored from now on, never one already kept (heating.v1 PRICE BASIS).
//
// A home's: its household admins only. A plant outside homes': the property owner and the
// gateway's administrators who reach its space. Anyone else — a resident who is not a household
// admin, service, an installer under a commissioning grant, a technician — and a home or plant
// that does not exist, are refused as NOT_ENTITLED with the same metadata, as is a home_id that is
// not an apartment. A resident who is not a household admin is refused so whether they name the
// home or the home's own plant. Refused, with metadata "reason", in this order:
//
//   INVALID_REQUEST
//   "payer"            neither named, or a home's own plant, named by one who may set the home's.
//
//   FAILED_PRECONDITION
//   "no_price_area"    micro_per_kwh set, and the building has no price area, or one whose
//                      country the gateway holds no terms for (EnergyPriceAdder.terms unset):
//                      nothing to state it in.
//
//   INVALID_REQUEST
//   "currency"         micro_per_kwh set and currency not the adder's
//                      (EnergyPriceAdder.terms.currency).
//   "value"            micro_per_kwh above EnergyPriceAdder.terms.adder_max_micro_per_kwh.
//
// A value equal to the one in force, and a reset where the default is in force or no adder
// applies, are answered as it stands and change nothing. A building's price area moved to another
// country takes its payers' adders back to the default, in the new currency.
message SetEnergyPriceAdder {
  kusinta.iot.heating.v1.EnergyPricePayer payer = 1;

  // The adder, as heating.v1.EnergyPriceAdder.micro_per_kwh says. Unset: reset to the gateway's
  // default. 0 is a value: no grid fee or markup per kWh.
  optional uint32 micro_per_kwh = 2;

  // The currency micro_per_kwh is in, as ISO 4217 names it: the adder's own
  // (EnergyPriceAdder.terms.currency), so that a value is never read in a currency it was not
  // meant in. Ignored on a reset.
  string currency = 3;
}

// Reads a heat source's curve against what its zones draw (heating.v1 HEAT CURVE), answered with
// heating.v1.HeatCurveViews, given as heating.v1 HEAT CURVE (WHO SEES IT) says.
//
//   plant_id  one view, of that plant: to its household admins and an installer under a
//             commissioning grant covering it, a home's other residents with figures withheld,
//             for a plant in a home; to the property owner and the gateway's administrators who
//             reach its space, and an installer under a commissioning grant covering it, for a
//             plant outside homes.
//   home_id   the home's residents only: a view of each of the home's own plants, as plant_id
//             gives it to them, and of each plant outside homes whose curve one of the home's
//             zones limits in some band, with figures withheld and only the bands it limits
//             given a limit. A plant outside homes that it limits in no band is not listed, nor
//             is any plant whose curve another home limits.
//
// Anyone else — service, a technician as such, a resident naming a plant outside homes, an
// installer naming a home — a plant or home that does not exist, and a home_id that is not an
// apartment, are refused as NOT_ENTITLED with the same metadata. Neither set is refused as
// INVALID_REQUEST with metadata {"reason": "subject"}.
message GetHeatCurveView {
  oneof subject {
    string plant_id = 1;
    kusinta.iot.identity.v1.SpaceId home_id = 2;
  }
}

// Applies a plant's heat curve suggestion, or its preview (heating.v1 HEAT CURVE, APPLYING,
// PREVIEW), answered with heating.v1.HeatCurveViews: the plant's view, as GetHeatCurveView by
// plant_id gives it, with the apply as its last_applied. Only those heating.v1 HEAT CURVE (WHO
// APPLIES IT) names; anyone else, and a plant that does not exist, are refused as NOT_ENTITLED
// with the same metadata. Refused as FAILED_PRECONDITION with metadata:
//   {"reason": "suggestion_changed"}  suggestion_id is neither the plant's suggestion nor its
//                                     preview as it stands: a client reads the view again and
//                                     shows what changed;
//   {"reason": "not_writable"}        mode WRITTEN where the heat source takes no write of the
//                                     suggestion's or the preview's settings
//                                     (HeatCurveSuggestion.writable, HeatCurvePreview.writable);
//   {"reason": "nothing_to_revert"}   revert where no apply has settings to set back.
// A mode other than WRITTEN or BY_HAND is refused as INVALID_REQUEST with metadata
// {"reason": "mode"}. A write the heat source does not take is refused as UNAVAILABLE with
// metadata {"reason": "write_failed"}, and nothing is recorded as applied. Applying a declined
// suggestion withdraws its decline.
message ApplyHeatCurve {
  string plant_id = 1;

  // The suggestion applied, as the view gave it (HeatCurveSuggestion.suggestion_id), or the
  // preview (HeatCurvePreview.preview_id). Ignored with revert.
  string suggestion_id = 2;

  // WRITTEN writes it to the heat source; BY_HAND confirms it was set by hand there.
  kusinta.iot.heating.v1.HeatCurveApplyMode mode = 3;

  // Sets back the settings the last apply replaced (HeatCurveApplied.settings_before), in mode,
  // as a correction: recorded as an apply of its own.
  bool revert = 4;
}

// Declines a plant's heat curve suggestion, or withdraws a decline (heating.v1 HEAT CURVE,
// SUGGESTION), answered with heating.v1.HeatCurveViews as ApplyHeatCurve is. Entitled and refused
// as ApplyHeatCurve is, suggestion_changed included. A room-target suggestion
// (heating.v1.HeatCurveRoomTargetSuggestion) is declined the same way, by its suggestion_id, by
// the residents of the home its room lies in alone (heating.v1 HEAT CURVE, ROOM TARGETS), and
// answered with the views their home's reading gives them. One naming a room-target suggestion
// the caller may not see is answered as one naming an id that is not the plant's
// (suggestion_changed), so that the refusal says nothing of whether it exists. A preview is
// never declined: one naming a preview_id (heating.v1.HeatCurvePreview) is answered as
// suggestion_changed too. Declining a declined suggestion, and withdrawing a decline that is not
// there, change nothing and are answered as it stands.
message DeclineHeatCurve {
  string plant_id = 1;

  // The suggestion declined, as the view gave it (HeatCurveSuggestion.suggestion_id).
  string suggestion_id = 2;

  // false declines; true withdraws the decline, so that the suggestion is open again.
  bool withdraw = 3;
}

// Sets a plant's automatic savings on or off (heating.v1 HEAT CURVE, AUTOMATIC SAVINGS),
// answered with heating.v1.HeatCurveViews as ApplyHeatCurve is. Entitled and refused as
// ApplyHeatCurve is; automatic_savings UNSPECIFIED is refused as INVALID_REQUEST with metadata
// {"reason": "automatic_savings"}. Setting it to what it is changes nothing and is answered as
// it stands. Turning it off undoes no apply already made; ApplyHeatCurve.revert does.
message SetHeatCurveAutomaticSavings {
  string plant_id = 1;
  kusinta.iot.heating.v1.HeatCurveAutomaticSavings automatic_savings = 2;
}

// Sets a plant's update mode (heating.v1 HEAT CURVE, UPDATES), answered with
// heating.v1.HeatCurveViews as ApplyHeatCurve is. Entitled and refused as ApplyHeatCurve is;
// update_mode UNSPECIFIED is refused as INVALID_REQUEST with metadata {"reason": "update_mode"},
// and ONCE_PER_SEASON where the plant's heating season cannot be told (HEATING SEASON) as
// FAILED_PRECONDITION with metadata {"reason": "season_unknown"}. Setting it to what it is
// changes nothing and is answered as it stands; setting it back is its correction. A change of
// mode undoes no apply already made, and drops no suggestion already open.
message SetHeatCurveUpdateMode {
  string plant_id = 1;
  kusinta.iot.heating.v1.HeatCurveUpdateMode update_mode = 2;
}

// Hands a plant's open heat curve suggestion to a technician, or withdraws the hand-over
// (heating.v1 HEAT CURVE, HAND-OVER), answered with heating.v1.HeatCurveViews as ApplyHeatCurve
// is. Only the owner organisation of a plant outside homes: the property owner and the gateway's
// administrators who reach its space. Anyone else, a plant in a home, and a plant that does not
// exist, are refused as NOT_ENTITLED with the same metadata. Refused as FAILED_PRECONDITION with
// metadata:
//   {"reason": "suggestion_changed"}      suggestion_id is not the plant's suggestion as it
//                                         stands, as for ApplyHeatCurve;
//   {"reason": "technician_not_granted"}  technician holds no active commissioning grant
//                                         covering the plant's space.
// Handing it to the technician it is handed to, withdrawing a hand-over that is not there, and
// withdrawing one whose suggestion_id is no longer the plant's suggestion (the hand-over ended
// with it), change nothing and are answered as it stands.
message HandHeatCurveSuggestion {
  string plant_id = 1;

  // The suggestion handed, as the view gave it (heating.v1.HeatCurveSuggestion.suggestion_id).
  string suggestion_id = 2;

  // The technician it is handed to. Ignored with withdraw.
  kusinta.iot.identity.v1.UserId technician = 3;

  // Withdraws the hand-over: the suggestion is handed to no one.
  bool withdraw = 4;
}

// Asks for a nonce to link one home's account at a third-party service
// (accountlink.v1.AccountLinkNonce). Only a household admin of the home
// (access.v1.MEMBERSHIP_RELATION_HOUSEHOLD_ADMIN) is issued one; anyone else is refused as
// NOT_ENTITLED, as is a home the caller cannot reach. A service this gateway does not
// support is refused as INVALID_REQUEST. A gateway that cannot hold linked accounts right now
// — its key for sealing them is missing or is not the one its stored links were sealed with —
// refuses as UNAVAILABLE with metadata {"reason": "account_links_off"}; nothing is linked until
// that is put right on the gateway.
message RequestAccountLinkNonce {
  kusinta.iot.identity.v1.SpaceId home_id = 1;
  kusinta.iot.accountlink.v1.LinkedService service = 2;
}

// Lists a home's linked accounts and their status, answered with an AccountLinks. Given to
// the home's residents, and to the departing household while a vacated handover of the home is
// pending (household.proto, VACANCY); anyone else is refused as NOT_ENTITLED.
message ListAccountLinks {
  kusinta.iot.identity.v1.SpaceId home_id = 1;
}

// Unlinks a home's account at one service: the gateway reads no more through it and revokes
// it (accountlink.v1.RevokeToken). A household admin of the home only; anyone else is refused
// as NOT_ENTITLED. A service with no link is acked all the same. Acked.
message UnlinkAccount {
  kusinta.iot.identity.v1.SpaceId home_id = 1;
  kusinta.iot.accountlink.v1.LinkedService service = 2;
}

// Lists a space's commissioning (commissioning.v1): for a home, its facts, tests and feature
// states; for a space outside homes, its facts and the tests on records there. Answered
// with a CommissioningProfile, filtered as commissioning.v1 says. A home asked by a caller
// who is not given its commissioning is refused as NOT_ENTITLED.
message ListCommissioning {
  kusinta.iot.identity.v1.SpaceId space_id = 1;
}

// Creates a fact (empty fact_id) or replaces one. Answered with the CommissioningRecord as
// stored. The gateway sets answerer, necessity, feature, topic and provenance, save
// provenance.evidence, which the caller states. Refused with metadata "reason":
//
//   INVALID_REQUEST
//   "UNKNOWN_KEY"       a key the gateway's catalogue does not hold.
//   "VALUE_TYPE"        a value of another type than the key takes, a value outside the
//                       key's closed list or range or listed twice, unknown false, or no
//                       answer.
//   "SUBJECT"           a record_id that is not a heating record within space_id, or a key
//                       that is not about that kind of space or record.
//   "ANSWERER"          a key the caller's party does not answer.
//   "EVIDENCE"          evidence the caller's party may not give, or less than the key
//                       requires.
//   "TEMPLATE_VERSION"  a new or changed deviates_from naming a template or version the
//                       home's template never was, or set on a home that follows no
//                       template. One carried over unchanged from the stored fact is kept,
//                       even after the home moved to another template.
//
//   FAILED_PRECONDITION
//   "STALE_REVISION"    the fact changed since the revision the request names.
//   "FACT_EXISTS"       a create for a space, record and key that already have a fact;
//                       metadata "fact_id" names it. One answer per key: an answer over
//                       a house fact replaces that fact (commissioning.v1, HOUSE FACTS
//                       AND HOUSEHOLD DATA).
//   "HOUSE_FACT"        a household's "don't know" over a house fact that answers the key.
//   "SET_BY_TEST"       a key only a test sets.
//   "REPORTED"          a key whose value the heat source reports, while the reading
//                       stands (commissioning.v1, PERIODIC INCREASE); metadata "key"
//                       names it.
//
// A space or record the caller cannot reach, and a fact_id that does not exist, are refused
// as NOT_ENTITLED with the same metadata.
message PutCommissioningFact {
  kusinta.iot.commissioning.v1.CommissioningFact fact = 1;
}

// Removes a fact by its id, naming the revision it removes; as PutCommissioningFact. A fact
// set by a test is replaced only by running it again: refused as FAILED_PRECONDITION
// "SET_BY_TEST". A household removing its answer over a house fact brings the house fact back
// in force, as the fact's next revision; an installer's removal removes both; a house fact no
// answer of the household's stands over is not the household's to remove: refused as
// FAILED_PRECONDITION "HOUSE_FACT" (commissioning.v1, HOUSE FACTS AND HOUSEHOLD DATA). Acked.
message RemoveCommissioningFact {
  string fact_id = 1;
  uint64 revision = 2;
}

// Creates a house template (empty template_id) or replaces one, naming the version it
// replaces. From the property owner or the gateway's administrators, reaching the building;
// anyone else is refused as NOT_ENTITLED. Answered with the CommissioningRecord as stored.
// Refused as FAILED_PRECONDITION "STALE_REVISION" when the template changed since, as
// INVALID_REQUEST "UNKNOWN_KEY" or "VALUE_TYPE" as PutCommissioningFact, and as
// INVALID_REQUEST "EVIDENCE" for a key a template may not answer (commissioning.v1,
// TEMPLATES); metadata "key" names it.
message PutHouseTemplate {
  kusinta.iot.commissioning.v1.HouseTemplate template = 1;
}

// Says which house template a home follows; an empty template_id, none. From the property
// owner or the gateway's administrators; anyone else is refused as NOT_ENTITLED. A template
// of another building is refused as INVALID_REQUEST "TEMPLATE_BUILDING". Deviations recorded
// against another template stay, naming the version they were recorded against. Acked.
message SetHomeTemplate {
  kusinta.iot.identity.v1.SpaceId home_id = 1;
  string template_id = 2;
}

// Starts a commissioning test (commissioning.v1.TestKind) on a heating record, answered with
// the CommissioningRecord of the test, RUNNING. Its changes of state, the start included,
// are pushed (GatewayMessage.commissioning_test), save the start to the session that
// started it, which has it as the reply. Run by whoever may bind the outputs it drives
// (heating.v1); PUMP_ALL_ZONES_OFF by an installer under a commissioning grant only. Refused
// with metadata "reason":
//
//   INVALID_REQUEST
//   "TEST_SUBJECT"      a kind that does not run on that record, or for OUTPUT_LEASE a
//                       binding field that is empty or not a bound output of it; for the
//                       other kinds, a binding field that is not empty.
//
//   FAILED_PRECONDITION
//   "TEST_RUNNING"      a test already drives one of its outputs.
//   "SG_READY_ORDER"    OUTPUT_LEASE on one SG Ready input while a running test drives the
//                       other input of the same plant, in either order: both held away from
//                       rest is a state of the heat pump no test asks for. metadata "field"
//                       names the input the running test drives.
//   "LAST_HEATING_ZONE" OUTPUT_LEASE or ZONE_EFFECT on a floor zone's output that would leave
//                       its circuit no zone heating: the zone is the circuit's only one, or
//                       every other zone of the circuit has its output driven by a running
//                       test. A zone with no bound output counts as heating. Not refused once
//                       the circuit's "floor.pump_tolerates_all_zones_off" is true
//                       (commissioning.v1). metadata "record_id" names the zone.
//   "ZONES_SWITCHING_ON" OUTPUT_LEASE or ZONE_EFFECT on a floor zone while the circuit's
//                       zones driven by running or starting tests of those kinds already
//                       number its "floor.max_zones_switching_on" (commissioning.v1): their
//                       leases would end together and their actuators open at once.
//                       metadata "record_id" names the circuit.
//   "NEEDS_PASS"        ZONE_EFFECT or PUMP_ALL_ZONES_OFF on outputs without a current
//                       OUTPUT_LEASE pass; metadata "record_id" names one.
//   "OUTPUT_NOT_LEASED" an output its producer does not state as leased, with a lapse value
//                       at rest (heating.v1), so no test could leave it at rest.
//   "READ_LATENCY"      OUTPUT_LEASE on an output whose producer does not state its reads
//                       REAL_TIME: a pass judged against a guessed latency is none.
//   "LEASE_BOUNDS"      OUTPUT_LEASE on an output whose lease bounds admit no lease of 60
//                       seconds to 5 minutes, so the test could not end by its ends_at.
//
// A record the caller cannot reach is refused as NOT_ENTITLED.
message RunCommissioningTest {
  kusinta.iot.commissioning.v1.TestKind kind = 1;
  // binding.field for OUTPUT_LEASE only.
  kusinta.iot.commissioning.v1.BindingRef binding = 4;

  reserved 2 to 3;
  reserved "record_id", "field";
}

// Ends a running test. verdict ABORTED stops any test, from whoever started it or may run
// it; PASSED or FAILED concludes a PUMP_ALL_ZONES_OFF test, from an installer under a
// commissioning grant only, until the test's conclude_by. Any other verdict, or PASSED or
// FAILED on another kind, is refused as INVALID_REQUEST "VERDICT". Its outputs return to
// their normal control at once, floor zones switching on no faster than
// "floor.max_zones_switching_on" allows. Answered
// with the CommissioningRecord of the test. A test that has ended is refused as
// FAILED_PRECONDITION "TEST_ENDED".
message ConcludeCommissioningTest {
  string test_id = 1;
  kusinta.iot.commissioning.v1.TestState verdict = 2;
}

// Lists whether each home under a space is set up (commissioning.v1.HomeSetup): unset
// root_space_id, every home the caller reaches. For the property owner and the gateway's
// administrators, and for a household admin for its own homes alone: unset root_space_id,
// the homes it administers; a root that is not one of them, or holds others, is refused as
// NOT_ENTITLED, as anyone else is. Answered with a HomeSetups; rooms_with_questions only on the
// caller's own homes.
message ListHomeSetups {
  kusinta.iot.identity.v1.SpaceId root_space_id = 1;
}

// Asks for a commissioning grant on one space (commissioning.v1, GRANTS), answered with the
// CommissioningGrant, REQUESTED. From a caller holding ROLE_TECHNICIAN who reaches the space;
// anyone else, and a space they do not reach, is refused as NOT_ENTITLED. A room in a home is
// INVALID_REQUEST with metadata {"reason": "grant_space"}: a home is granted whole. Asking
// again while one of the caller's is requested or granted on the space answers that one.
//
// Accepted on any home the caller reaches, whether or not anyone could answer it: it lapses
// unanswered where nobody does, so the answer tells the installer nothing of whether anyone
// lives there. A caller who lives in the home is refused as FAILED_PRECONDITION with metadata
// {"reason": "installer_lives_here"}, which tells them nothing they do not know.
message RequestCommissioningGrant {
  kusinta.iot.identity.v1.SpaceId space_id = 1;
}

// Answers a requested commissioning grant, answered with the CommissioningGrant as stored when
// granted, and with ManagementAck when declined, which ends it. From a household admin of the
// home, or for a space outside homes or an empty home (household.proto, EMPTY HOME) the
// property owner or a gateway administrator who reaches it; anyone else, and a grant_id that is
// not requested on a space the caller may answer for, is refused as NOT_ENTITLED, so that no
// grant id can be probed. So is a grant that names the caller as its installer, whoever they
// are (commissioning.v1, GRANTS).
//
// Granting needs ends_at after starts_at, no more than 14 days after it, and starts_at no
// later than 30 days from now; otherwise INVALID_REQUEST with metadata
// {"reason": "grant_period"}. An answered grant is not answered again: to change its time,
// end it and let the installer ask anew.
message AnswerCommissioningGrant {
  string grant_id = 1;

  // true grants; false declines.
  bool accept = 2;

  // When it is active. Unset starts_at: now. Ignored when declining.
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
}

// Ends a commissioning grant at once, requested or granted. Answered with ManagementAck. From
// the installer it names, from whoever may answer it, and from nobody else: anyone else, and a
// grant_id they are not listed, is refused as NOT_ENTITLED.
message EndCommissioningGrant {
  string grant_id = 1;
}

// Lists the commissioning grants that have not ended on a space and those below it, answered
// with CommissioningGrants: a home's to its residents, and an empty home's (household.proto,
// EMPTY HOME) to the property owner and the gateway administrators who reach it, as one on a
// space outside homes is; to an installer, their own.
// Unset root_space_id lists every one the caller may be listed. Anyone may ask; nobody is
// refused, and a caller listed none gets none.
message ListCommissioningGrants {
  kusinta.iot.identity.v1.SpaceId root_space_id = 1;
}

// Sets who owns one of the building's own devices as an asset (common.v1.AssetOwner), and
// with it whether a room's outer limits can bind the device (climate.v1.OuterRoomLimits), and
// nobody's access. Answered with ManagementAck. From the property owner or a gateway
// administrator who reaches the device; anyone else is refused as NOT_ENTITLED. Unset
// asset_owner clears it, as does one with neither owner set.
//
// Refused as INVALID_REQUEST with metadata "reason":
//   "owned_by_resident"  a device a person owns outright (common.v1.DeviceOwnershipType
//                        RESIDENT), which has no asset owner.
//   "asset_owner"        owner_organisation false, or a household_home_id that is not an
//                        apartment.
//
// A household's asset keeps naming its home if the home's space is changed or deleted, until
// it is set again: who owns what after a home is split or merged is decided here, not by the
// change.
message SetAssetOwner {
  kusinta.iot.identity.v1.DeviceId device_id = 1;
  kusinta.iot.common.v1.AssetOwner asset_owner = 2;
}

message ManagementRequest {
  oneof request {
    CreateSpace create_space = 1;
    UpdateSpace update_space = 2;
    DeleteSpace delete_space = 3;
    AssignUserToSpace assign_user_to_space = 4;
    RemoveUserFromSpace remove_user_from_space = 5;
    PlaceDeviceInSpace place_device_in_space = 6;
    RemoveDeviceFromSpace remove_device_from_space = 7;
    ClaimDevice claim_device = 8;
    ReleaseDevice release_device = 9;
    ListSpaces list_spaces = 10;
    CreateDeviceLink create_device_link = 11;
    RemoveDeviceLink remove_device_link = 12;
    ListDeviceLinks list_device_links = 13;
    UpdateDeviceLink update_device_link = 14;
    ProvisionDevice provision_device = 15;
    SetRoomTarget set_room_target = 16;
    ConfigureRoomClimate configure_room_climate = 17;
    SetClimateMode set_climate_mode = 18;
    ListRoomClimates list_room_climates = 19;
    GetRoomHistory get_room_history = 20;
    GetPrivacyDisclosure get_privacy_disclosure = 21;
    GetApartmentClimateSummary get_apartment_climate_summary = 22;
    ReconnectConnector reconnect_connector = 23;
    // Invites; see invite.proto.
    CreateInvite create_invite = 24;
    ResendInvite resend_invite = 25;
    RevokeInvite revoke_invite = 26;
    MarkInviteEmailSent mark_invite_email_sent = 27;
    ListSpaceInvites list_space_invites = 28;
    ApproveJoinRequest approve_join_request = 29;
    DenyJoinRequest deny_join_request = 30;
    // Members; see members.proto.
    ListGatewayMembers list_gateway_members = 31;
    SetMemberRole set_member_role = 32;
    RemoveFromGateway remove_from_gateway = 33;
    SetAccessUntil set_access_until = 34;
    // Superseded, and refused as INVALID_REQUEST; see SetOwnerOrganisation.
    SetOwnerOrganisation set_owner_organisation = 35 [deprecated = true];
    // Promotion requests; see members.proto.
    RequestPromotion request_promotion = 36;
    AnswerPromotion answer_promotion = 37;
    ListPromotionRequests list_promotion_requests = 38;
    // Heating records; see heating.v1.
    ListHeating list_heating = 39;
    PutHeatingPlant put_heating_plant = 40;
    PutHeatingCircuit put_heating_circuit = 41;
    PutFloorZone put_floor_zone = 42;
    PutComfortLoad put_comfort_load = 43;
    RemoveHeatingRecord remove_heating_record = 44;
    SetComfortWindows set_comfort_windows = 45;
    RequestAccountLinkNonce request_account_link_nonce = 46;
    ListAccountLinks list_account_links = 47;
    UnlinkAccount unlink_account = 48;
    // Commissioning; see commissioning.v1.
    ListCommissioning list_commissioning = 49;
    PutCommissioningFact put_commissioning_fact = 50;
    RemoveCommissioningFact remove_commissioning_fact = 51;
    PutHouseTemplate put_house_template = 52;
    SetHomeTemplate set_home_template = 53;
    RunCommissioningTest run_commissioning_test = 54;
    ConcludeCommissioningTest conclude_commissioning_test = 55;
    ListHomeSetups list_home_setups = 56;
    // Commissioning grants; see commissioning.v1, GRANTS.
    RequestCommissioningGrant request_commissioning_grant = 57;
    AnswerCommissioningGrant answer_commissioning_grant = 58;
    EndCommissioningGrant end_commissioning_grant = 59;
    ListCommissioningGrants list_commissioning_grants = 60;
    SetAssetOwner set_asset_owner = 61;
    // The household; see household.proto.
    DemoteHouseholdAdmin demote_household_admin = 62;
    StartHouseholdHandover start_household_handover = 63;
    ConfirmHouseholdHandover confirm_household_handover = 64;
    CancelHouseholdHandover cancel_household_handover = 65;
    ListHouseholdHandovers list_household_handovers = 66;
    ExportHouseholdData export_household_data = 67;
    SetHomeName set_home_name = 68;
    ClearClimateHistory clear_climate_history = 69;
    SetInnerRoomLimits set_inner_room_limits = 70;
    GetPlantHistory get_plant_history = 71;
    // Building planning; see BUILDING PLANNING.
    GetBuildingPlanning get_building_planning = 72;
    PutBuildingPlanning put_building_planning = 73;
    GetDayAheadPrices get_day_ahead_prices = 74;
    // A building's or a home's street address; see SPACE ADDRESS.
    GetSpaceAddress get_space_address = 75;
    PutSpaceAddress put_space_address = 76;
    // A household's comfort preference; see climate.v1.ComfortPreference.
    SetComfortPreference set_comfort_preference = 77;
    // Price rules and heat blocks; see heating.v1 PRICE RULES.
    SetPriceRuleMode set_price_rule_mode = 78;
    ReleaseHeatBlock release_heat_block = 79;
    ListHeatBlockStatus list_heat_block_status = 80;
    GetHeatBlockHistory get_heat_block_history = 81;
    GetShadowSummary get_shadow_summary = 82;
    // A payer's energy price adder; see heating.v1 ENERGY PRICE ADDER.
    GetEnergyPriceAdder get_energy_price_adder = 83;
    SetEnergyPriceAdder set_energy_price_adder = 84;
    // A heat source's curve against its zones; see heating.v1 HEAT CURVE.
    GetHeatCurveView get_heat_curve_view = 85;
    // Removing a registration made by mistake, and seeing those not yet joined; see
    // DeprovisionDevice and ListProvisionedDevices.
    DeprovisionDevice deprovision_device = 86;
    ListProvisionedDevices list_provisioned_devices = 87;
    // Applying or declining a heat curve suggestion; see heating.v1 HEAT CURVE, APPLYING.
    ApplyHeatCurve apply_heat_curve = 88;
    DeclineHeatCurve decline_heat_curve = 89;
    SetHeatCurveAutomaticSavings set_heat_curve_automatic_savings = 90;
    // Handing a heat curve suggestion to a technician; see heating.v1 HEAT CURVE, HAND-OVER.
    HandHeatCurveSuggestion hand_heat_curve_suggestion = 91;
    // When a lower heat curve is suggested; see heating.v1 HEAT CURVE, UPDATES.
    SetHeatCurveUpdateMode set_heat_curve_update_mode = 92;
    // Building-wide room limits; see BUILDING ROOM LIMITS.
    GetBuildingRoomLimits get_building_room_limits = 93;
    SetBuildingRoomLimits set_building_room_limits = 94;
  }
}
