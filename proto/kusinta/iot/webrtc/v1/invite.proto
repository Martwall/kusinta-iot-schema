syntax = "proto3";

package kusinta.iot.webrtc.v1;

import "google/protobuf/timestamp.proto";
import "kusinta/iot/access/v1/roles.proto";
import "kusinta/iot/identity/v1/identity.proto";

option optimize_for = SPEED;

// Invites: how a person is put on a space without anyone typing their user id.
//
// A member of a space who may put people on it creates an invite there. The gateway
// answers with two secrets for the same invite, a link token and a short code, and keeps
// only their hashes. The secrets reach the invited person outside this protocol — a QR
// code shown on a phone, a shared link, a letter, or an email the api-server sends. The
// person redeems either secret through the api-server, which routes the redeem to the
// gateway (signaling.v1.RedeemInvite) by the hashes the gateway reports to it
// (reporting.v1.ReportInviteRoutesRequest). Nothing here grants anything until the gateway
// itself has checked the redeem.
//
// The gateway is the authority on every invite: who may create one where, what it may
// carry, when it expires and what redeeming it does. The app's choices are a convenience;
// the gateway checks each request as if the app had not.
//
// What redeeming does depends on the kind of invite. The gateway decides the kind when the
// invite is created, from its relation, its address and who created it (CreateInvite), and
// tells it in Invite.admission:
//   * email-bound — bound to an email address (CreateInvite.email), of either relation: the
//     person is filed on the space at once, if the verified address of their account
//     matches (INVITE_ADMISSION_ON_EMAIL_MATCH);
//   * home key — a RESIDENT invite with no address, created by a property owner or an
//     administrator: the person is filed on the home at once, on redeem, and no join request
//     is made (INVITE_ADMISSION_ON_REDEEM);
//   * household invite — a RESIDENT invite with no address, created by a resident of the
//     home: a join request is made, listed to and approved by that household alone
//     (INVITE_ADMISSION_ON_APPROVAL);
//   * SERVICE with no address: a join request is made, approved by whoever may put people on
//     the space (INVITE_ADMISSION_ON_APPROVAL).
//
// An intercepted link or code of an invite that makes a join request gets nobody in on its
// own. A home key does let in whoever redeems it first, so it is bounded otherwise: it is
// single use, as every invite is; its secrets are short-lived (see below); it admits to one
// home and nothing else; and the property owner or administrator who created it can end
// the residency it made (RemoveUserFromSpace).
//
// Requests are ManagementRequest arms and answered by ManagementResult, as filing is. A
// target the caller cannot reach is refused as NOT_ENTITLED whether or not it exists.

// The secrets of an invite, in the forms the gateway mints them.
//
//   * token: 128 random bits, base64url without padding (22 characters). Carried in a
//     link and its QR code.
//   * code: 40 random bits as 8 characters of Crockford base32, shown as two groups of
//     four ("K7QM-4RXD"). Typed by a person.
//
// A code is compared normalised: letters upper-cased, hyphens and whitespace dropped, "I"
// and "L" read as "1", "O" read as "0". Anything else outside the Crockford alphabet makes
// it no code at all. The token is compared exactly.
//
// When each secret expires is the gateway's choice, told in Invite. A code SHOULD expire
// much sooner than a token (say 72 hours against 14 days): it is few enough bits to guess
// at, and a short life keeps the window small whatever limits stand in front of it. A home
// key's secrets SHOULD expire sooner than those of an invite that makes a join request (say
// 7 days for its token, and no more than 72 hours for its code): redeeming one admits with
// nobody's approval, so how long its secrets live is how long an intercepted one is good for.
//
// Each secret is known by a hash, which is all the gateway keeps and all the api-server is
// told: SHA-256 over the UTF-8 bytes of "kusinta-invite-token:" followed by the token, or
// "kusinta-invite-code:" followed by the normalised code. The prefixes keep a token and a
// code from ever sharing a hash.

// Creates an invite on a space.
//
// relation is RESIDENT or SERVICE and nothing else, and it decides the role the person
// will hold: a resident for RESIDENT, a technician for SERVICE. RESIDENT is refused
// anywhere but a home (access.v1.MembershipRelation). No invite ever makes anyone a
// gateway administrator or a property owner: those come only by promotion of someone
// already a member, and any other relation is refused as INVALID_REQUEST.
//
// Who may create one is the gateway's decision, as for AssignUserToSpace. The gateway may
// let a home's residents invite residents into their own home only, within a limit per
// home. A caller over that limit is refused as FAILED_PRECONDITION with metadata
// {"reason": "household_full"}.
//
// Whether a RESIDENT invite with no address is a home key or a household invite (see the
// file header) is decided by who creates it, never asked for: a home key when the caller
// holds ROLE_PROPERTY_OWNER or ROLE_GATEWAY_ADMIN, whether or not they live in the home; a
// household invite when the caller creates it as a resident of the home.
//
// A gateway holds at most 5000 invites whose secrets it reports
// (reporting.v1.ReportInviteRoutesRequest), used ones included until their secrets
// expire. Past that, CreateInvite MUST be refused as FAILED_PRECONDITION with metadata
// {"reason": "too_many_invites"}, so no invite exists that the api-server cannot route.
//
// Answered with IssuedInvite.
message CreateInvite {
  kusinta.iot.identity.v1.SpaceId space_id = 1;
  kusinta.iot.access.v1.MembershipRelation relation = 2;

  // When set, the invite is bound to this address: only an account whose verified email
  // is this address can redeem it (see RedeemInvite). Compared trimmed and
  // case-insensitively over the whole address, with no other folding.
  //
  // One pending invite per space and address: a second for the same address on the same
  // space is refused as FAILED_PRECONDITION with metadata {"reason": "already_invited",
  // "invite_id": <the pending one>}, so the app can offer to resend that one instead.
  //
  // The gateway keeps the address only while the invite is pending, and drops it once the
  // invite is redeemed, revoked or expired.
  string email = 3;

  // When the technician's access ends, as SetAccessUntil describes it. SERVICE only: set
  // on a RESIDENT invite it is INVALID_REQUEST, as is a time not after now. Unset for no
  // end. Both secrets expire no later than it.
  //
  // It reaches only someone the redeem, or the approval of the join request it makes, makes
  // a technician: a user who held no role but ROLE_RESIDENT before and is not the
  // registering administrator. For anyone else it is ignored, so an invite can neither
  // shorten nor lengthen a member's access, nor put an end on a property owner or an
  // administrator. A join request the invite makes expires no later than it.
  google.protobuf.Timestamp access_until = 4;
}

// Gives a pending invite new secrets. The old token and code stop working at once, so
// only the newest link, code or email does. Both expiries restart from now. Answered
// with IssuedInvite. An invite's bound address cannot be changed: revoke it and create
// another.
message ResendInvite {
  string invite_id = 1;
}

// Ends a pending invite: neither secret works from now on. Answered with ManagementAck.
message RevokeInvite {
  string invite_id = 1;
}

// Records that the email carrying this invite's newest secrets was sent, so the list can
// say whether it ever left. Sent by the app after the api-server has accepted the email,
// and again after each resend. Only the time is kept. Answered with ManagementAck.
message MarkInviteEmailSent {
  string invite_id = 1;
}

// The pending invites and join requests of a space. Answered with SpaceInvites. Listed
// only to a caller who may create invites on the space; anyone else is refused as
// NOT_ENTITLED. A resident is listed only the invites a resident of their home made,
// and the join requests those made: nothing they cannot act on.
//
// A household invite, and the join requests it made, are listed only to the residents of
// that home, a property owner or an administrator included only if they live there:
// otherwise Invite.created_by and JoinRequest.invited_by would say where its maker lives.
message ListSpaceInvites {
  kusinta.iot.identity.v1.SpaceId space_id = 1;
}

// Files the person who made a join request on its space, with its relation, and the role
// that relation gives. Answered with ManagementAck.
//
// Who may approve is the gateway's decision, by the kind of invite the request came from
// (see the file header): for a household invite, a resident of that home alone, and not a
// property owner or an administrator who does not live there; for a SERVICE invite with no
// address, whoever may put people on that space. Anyone else is refused as NOT_ENTITLED.
message ApproveJoinRequest {
  string request_id = 1;
}

// Drops a join request. The person is told nothing beyond never being let in. Answered
// with ManagementAck. Who may deny is who may approve (ApproveJoinRequest).
message DenyJoinRequest {
  string request_id = 1;
}

// What redeeming an invite does, by its kind (see the file header). Decided by the gateway
// when the invite is created and told in Invite.admission, so the app can say what
// redeeming will do before the invite is shared.
enum InviteAdmission {
  // Not told. The app reads it as not known, never as any value below.
  INVITE_ADMISSION_UNSPECIFIED = 0;

  // Bound to an address: files the person at once if the verified address of their account
  // matches (CreateInvite.email).
  INVITE_ADMISSION_ON_EMAIL_MATCH = 1;

  // A home key: files whoever redeems it on the home at once, with no join request.
  INVITE_ADMISSION_ON_REDEEM = 2;

  // Makes a join request, and the person is filed only once it is approved
  // (ApproveJoinRequest).
  INVITE_ADMISSION_ON_APPROVAL = 3;
}

// A pending invite, as listed. Never carries a secret: the gateway does not keep them.
message Invite {
  // Minted by the gateway, opaque.
  string invite_id = 1;

  kusinta.iot.identity.v1.SpaceId space_id = 2;
  kusinta.iot.access.v1.MembershipRelation relation = 3;

  // Who created it, and when. A resend changes neither.
  kusinta.iot.identity.v1.UserId created_by = 4;
  google.protobuf.Timestamp created_at = 5;

  // Until when each secret can be redeemed. The app shows them in local time and never
  // works them out itself. Once both have passed the invite is gone: it is not listed, and
  // the gateway drops it with its address.
  google.protobuf.Timestamp token_expires_at = 6;
  google.protobuf.Timestamp code_expires_at = 7;

  // The address it is bound to; empty when it is bound to none.
  string email = 8;

  // When the email with the newest secrets was sent (MarkInviteEmailSent). Unset when no
  // email was sent since the last resend.
  google.protobuf.Timestamp email_sent_at = 9;

  // As CreateInvite.access_until.
  google.protobuf.Timestamp access_until = 10;

  // What redeeming it does, as the gateway decided when it was created. The gateway MUST
  // set it on every invite it lists or issues.
  InviteAdmission admission = 11;
}

// A new invite or a resent one, with its secrets. This is the only time they are told:
// the gateway keeps only their hashes, and the app does not keep them beyond handing them
// over.
message IssuedInvite {
  Invite invite = 1;
  string token = 2;
  string code = 3;
}

// A person who redeemed an invite that needs approval, waiting for it.
message JoinRequest {
  // Minted by the gateway, opaque.
  string request_id = 1;

  kusinta.iot.identity.v1.SpaceId space_id = 2;
  kusinta.iot.access.v1.MembershipRelation relation = 3;

  // Who is asking to join, and the display name their account gave when they redeemed.
  kusinta.iot.identity.v1.UserId user_id = 4;
  string display_name = 5;

  // Who created the invite that was redeemed.
  kusinta.iot.identity.v1.UserId invited_by = 6;

  google.protobuf.Timestamp requested_at = 7;

  // When the request lapses unanswered, and the gateway drops it as if denied.
  google.protobuf.Timestamp expires_at = 8;

  // The verified email address of the account asking (signaling.v1.RedeemInvite), shown to
  // whoever may approve the request (ApproveJoinRequest): the household for a household
  // invite, and otherwise those who may put people on the space. A display name is
  // whatever the person chose; this is what lets an approver tell who is really asking. The
  // app tells a person redeeming that their address will be shown so. Kept only while the
  // request is pending.
  string email = 9;

  // The end of access the request asks for: CreateInvite.access_until of the invite that
  // was redeemed, which the approval gives as that field says. Unset for none. The request
  // expires no later than it, so it is never approved once the end has passed.
  google.protobuf.Timestamp access_until = 10;
}

// What a space is waiting on: its pending invites and its join requests.
//
// The answer to ListSpaceInvites, and pushed as GatewayMessage.space_invites whenever
// either list changes — a create, resend, revoke, redeem, approval, denial or expiry — to
// every session that may list it, so the app shows the change without reloading. A push
// always carries the whole of both lists for its space, as ListSpaceInvites would list
// them to that session: a household invite and its join requests reach only the sessions
// of that home's residents.
message SpaceInvites {
  kusinta.iot.identity.v1.SpaceId space_id = 1;
  repeated Invite invites = 2;
  repeated JoinRequest join_requests = 3;
}
