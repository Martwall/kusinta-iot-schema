syntax = "proto3";

package kusinta.iot.webrtc.v1;

import "google/protobuf/timestamp.proto";
import "kusinta/iot/device/v1/device.proto";
import "kusinta/iot/device/v1/property_update.proto";
import "kusinta/iot/access/v1/acl.proto";

option optimize_for = SPEED;

// Full device state sent to the Flutter app on initial WebRTC connection.
message DeviceStateSnapshot {
  repeated kusinta.iot.device.v1.Device devices        = 1;
  kusinta.iot.access.v1.EffectivePermissions permissions = 2;
  google.protobuf.Timestamp              snapshotted_at = 3;
}

// Single property change event streamed to the Flutter app in real time.
message DevicePropertyEvent {
  kusinta.iot.device.v1.PropertyUpdate update               = 1;
  google.protobuf.Timestamp            gateway_processed_at = 2;
}
