syntax = "proto3";

package kusinta.iot.connector.v1;

import "google/protobuf/timestamp.proto";
import "kusinta/iot/common/v1/types.proto";
import "kusinta/iot/identity/v1/identity.proto";
import "kusinta/iot/device/v1/device.proto";
import "kusinta/iot/device/v1/device_event.proto";
import "kusinta/iot/device/v1/property_update.proto";
import "kusinta/iot/webrtc/v1/command.proto";

option optimize_for = SPEED;

message ConnectorInfo {
  kusinta.iot.identity.v1.ConnectorId connector_id            = 1;
  string                              display_name            = 2;
  string                              version                 = 3;
  kusinta.iot.common.v1.ConnectorTransport transport          = 4;
  string                              endpoint                = 5; // unix socket path or host:port
  repeated uint32                     supported_device_type_ids = 6;
}

message ConnectorHandshake {
  ConnectorInfo                        info          = 1;
  repeated kusinta.iot.device.v1.Device known_devices = 2;
}

message HandshakeAck {
  bool                              accepted   = 1;
  string                            reason     = 2;
  kusinta.iot.identity.v1.GatewayId gateway_id = 3;
}

// A device the connector has found. Carries the full Device, not just its descriptor,
// because a device's endpoints are what say which Matter device types it presents — and
// without them the gateway cannot resolve any PropertyUpdate the device goes on to send.
//
// Properties may be unset on every endpoint; that means the device exists and has
// reported nothing yet, which is the normal state at announcement.
message DeviceAnnouncement {
  reserved 1;
  reserved "descriptor";

  kusinta.iot.device.v1.Device device = 2;
}

message DeviceRemoval {
  kusinta.iot.identity.v1.DeviceId device_id = 1;
  string                           reason    = 2;
}

message HeartBeat {}

message SubscribeDevice {
  kusinta.iot.identity.v1.DeviceId device_id = 1;
}

message UnsubscribeDevice {
  kusinta.iot.identity.v1.DeviceId device_id = 1;
}

message GatewayError {
  string                   code    = 1;
  string                   message = 2;
  string                   request_id = 3; // non-empty if the error answers a command or a write
}

// A connector's answer to an executed command OR attribute write. One message for both:
// the two operations differ in what they do to a device, not in how a connector reports
// having done it, and request_id says which request this answers either way.
message ConnectorCommandResult {
  // Was command_id. Renamed with webrtc.v1.DeviceCommand.request_id, which it mirrors, and
  // because it now correlates writes as well as commands.
  string                    request_id    = 1;
  bool                      success       = 2;
  GatewayError              error         = 3;
  google.protobuf.Timestamp completed_at  = 4;
}

message SessionRequest {
  string                    message_id = 1;
  google.protobuf.Timestamp sent_at    = 2;

  oneof payload {
    ConnectorHandshake                        handshake       = 3;
    kusinta.iot.device.v1.PropertyUpdateBatch property_update = 4;
    DeviceAnnouncement                        device_announced = 5;
    DeviceRemoval                             device_removed  = 6;
    ConnectorCommandResult                    command_result  = 7;
    HeartBeat                                 heartbeat       = 8;
    kusinta.iot.device.v1.DeviceEventBatch     device_events   = 9;
  }
}

message SessionResponse {
  string                    message_id = 1;
  google.protobuf.Timestamp sent_at    = 2;

  reserved 4;

  oneof payload {
    HandshakeAck                        handshake_ack   = 3;
    SubscribeDevice                     subscribe       = 5;
    UnsubscribeDevice                   unsubscribe     = 6;
    GatewayError                        error           = 7;
    kusinta.iot.webrtc.v1.DeviceCommand execute_command = 8;

    // The connector-leg half of PERMISSION_ACTION_WRITE. A sibling case rather than another
    // meaning overloaded onto execute_command, which is the mistake this replaces.
    kusinta.iot.webrtc.v1.AttributeWriteRequest execute_attribute_write = 9;
  }
}
