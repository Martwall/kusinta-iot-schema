syntax = "proto3";

package kusinta.iot.reporting.v1;

import "kusinta/iot/reporting/v1/reporting.proto";

option optimize_for = SPEED;

// The building-server gateway's reports to the api-server, over the gateway's client
// certificate: which gateway is reporting comes from the certificate. One unary call per
// concern, each with its own stream of reports, so a slow call for one never holds back
// another.
service GatewayReportingService {
  rpc ReportProblems(ReportProblemsRequest) returns (ReportProblemsResponse);
  rpc ReportServiceReach(ReportServiceReachRequest) returns (ReportServiceReachResponse);
  rpc ReportServedSpaces(ReportServedSpacesRequest) returns (ReportServedSpacesResponse);
  rpc ReportMembers(ReportMembersRequest) returns (ReportMembersResponse);
  rpc ReportInviteRoutes(ReportInviteRoutesRequest) returns (ReportInviteRoutesResponse);

  // The software the gateway runs (SOFTWARE).
  rpc ReportSoftware(ReportSoftwareRequest) returns (ReportSoftwareResponse);

  // Not a report: asks the api-server to push notices to people's devices (NOTICES).
  rpc SendNotices(SendNoticesRequest) returns (SendNoticesResponse);
}
