syntax = "proto3";

package kusinta.iot.commissioning.v1;

import "google/protobuf/timestamp.proto";
import "kusinta/iot/device/v1/cluster_state.proto";
import "kusinta/iot/identity/v1/identity.proto";

option optimize_for = SPEED;

// How a home's heating was commissioned: the facts known about it, the house template it
// was built to, the tests the building-server gateway has run on its outputs, and which
// heating features work because of them.
//
// FACTS. A fact is one answer about one space — a building, a home or a room — or about one
// heating record (heating.v1) in it, under a key. Which keys there are, the value type each
// takes, who answers it and how much it is needed are the gateway's catalogue: it refuses a
// key it does not know, and fills answerer, necessity, feature and topic from the
// catalogue. A key is never reused for another meaning. A client words a key named in this
// file by the key, and any other by its FactTopic, never by the raw key. A key is fixed here
// when a safety rule depends on it, or when a household answers it or is shown it (HOUSEHOLD
// QUESTIONS). The keys a safety rule depends on:
//
//   "floor.pump_tolerates_all_zones_off"  bool; a floor circuit. Whether its pump runs safely
//       with every zone on the manifold off (not heating): a variable-speed pump, or a
//       bypass. Set only by a concluded PUMP_ALL_ZONES_OFF test, as MEASURED: true on a
//       pass, false on a fail. Until it is true, the gateway keeps at least one zone of the
//       circuit heating at all times.
//   "floor.max_zones_switching_on"  uint; a floor circuit. How many of its zones the wiring
//       centre's supply carries switching on at once: thermal actuators draw several times
//       their holding power while they open. The gateway switches no more zones on within
//       one actuator travel time, counting zones a lapsing lease returns to rest: the leases
//       of zones held off together end that far apart, in groups no larger. Unknown: 1.
//       This holds while the gateway runs. With the gateway gone, zones return to rest as
//       their leases end, and a device whose timer is shared by its outputs returns them
//       all at once, as after a power cut: an accepted risk, like a missing fallback
//       ceiling thermostat.
//   "floor.actuator_travel_seconds"  uint; a floor circuit. How long its zone actuators take
//       to open fully. No zone is switched again sooner after it was switched. Unknown: 300.
//   "floor.fallback_ceiling_thermostat"  bool; a floor zone. Whether a thermostat in series
//       caps the zone while the gateway is gone. Recorded, not enforced: false is an
//       accepted risk.
//   "plant.max_block_minutes"  uint; a plant. The longest the gateway holds an input that
//       blocks heat (heating.v1.HeatPumpControl) in one go. Unknown: the gateway blocks
//       nothing outside an OUTPUT_LEASE test, and the plant feature needs it.
//
// A fact's value takes the type its key states, matched by type as well as value, as
// heating.v1.ContactBinding.closed_value is. A key that states a closed list or a range takes
// only its values. A key that takes a list (AttributeValue.list_value) takes each value at
// most once, in any order, and an empty list is an answer whose meaning the key states. A
// value a person puts is never free text: every string key a person may put states a closed
// list, so that nothing a household writes outlives it by an installer confirming it. A
// string key only the gateway sets (AUTOMATIC) may carry what its source names.
//
// A closed list grows only by a release of this schema adding a value. A value is never
// removed or given another meaning: a brand or operator that is renamed or merged keeps the
// values it had. The gateway refuses a value outside the list as it knows it. A client words
// a value it knows by the value, and one it does not know, added after it was built, as an
// answer about the key's topic, as it words a key it does not know, and when it puts a list
// again keeps the values it read but does not know, so that an older client drops none —
// unless it puts the empty list, which answers that none applies. "other" is an answer: a
// value outside the list, known to whoever answered. "Don't know" is never a value of a list:
// it is CommissioningFact.unknown.
//
// HOUSEHOLD QUESTIONS. The keys a household answers or is shown, so that a client can ask
// each in its own words and offer only the values it takes. Each is answered by a household
// admin (HOUSEHOLD), or by an installer under a commissioning grant (WHO SEES AND CHANGES IT;
// HOUSE FACTS), save where it says otherwise. None feeds a safety rule, so none has a value
// the gateway assumes while it is unanswered: it stays a need of the feature, or of
// HomeSetup, that needs it. After each key's meaning: its FactTopic; its Necessity, with the
// Feature for FOR_FEATURE; and the evidence it takes, any other refused, DRAWING marking a
// key a house template may answer (TEMPLATES). A room key is asked of every room of the
// home; a plant key of a plant the home's heating records hold whose source is a heat pump
// (heating.v1.HeatingPlant.source); "home.grid_operator" and "home.main_fuse_amperes" only
// while "home.own_grid_subscription" is true. A key not asked is not needed and is read by no
// feature; an answer it holds is kept. A plant key about a plant outside homes (a central
// plant in a shared space) is answered by the owner organisation (OWNER_ORGANISATION), as
// facts about spaces outside homes are, never by a household.
//
//   "room.walls_changed"  bool; a room. Whether a wall bounding it was added, removed or
//       moved since the house was built, so that the drawing's rooms, emitters and floor
//       zones may not hold for it. The rooms themselves are spaces (space.v1), not facts.
//       ROOMS; REQUIRED; STATED, INSPECTED.
//   "room.heating"  list of string; a room. What heats it, from: "radiator_water" (radiators
//       on a heating circuit), "radiator_electric" (electric panel heaters), "floor_water"
//       (water floor heating), "floor_electric" (an electric floor), "air_to_air_heat_pump"
//       (an indoor unit of one), "other". Empty: nothing heats it. A towel heater is not
//       counted ("room.electric_towel_heater"). ROOMS; REQUIRED; STATED, PHOTO, DRAWING,
//       INSPECTED.
//   "room.thermostats"  list of string; a room. The kinds of thermostat in it that steer its
//       heating, from: "radiator_valve" (a thermostatic head on a water radiator,
//       self-acting or electronic), "floor_water_thermostat" (a room thermostat switching
//       water floor heating), "floor_electric_thermostat" (an electric floor's own),
//       "heat_pump_room_sensor" (the heat pump's room unit or sensor), "other". One built into
//       an electric panel heater is not counted. Empty: none. ROOMS; REQUIRED; STATED, PHOTO,
//       DRAWING, INSPECTED.
//   "room.electric_towel_heater"  bool; a room. Whether an electric towel heater is in it;
//       one on a heating circuit is not. An electric floor, the other comfort load, is
//       "room.heating" "floor_electric". COMFORT_LOADS; FOR_FEATURE COMFORT_LOADS; STATED,
//       PHOTO, DRAWING, INSPECTED.
//   "plant.heat_pump_brand"  string; a plant. The brand on the heat pump's nameplate, from:
//       "nibe", "thermia", "ivt", "ctc", "bosch", "daikin", "mitsubishi_electric",
//       "panasonic", "toshiba", "fujitsu", "lg", "samsung", "vaillant", "viessmann",
//       "stiebel_eltron", "nilan", "other". HEAT_SOURCE; FOR_FEATURE PLANT; STATED, PHOTO,
//       DRAWING, INSPECTED, DERIVED (from a linked account, accountlink.v1).
//   "plant.heat_pump_model"  string; a plant. The heat pump's model as its maker's service
//       names it, read through a linked account (accountlink.v1), never a name the account
//       holder gave the device. Set by the gateway alone (AUTOMATIC); a put is refused as
//       ANSWERER. A house fact: it describes the heat pump, not the account. HEAT_SOURCE;
//       OPTIONAL; DERIVED.
//   "plant.vendor_account"  bool; a plant. Whether the household holds an account at the
//       heat pump's maker that the heat pump is registered to, so that the home can be
//       linked to it (accountlink.v1). HEAT_SOURCE; FOR_FEATURE PLANT; STATED, INSPECTED,
//       DERIVED (true once the home holds a link that reaches the heat pump).
//   "home.own_grid_subscription"  bool; a home. Whether the home has its own connection to
//       the electricity grid, billed to the household by the grid operator. False: it is on
//       the building's shared connection, which the owner organisation answers for.
//       ELECTRICITY; FOR_FEATURE COST; STATED, INSPECTED.
//   "home.grid_operator"  string; a home. Who operates the grid its own connection is on,
//       from: "se_ellevio", "se_vattenfall_eldistribution", "se_eon_energidistribution",
//       "se_goteborg_energi", "se_malarenergi", "se_kraftringen", "se_oresundskraft",
//       "se_tekniska_verken", "se_jamtkraft", "se_skelleftea_kraft", "se_umea_energi",
//       "se_lulea_energi", "se_gavle_energi", "se_boras_elnat", "se_jonkoping_energi",
//       "se_halmstads_energi", "se_sundsvall_elnat", "other". Every value but "other" names
//       an operator by its country's ISO 3166-1 alpha-2 code and the operator. ELECTRICITY;
//       FOR_FEATURE COST; STATED, INSPECTED, DERIVED (from the building's address).
//   "home.main_fuse_amperes"  uint; a home. The rating of its own connection's main fuse,
//       per phase, in amperes, from 1 to 1000. A client offers the standard ratings 10, 16,
//       20, 25, 35, 50, 63, 80, 100, 125, 160 and 200, and takes any other in the range.
//       ELECTRICITY; FOR_FEATURE COST; STATED, PHOTO, DRAWING, INSPECTED.
//
// Comfort wishes and schedules (FACT_TOPIC_COMFORT) have no key here.
//
// EVIDENCE_PHOTO says an answer was read from a photo; no message here carries the photo.
//
// HOUSE FACTS AND HOUSEHOLD DATA. A fact an installer confirmed (any evidence), or the
// gateway derived or measured, describes the house: it is a HOUSE fact, kept when the
// household changes. A fact the household answered (provenance.party HOUSEHOLD) is
// HOUSEHOLD data: wiped at a household handover, with the photos it cites. An installer
// confirming a household's answer makes it a house fact. At a handover the house facts and
// the tests stay, with provenance.by cleared and provenance.party kept.
//
// TEMPLATES. An owner organisation describes each house type of a building once, from its
// drawings, as a HouseTemplate, and says which homes follow which. A template's fact counts
// for a home that follows it as the home's answer with DRAWING evidence, until the home
// answers the key itself, and only for a key that DRAWING satisfies: a key an installer or
// the gateway answers, or one needing more evidence, is answered per home. A home's fact
// that departs from its template names the template and version it departs from (a
// deviation, CommissioningFact.deviates_from). The owner organisation never sees a home's
// facts, deviations included, nor a home's tests or to-dos: only whether the home is set up
// (HomeSetup). The commissioning profile must not become a channel that tells a building's
// owner who has renovated.
//
// WHO SEES AND CHANGES IT. A fact, test or feature about a home — its rooms, or a heating
// record naming a room in it (heating.v1) — is given to the home's residents and to an
// installer under a commissioning grant on the home (GRANTS). A fact is put by a household
// admin of the home (access.v1.MEMBERSHIP_RELATION_HOUSEHOLD_ADMIN; HOUSEHOLD), or by that
// installer (INSTALLER). Facts about spaces outside homes are given to and put by the
// property owner and the gateway's administrators (OWNER_ORGANISATION), and by an installer
// under a grant on the space or one above it. A caller who
// reaches a home as service gets none of it, and is refused as NOT_ENTITLED. A fact of
// FACT_TOPIC_COMFORT is the exception: it is given to and put by the home's residents only,
// never under a commissioning grant, and no installer answers it.
//
// Of the feature states, residents who are not a household admin are given the states
// and the blocks, not the needs (CommissioningProfile.needs_withheld): the to-dos belong
// to whoever can answer them. "Don't know" from the household lists the fact as a need
// for the installer.
//
// TESTS. The gateway runs every test itself, on one heating record or one binding of it
// (BindingRef). While a
// test drives an output nothing else does, and every write it makes is leased
// (device.v1.LeasedWrite) to end no later than the test's ends_at, so a gateway that stops
// mid-test leaves the output to return to rest. A test ends at its ends_at at the latest,
// and the output returns to its normal control.
//
// The gateway drives a bound output away from rest only while it holds a current pass of
// OUTPUT_LEASE run on it (heating.v1). Writing the lapse value, which returns the output to
// rest, is always allowed: on unbinding, after a test, or at any time. A pass tests the
// output as its producer runs it; it does not prove what the device does with the producer
// gone. A pass stops being current (CommissioningTest.superseded) when:
//   * its binding changes: another output, another device, another closed_value;
//   * the device is replaced or re-paired, even under the same binding;
//   * for a floor zone, its rooms or its control room change. Area shares may change
//     freely.
//
// GRANTS. A commissioning grant (CommissioningGrant) lets one named installer commission one
// space for a bounded time. The installer asks for it (webrtc.v1.RequestCommissioningGrant)
// and whoever governs the space answers: for a home, a household admin of it, or while it is
// empty (webrtc.v1 household.proto, EMPTY HOME) the property owner or the gateway's
// administrators; for a space outside homes, the property owner or the gateway's
// administrators. The installer is a member holding access.v1.ROLE_TECHNICIAN who reaches the
// space, and who does not live in it: a household does not commission its own answers into
// house facts. Nobody else is granted one. Someone who also holds a staff role acts as
// INSTALLER only in what they do under the grant's cover; the rest of their access is as it
// was.
// A grant on a home covers the home and its rooms; a grant on a space outside homes covers it
// and the spaces below it, save every home among them, which only a grant on that home
// covers.
//
// A grant is active from starts_at until ends_at, and then ends on its own. While active it
// covers, on the spaces it covers and nothing else:
//   * the commissioning there, as INSTALLER: its facts — save FACT_TOPIC_COMFORT — tests and
//     feature states, needs included;
//   * the heating records there (heating.v1), comfort loads without their windows, and
//     binding outputs on devices filed there;
//   * the outer limits of the rooms there (climate.v1.OuterRoomLimits,
//     webrtc.v1.ConfigureRoomClimate);
//   * running commissioning tests there, and concluding PUMP_ALL_ZONES_OFF;
//   * while a test the installer started under it runs, the readings that test is judged by:
//     the state of the output it drives and, for ZONE_EFFECT, its control room's temperature
//     and the circuit's return probe, from the test's start to its end and none from before
//     or after;
//   * the photos a household shares for commissioning, those it shares and only while the
//     grant is active.
// It NEVER covers a home's history (room history, climate summaries), savings or comfort
// settings (targets, inner limits, modes, comfort-load windows, FACT_TOPIC_COMFORT), its device
// events, nor who lives there. Outside what it covers the installer sees a home as service, as
// before.
//
// A grant ends at ends_at, when it is ended (webrtc.v1.EndCommissioningGrant), when the
// installer stops holding ROLE_TECHNICIAN or reaching the space, and for a home when its last
// residency ends and when it is wiped (webrtc.v1 household.proto, VACANCY and WIPE): a grant
// never passes from one household to the next. One the property owner or a gateway
// administrator granted on an empty home ends when the home gains a resident (webrtc.v1
// household.proto, MOVE-IN), so it never covers a household that did not grant it. What it covered goes from the
// installer's sessions at once, and a test they started under it is ABORTED, its outputs
// returning to their normal control as webrtc.v1.ConcludeCommissioningTest says, floor zones
// switching on no faster than "floor.max_zones_switching_on" allows. Until it ends —
// requested, or granted whether or not it has started — it is visible to the household:
// listed to every resident of the home (webrtc.v1.ListCommissioningGrants), pushed to them as
// it changes, and endable by its household admins; on an empty home, to the property owner and
// the gateway's administrators instead. Once granted, it stays on record for the
// home's residents after it ends (CommissioningGrantRecord, in their privacy disclosure), until
// the home is wiped.

// Who answers a fact, or ran or concluded a test.
enum Party {
  PARTY_UNSPECIFIED = 0;
  // The property owner or the gateway's administrators.
  PARTY_OWNER_ORGANISATION = 1;
  // A household admin of the home (access.v1.MEMBERSHIP_RELATION_HOUSEHOLD_ADMIN).
  PARTY_HOUSEHOLD = 2;
  // An installer under a commissioning grant (CommissioningGrant).
  PARTY_INSTALLER = 3;
  // The gateway, from a device, a connector or a measurement of its own.
  PARTY_AUTOMATIC = 4;
}

// How much a fact is needed.
enum Necessity {
  NECESSITY_UNSPECIFIED = 0;
  // Before the home is set up (HomeSetup).
  NECESSITY_REQUIRED = 1;
  // Before its feature works (CommissioningFact.feature).
  NECESSITY_FOR_FEATURE = 2;
  NECESSITY_OPTIONAL = 3;
}

// How an answer was confirmed. A household answers STATED, PHOTO or DRAWING; INSPECTED and
// MEASURED are an installer's or the gateway's; DERIVED is the gateway's alone. A key may
// require more (see the file comment); less is refused.
enum Evidence {
  EVIDENCE_UNSPECIFIED = 0;
  EVIDENCE_STATED = 1;
  EVIDENCE_PHOTO = 2;
  EVIDENCE_DRAWING = 3;
  EVIDENCE_INSPECTED = 4;
  EVIDENCE_MEASURED = 5;
  // From other facts, the address or a connector's declaration.
  EVIDENCE_DERIVED = 6;
}

// Who answered, how and when. Set by the gateway from the caller, never taken from a put,
// save evidence.
message Provenance {
  Party party = 1;
  Evidence evidence = 2;
  google.protobuf.Timestamp at = 3;
  // Unset for AUTOMATIC, and after a household handover. On a home's facts and tests it is
  // given to the home's residents, and to an installer only on what that installer put,
  // started or concluded; to anyone else it is left unset, with party kept.
  kusinta.iot.identity.v1.UserId by = 4;
}

// What a fact is about, for a client that does not know its key. Closed: a client words a
// topic it does not know as a detail about the space or record, from its answerer.
enum FactTopic {
  FACT_TOPIC_UNSPECIFIED = 0;
  // The building: type, house types, drawings, gateway site, service agreements, payer.
  FACT_TOPIC_BUILDING = 1;
  // Rooms, walls added or removed, how each room is heated, its thermostats.
  FACT_TOPIC_ROOMS = 2;
  // The heat source: heat pump, its inputs, vendor account, blocks.
  FACT_TOPIC_HEAT_SOURCE = 3;
  // Floor heating: circuits, pump, mixing, supply cap, zones, actuators, probes.
  FACT_TOPIC_FLOOR_HEATING = 4;
  // Electric comfort loads: bathroom floors, towel heaters, their thermostats.
  FACT_TOPIC_COMFORT_LOADS = 5;
  // Electricity: grid subscription, operator, fuse size, meter and its port.
  FACT_TOPIC_ELECTRICITY = 6;
  // District heating: utility and tariff.
  FACT_TOPIC_DISTRICT_HEATING = 7;
  // Radio coverage and the gateways that carry it.
  FACT_TOPIC_CONNECTIVITY = 8;
  // Comfort wishes and schedules. Residents only, never under a commissioning grant.
  FACT_TOPIC_COMFORT = 9;
}

// One heating record (heating.v1), or one binding of it. An output is always named by its
// proto field name as the heating record puts name it ("output", "sg_ready_block", ...),
// even a record's only one; an empty field is the record itself, never an output.
message BindingRef {
  string record_id = 1;
  string field = 2;
}

// One version of a house template.
message TemplateRef {
  string template_id = 1;
  uint32 version = 2;
}

message CommissioningFact {
  // Assigned by the gateway, opaque; empty when creating.
  string fact_id = 1;

  // The space the fact is about: a building, a home or a room.
  kusinta.iot.identity.v1.SpaceId space_id = 2;

  // A heating record within that space the fact is about. Empty: the space itself.
  string record_id = 3;

  string key = 4;

  oneof answer {
    kusinta.iot.device.v1.AttributeValue value = 5;
    // "Don't know": an answer, which lists the fact as a need for the next party who can
    // answer it. Only true is sent; false is refused.
    bool unknown = 6;
  }

  // From the gateway's catalogue.
  Party answerer = 7;
  Necessity necessity = 8;
  // For FOR_FEATURE.
  Feature feature = 9;

  Provenance provenance = 10;

  // Set by the gateway and bumped by every change; a put that replaces a fact, and a
  // remove, names the revision it acts on.
  uint64 revision = 13;

  // Set: this answer departs from that version of a template, the home's when it was
  // recorded.
  TemplateRef deviates_from = 15;

  // From the gateway's catalogue.
  FactTopic topic = 16;

  reserved 11 to 12, 14;
  reserved "scope", "template_version", "template_id";
}

// One answer in a house template.
message TemplateFact {
  string key = 1;
  // What it is about, as named on the drawing ("SL 2", "Bathroom"). Empty: the house.
  string subject_label = 2;
  kusinta.iot.device.v1.AttributeValue value = 3;

  reserved 4;
  reserved "provenance";
}

// One house type of a building, as built. The owner organisation's.
message HouseTemplate {
  // Assigned by the gateway, opaque; empty when creating.
  string template_id = 1;
  kusinta.iot.identity.v1.SpaceId building_id = 2;
  string name = 3;

  // Set by the gateway and bumped by every put; a put that replaces a template names the
  // version it replaces. A version once given is never given to other content.
  uint32 version = 4;

  repeated TemplateFact facts = 5;

  // Who put this version, set by the gateway; its evidence is DRAWING. provenance.by is
  // given to the owner organisation only, and left unset for residents and installers.
  Provenance provenance = 6;
}

// The heating features a home's commissioning unlocks.
enum Feature {
  FEATURE_UNSPECIFIED = 0;
  FEATURE_FLOOR_ZONES = 1;
  // Steering the heat source (heating.v1.HeatingPlant.control).
  FEATURE_PLANT = 2;
  FEATURE_COMFORT_LOADS = 3;
  // Planning by electricity price and the home's grid tariff.
  FEATURE_COST = 4;
  // Holding the home's load under a power peak, live.
  FEATURE_PEAK_GUARD = 5;
  // Planning by forecast, from the room models.
  FEATURE_PLANNING = 6;
}

enum FeatureState {
  // A state this schema does not know: read as NEEDS.
  FEATURE_STATE_UNSPECIFIED = 0;
  FEATURE_STATE_WORKS = 1;
  // Something it needs is missing (FeatureStatus.needs), and nothing blocks it.
  FEATURE_STATE_NEEDS = 2;
  // FeatureStatus.blocks says why. Takes precedence over NEEDS.
  FEATURE_STATE_BLOCKED_FOR_SAFETY = 3;
}

// A fact or a test a feature needs, and who can provide it.
message Need {
  oneof what {
    string fact_key = 1;
    TestKind test = 2;
  }
  // What it is needed about. For a fact, CommissioningFact.space_id and record_id, with
  // binding.field empty; for a test, what it runs on, as CommissioningTest.binding.
  kusinta.iot.identity.v1.SpaceId space_id = 3;
  Party answerer = 5;
  BindingRef binding = 7;
  // For a fact, its CommissioningFact.topic.
  FactTopic fact_topic = 8;

  reserved 4, 6;
  reserved "record_id", "field";
}

enum BlockReason {
  BLOCK_REASON_UNSPECIFIED = 0;
  // Its latest test failed, and has not passed since.
  BLOCK_REASON_TEST_FAILED = 1;
  // Its producer no longer states the output's write as leased with a lapse value at rest
  // (heating.v1).
  BLOCK_REASON_OUTPUT_NOT_LEASED = 2;
  // Its producer now states a power-on value that would leave the contact away from rest,
  // though a pass predates it. A test that finds this fails instead
  // (TEST_FAILURE_POWER_ON_NOT_AT_REST), and blocks as TEST_FAILED.
  BLOCK_REASON_POWER_ON_NOT_AT_REST = 3;
  BLOCK_REASON_DEVICE_GONE = 4;
  // A floor zone whose control room is deleted or outside its plant's space.
  BLOCK_REASON_CONTROL_ROOM_GONE = 5;
  // The output's shortest lease (device.v1.LeasedWrite.min_lease_seconds) is longer than
  // the longest it may be held: "plant.max_block_minutes" for a blocking input, or the
  // OUTPUT_LEASE test's 5 minutes.
  BLOCK_REASON_LEASE_TOO_LONG = 6;
}

message FeatureBlock {
  BlockReason reason = 1;
  // The binding, and the device, it is blocked on.
  kusinta.iot.identity.v1.DeviceId device_id = 3;
  BindingRef binding = 5;

  reserved 2, 4;
  reserved "record_id", "field";
}

// One feature of one home. WORKS when every heating record of the feature in the home may
// be driven and nothing it needs is missing.
message FeatureStatus {
  Feature feature = 1;
  FeatureState state = 2;
  repeated Need needs = 3;
  repeated FeatureBlock blocks = 4;
}

enum TestKind {
  TEST_KIND_UNSPECIFIED = 0;

  // On one bound output (heating.v1). The gateway checks that the output's power-on value,
  // where its producer states one, leaves the contact at rest; writes the value that takes
  // it away from rest under a lease of L = the greater of the producer's min_lease_seconds
  // and 60 seconds, and sees the reported contact leave rest; renews the lease before it
  // ends and sees the contact hold past the first lease's end; then lets it lapse and sees
  // the contact return to rest. ends_at is the start plus 2 × L plus 5 minutes for the
  // reports. Runs only on an output whose producer states its reads REAL_TIME and whose
  // lease bounds admit an L of at most 5 minutes, so it ends within 15 minutes; any other
  // is refused before it starts (RunCommissioningTest). Judged by the gateway.
  TEST_KIND_OUTPUT_LEASE = 1;

  // On one floor zone with a current OUTPUT_LEASE pass. The gateway switches the zone and
  // sees its control room's temperature and the circuit's return probe answer. Judged by
  // the gateway. Takes hours; the zone is kept within its rooms' comfort while it runs.
  TEST_KIND_ZONE_EFFECT = 2;

  // On one floor circuit whose every zone holds a current OUTPUT_LEASE pass. The gateway
  // holds every zone off for at most 15 minutes while the installer watches the pump, and
  // the installer concludes it (ConcludeCommissioningTest). Passed or failed, it sets
  // "floor.pump_tolerates_all_zones_off" as MEASURED, with the installer's provenance.
  TEST_KIND_PUMP_ALL_ZONES_OFF = 3;
}

enum TestState {
  TEST_STATE_UNSPECIFIED = 0;
  TEST_STATE_RUNNING = 1;
  TEST_STATE_PASSED = 2;
  TEST_STATE_FAILED = 3;
  // Stopped by a caller, or ended at ends_at without a verdict. Proves nothing.
  TEST_STATE_ABORTED = 4;
}

enum TestFailure {
  TEST_FAILURE_UNSPECIFIED = 0;
  // OUTPUT_LEASE.
  TEST_FAILURE_POWER_ON_NOT_AT_REST = 1;
  TEST_FAILURE_NO_STATE_CHANGE = 2;
  TEST_FAILURE_LEASE_NOT_RENEWED = 3;
  TEST_FAILURE_DID_NOT_RETURN_TO_REST = 4;
  // The device answered nothing within the test.
  TEST_FAILURE_DEVICE_UNREACHABLE = 5;
  // ZONE_EFFECT: the control room and the return did not answer the zone.
  TEST_FAILURE_NO_EFFECT = 6;
  // PUMP_ALL_ZONES_OFF: the installer's verdict.
  TEST_FAILURE_OBSERVED = 7;
}

message CommissioningTest {
  // Assigned by the gateway, opaque.
  string test_id = 1;
  TestKind kind = 2;

  // What it runs on: for OUTPUT_LEASE one binding; for ZONE_EFFECT and PUMP_ALL_ZONES_OFF
  // the record, field empty.
  BindingRef binding = 13;

  // The device it ran on. Set by the gateway.
  kusinta.iot.identity.v1.DeviceId device_id = 5;

  TestState state = 6;
  // FAILED only.
  TestFailure failure = 7;

  google.protobuf.Timestamp started_at = 8;
  // The latest it ends, while it runs.
  google.protobuf.Timestamp ends_at = 9;
  google.protobuf.Timestamp finished_at = 10;

  // Who started it; for an installer's verdict, who concluded it.
  Provenance provenance = 11;

  // A pass that no longer holds; see the file comment.
  bool superseded = 12;

  reserved 3 to 4;
  reserved "record_id", "field";
}

// A space's commissioning, in reply to ListCommissioning.
message CommissioningProfile {
  kusinta.iot.identity.v1.SpaceId space_id = 1;
  repeated CommissioningFact facts = 2;

  // The latest test of each kind on each binding.
  repeated CommissioningTest tests = 3;

  // For a home, one per feature.
  repeated FeatureStatus features = 4;

  // The home's template, at its latest version. Unset: it follows none.
  HouseTemplate template = 6;

  // Set when FeatureStatus.needs are left out for this caller, so that none listed is not
  // read as nothing missing.
  bool needs_withheld = 7;

  reserved 5;
  reserved "template_id";
}

// Whether a home is set up: every REQUIRED fact answered with a value at least once, and
// every output bound in it passed OUTPUT_LEASE at least once on the device it is bound to.
// "Don't know" is not an answer here. What the household does afterwards counts neither
// way: a REQUIRED fact once answered still counts when it is removed or changed to "don't
// know", as a pass superseded by a change of a floor zone's rooms or control room still
// does, so that set_up tells the owner organisation neither of a household's edits nor of
// a renovation. Binding a new output, or a new device, is what it can show. All the owner
// organisation learns of a home's commissioning.
//
// The REQUIRED keys are those this file marks REQUIRED (HOUSEHOLD QUESTIONS) and no other, so
// that set_up means the same on every gateway. A home with no room is not set up. Once a
// home has been set up, its facts count neither way, whatever changes since — a room
// created, an answer removed, a key a later release of this schema marks REQUIRED: only an
// output bound since without a pass on the device it is bound to makes it not set up. A
// household handover does not reset it: the home stays set up for the next household, so
// that set_up tells the owner organisation nothing of who moved in or out.
message HomeSetup {
  kusinta.iot.identity.v1.SpaceId home_id = 1;
  bool set_up = 2;
}

// In reply to ListHomeSetups.
message HomeSetups {
  repeated HomeSetup homes = 1;
}

// One commissioning record as stored, in reply to a put, a test's start or its conclusion.
message CommissioningRecord {
  oneof record {
    CommissioningFact fact = 1;
    CommissioningTest test = 2;
    HouseTemplate template = 3;
  }
}

// Where a commissioning grant stands (see the file comment, GRANTS). An ended grant has no
// state: it is listed no more.
enum CommissioningGrantState {
  // A state this schema does not know: read as REQUESTED, which covers nothing.
  COMMISSIONING_GRANT_STATE_UNSPECIFIED = 0;

  // Asked for by the installer and not yet answered. Covers nothing. Lapses unanswered at
  // expires_at.
  COMMISSIONING_GRANT_STATE_REQUESTED = 1;

  // Granted. Active from starts_at until ends_at; before starts_at it covers nothing yet.
  COMMISSIONING_GRANT_STATE_GRANTED = 2;
}

// One installer's grant to commission one space (see the file comment, GRANTS).
message CommissioningGrant {
  // Minted by the gateway, opaque.
  string grant_id = 1;

  // A home's apartment, or a space outside homes.
  kusinta.iot.identity.v1.SpaceId space_id = 2;

  // The installer who asked for it, and the name they gave their account
  // (webrtc.v1.AppTokenClaims.name) as the gateway last learnt it, so the household knows
  // whom it lets in; empty when none is learnt. Self-chosen, as webrtc.v1.MemberDetail.name
  // is.
  kusinta.iot.identity.v1.UserId installer = 3;
  string installer_name = 4;

  CommissioningGrantState state = 5;

  google.protobuf.Timestamp requested_at = 6;

  // When a request lapses unanswered: 7 days after requested_at, as
  // webrtc.v1.PromotionRequest.expires_at. REQUESTED only.
  google.protobuf.Timestamp expires_at = 7;

  // When it is active, as granted, within the bounds webrtc.v1.AnswerCommissioningGrant sets.
  // GRANTED only.
  google.protobuf.Timestamp starts_at = 8;
  google.protobuf.Timestamp ends_at = 9;

  // Who granted it, and when. GRANTED only. granted_by is given to the home's residents, and
  // for a space outside homes or an empty home to the property owner and the gateway's
  // administrators; to the installer it is unset, since a resident's user id would tell them
  // who lives in the home.
  kusinta.iot.identity.v1.UserId granted_by = 10;
  google.protobuf.Timestamp granted_at = 11;
}

// The grants on one space that have not ended, as listed to one caller: the answer to
// webrtc.v1.ListCommissioningGrants, and pushed whole as webrtc.v1.GatewayMessage
// .commissioning_grants to every session that may list them whenever one is requested,
// answered or ended before its time — to the installer, their own grants alone. Nothing is
// pushed when a grant starts, ends or lapses at the time it states: a client reads those from
// starts_at, ends_at and expires_at.
message CommissioningGrants {
  // The space the grants are on, on a push; unset on a listing.
  kusinta.iot.identity.v1.SpaceId space_id = 1;
  repeated CommissioningGrant grants = 2;
}

// A commissioning grant on a home that was granted, as its residents are told it afterwards
// (webrtc.v1.PrivacyDisclosure.commissioning_grants): who held commissioning access to their
// home, and when. The installer by the name they gave their account as the gateway last learnt
// it, never by user id; empty when none is learnt, and emptied once their account is deleted or
// removed from the gateway, when the record stays without it.
message CommissioningGrantRecord {
  string installer_name = 1;
  // When it was granted, and the time it covered: from its start until it ended. ended_at is
  // unset while it is active.
  google.protobuf.Timestamp granted_at = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ended_at = 4;
}
