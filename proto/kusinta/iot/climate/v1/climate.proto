syntax = "proto3";

package kusinta.iot.climate.v1;

import "google/protobuf/timestamp.proto";
import "kusinta/iot/access/v1/roles.proto";
import "kusinta/iot/identity/v1/identity.proto";

option optimize_for = SPEED;

// Room climate: the room, not a link between two devices, is what a person controls.
//
// A room's temperature used to be set on a link from a sensor to its valves, which made a
// bare thermometer look like the thing in charge. Here the target belongs to the room
// (a Space of SPACE_TYPE_ROOM), and the devices filed in that room are how the gateway
// holds it: sensors measure, valves heat, window contacts pause. Which mechanism carries
// that — a device-to-device link where the hardware can, a gateway-kept loop otherwise —
// is the gateway's choice and not part of this contract.
//
// Only devices filed in exactly that room take part, and a heating device is in at most
// one room. A device in a home takes part only in the home's own rooms, wherever else it
// is filed. A device filed at apartment level takes part in nothing until it is filed
// into a room.

// Who or what last set a room's target, and when.
//
// Shown beside the target, because under "last change wins" a target that moved on its
// own looks like a fault unless the reader can see that somebody turned a radiator by
// hand ten minutes ago.
message TargetChange {
  google.protobuf.Timestamp at = 1;

  oneof by {
    // Set in the app, by this user.
    kusinta.iot.identity.v1.UserId user = 2;

    // Turned by hand at this device: a valve's knob or a wall thermostat's dial, as the
    // device reported it (Matter Thermostat SetpointChangeSource = Manual). A change the
    // device made on its own — window-open, frost protection, its own schedule — is never
    // adopted and never appears here.
    kusinta.iot.identity.v1.DeviceId device = 3;

    // Set by the gateway when the home gained a resident, from the room's outer move-in target
    // (OuterRoomLimits.move_in_target; webrtc.v1 household.proto, MOVE-IN). Only true is sent.
    bool move_in = 4;
  }
}

// What a room is doing right now, in one word. Details live in the fields of
// RoomClimate; this is what a list row shows.
//
// Where several hold at once the room reports the first that applies, in this order:
// NO_TARGET, NO_HEATING, WINDOW_OPEN, HEATING_UNREACHABLE, SENSOR_LOST, NO_SENSOR,
// HOLDING — the one that most changes what a person should expect of the room.
enum RoomClimateCondition {
  ROOM_CLIMATE_CONDITION_UNSPECIFIED = 0;

  // Being held at its effective target from a sensor's reading.
  ROOM_CLIMATE_CONDITION_HOLDING = 1;

  // Nobody has set a target yet. Not a fault: a room that was just created.
  ROOM_CLIMATE_CONDITION_NO_TARGET = 2;

  // Every sensor the room uses has gone quiet. The valves regulate on their own probes
  // towards the target meanwhile — worse comfort, never a frozen reading.
  ROOM_CLIMATE_CONDITION_SENSOR_LOST = 3;

  // A window in the room is open, so heating is paused.
  ROOM_CLIMATE_CONDITION_WINDOW_OPEN = 4;

  // The room has a target but nothing in it can heat.
  ROOM_CLIMATE_CONDITION_NO_HEATING = 5;

  // Every heating device in the room has gone quiet, so nothing is being held however
  // the target is set.
  ROOM_CLIMATE_CONDITION_HEATING_UNREACHABLE = 6;

  // The room has no temperature sensor, so its valves regulate on their own probes
  // towards the target. Not a fault; a room can be set up that way.
  ROOM_CLIMATE_CONDITION_NO_SENSOR = 7;
}

// The climate of one room.
//
// Apply as an upsert keyed on space_id: the same room is sent again whenever any of it
// that the recipient is sent moves (see state_withheld).
message RoomClimate {
  // A Space of SPACE_TYPE_ROOM.
  kusinta.iot.identity.v1.SpaceId space_id = 1;

  // The temperature the room is to be held at, in centidegrees. Unset: nobody has set
  // one. Always within the inner limits where those are set (inner_limits), and bounded by
  // nothing of the room where they are not. Never clamped by the outer ones, a change made by
  // hand at a device they bind included: the target keeps the change, and that device's output
  // is held within them (OuterRoomLimits, WHAT THEY BIND and DEVICE LIMITS).
  //
  // Rollout note: an app that predates outer_limits reads min_centidegrees and
  // max_centidegrees as bounds on this field, and may be sent a target outside them; one that
  // holds its control to them may, on any touch, send the outer bound as the target and so
  // rewrite a household's target set beyond it. An app tells a gateway that predates outer
  // limits by outer_limits unset, and offers it only min and max (ConfigureRoomClimate.limits).
  optional sint32 target_centidegrees = 2;

  // Who or what set target_centidegrees. Unset while the target is, and when it is withheld
  // from the recipient: from service in a home that is not empty (webrtc.v1 household.proto,
  // EMPTY HOME), and from anyone when it dates from before
  // their current residency in the home, or from a home they did not live in at the time
  // (see access.v1.MembershipRelation).
  TargetChange target_change = 3;

  // What the valves are actually being held at, in centidegrees. Equal to the target
  // unless a ClimateMode on an enclosing space sets the room back — and then the room's
  // own target again if somebody changed this room during the mode (see
  // overrides_mode) — or the vacancy setback holds it (webrtc.v1 household.proto, VACANCY), or
  // an outer bound clamps it (outer_limit_clamp). Where the outer limits bind some of the
  // room's outputs and not others, what those they bind are held at (OuterRoomLimits, HELD).
  // Unset while nothing is being held.
  optional sint32 effective_target_centidegrees = 4;

  // Set when somebody changed this room while a ClimateMode was on: the room keeps its
  // own target until the mode ends, while the rest of the apartment stays set back.
  bool overrides_mode = 5;

  // The space whose ClimateMode applies to this room, if one does — set back or,
  // with overrides_mode, overridden. Unset when no mode applies.
  kusinta.iot.identity.v1.SpaceId mode_space_id = 13;

  // A copy of outer_limits.min and .max, in centidegrees, kept for apps that predate
  // outer_limits: each set exactly when its outer bound is, and unset otherwise. Read
  // outer_limits instead. What the gateway writes into a device's own setpoint limits is
  // OuterRoomLimits' (DEVICE LIMITS).
  optional sint32 min_centidegrees = 6 [deprecated = true];
  optional sint32 max_centidegrees = 7 [deprecated = true];

  // The sensors the room measures with, in order: the first is used, each later one
  // takes over while those before it are quiet. Only devices filed in this room.
  //
  // In a home, sensors its residents own come first, in the order they were filed, and then
  // the building's; outside homes a room measures with the building's sensors only. The
  // building's are by default every building temperature sensor filed in the room, in the
  // order it was filed, so a sensor filed later joins at the end without anyone configuring
  // anything; an owner can set their order explicitly (see sensors_configured). Empty: the
  // room has no temperature sensor, and its valves regulate on their own probes
  // (NO_SENSOR).
  repeated kusinta.iot.identity.v1.DeviceId sensor_ids = 8;

  // Whether the building's part of sensor_ids is an order an owner chose, rather than the
  // default of filing order. A building sensor filed into a room with a chosen order is
  // not added to it; a resident's own always is. A sensor that becomes the building's in a
  // room — released by its owner — counts as filed there at that moment.
  bool sensors_configured = 14;

  // The reading steering the room now, in centidegrees, and which sensor it came from.
  // measured_by unset while the valves are on their own probes.
  optional sint32 measured_centidegrees = 9;
  kusinta.iot.identity.v1.DeviceId measured_by = 10;

  RoomClimateCondition condition = 11;

  // Whether the controls on this room's devices are locked. While unlocked, a change made
  // by hand at a device becomes the room's target. Locked, the gateway sets the devices'
  // own lock (Matter Thermostat User Interface Configuration KeypadLockout), so the
  // refusal happens at the device rather than being undone later.
  //
  // Stated as the lock rather than as a permission so that the proto3 default — false,
  // unlocked — is the intended default: a room nobody has configured takes changes at its
  // devices, as a room in an apartment should until its residents decide otherwise; when a
  // home loses its last resident, its rooms' locks are cleared, and so are those set while it
  // stood empty when it gains one (webrtc.v1 household.proto, MOVE-IN). Elsewhere locking is
  // the owner's choice.
  bool lock_device_controls = 12;

  // Set when the recipient reaches this room only as service (see
  // access.v1.MembershipRelation): the room is in someone's home, and what describes the people
  // in it is WITHHELD. Never set for the property owner or a gateway administrator while the
  // home is empty (webrtc.v1 household.proto, EMPTY HOME): they are sent its rooms as rooms
  // outside homes are, and at MOVE-IN sent them again with it set. When it is set,
  // target_centidegrees, target_change, effective_target_centidegrees, overrides_mode,
  // mode_space_id, measured_centidegrees, measured_by, condition, lock_device_controls,
  // inner_limits, outer_limit_clamp, outer_limits_coverage and outer_bound_device_ids are all
  // left unset, and sensor_ids leaves out sensors a resident owns.
  //
  // Unset because withheld, not because unknown: an app must not render them as NO_TARGET or
  // a lost sensor. A withheld room is sent again only when something that IS sent changes,
  // so that the timing of an update does not give away what was withheld. Its outer limits
  // and the sensors service may see are still sent, since setting a room up is service work.
  // Its climate over time is available to service only as an ApartmentClimateSummary.
  //
  // explanations, target_held_until, planning and the comfort band are withheld in the
  // same way.
  bool state_withheld = 15;

  // Why the room is being held where it is, when that differs from simply holding its
  // target: a plan heating ahead of an expensive hour, the heat source busy with hot water,
  // a floor zone held back. Most significant first. An app that shows one shows the first
  // it can show: a kind and subject it knows, a pair that kind lists, and not past its
  // ends_at. Empty: nothing beyond the target and condition needs explaining.
  //
  // A window, a lost sensor and the rest of RoomClimateCondition are told by condition and
  // never repeated here; a target a person set is told by target_change and
  // target_held_until; whether the room is planned for at all is told by planning — one
  // fact, one place.
  //
  // Sent with the room, so a replaced room replaces its list: an explanation absent from
  // the latest RoomClimate no longer holds.
  repeated ClimateExplanation explanations = 16;

  // When a target a person set will next be moved by the gateway on its own — a schedule
  // step, a plan taking over again. Unset: it holds until somebody changes it. Told so that
  // a person is not surprised when their change ends. Unset whenever target_change is
  // withheld from the recipient, for the same reasons: it describes the same change.
  google.protobuf.Timestamp target_held_until = 17;

  // Whether a plan steers the room. See RoomPlanning.
  RoomPlanning planning = 18;

  // The comfort band in force, in centidegrees: the lowest and highest a plan may hold the
  // room at while it heats ahead, coasts or saves on dear energy. Both set or neither, low
  // no higher than high, and within the inner limits where those are set; at the outputs the
  // outer limits bind, a plan holds within them too (OuterRoomLimits, HELD). Absent: no band,
  // and a plan holds the room at its target — never 0 °C.
  optional sint32 comfort_band_low_centidegrees = 19;
  optional sint32 comfort_band_high_centidegrees = 20;

  // The room's outer limits, each bound with who set it and when (OuterRoomLimits). Sent to
  // whoever is sent the room, service included and with state_withheld too: they are the
  // building's, and setting them is service work.
  //
  // Always set by a gateway that keeps outer limits: an empty OuterRoomLimits where the room
  // has none. Unset only from a gateway that predates them, which keeps min and max alone: an
  // app reads unset so, and offers only min and max, through ConfigureRoomClimate.limits,
  // rather than an editor whose away minimum and move-in target that gateway would drop.
  OuterRoomLimits outer_limits = 21;

  // The household's limits (InnerRoomLimits). Sent to the home's residents only, and never with
  // state_withheld. Unset: none, or a room outside homes.
  InnerRoomLimits inner_limits = 22;

  // Set while an outer bound holds the outputs it binds away from where the room would be held
  // without it — the household's target, its inner limits or its mode's setback — so the
  // household is told which bound does it, and from outer_limits the role behind it and since
  // when. Gone once nothing is clamped. Sent as outer_limits_coverage is.
  OuterLimitClamp outer_limit_clamp = 23;

  // How many of the room's heating outputs the outer limits bind, so that an app shows the
  // building's bounds where they apply and not where they do not. In a home, sent to its
  // residents only: to anyone else it would tell whether the room holds a device a resident
  // owns. Outside homes, sent to whoever is sent the room, judged over the outputs of devices
  // the recipient sees, so that a device hidden from them changes nothing they are sent.
  OuterLimitsCoverage outer_limits_coverage = 24;

  // The devices in the room with a heating output the outer limits bind
  // (OuterRoomLimits, WHAT THEY BIND), so that an app marks a device's own limit settings as
  // governed by them only where they are. Sent as outer_limits_coverage is, and judged over the
  // same devices: outside homes, only devices the recipient sees are listed. Empty under
  // coverage NONE or UNSPECIFIED; under ALL, every heating device in the room the recipient
  // sees is in it; under SOME, some are.
  repeated kusinta.iot.identity.v1.DeviceId outer_bound_device_ids = 25;
}

// One bound of a room's outer limits, with who set it and when. Shown to the household as the
// role and the time, never a name: "building administrator, since …".
message OuterLimit {
  sint32 centidegrees = 1;

  // The role its setter acted in (webrtc.v1.ConfigureRoomClimate): ROLE_PROPERTY_OWNER where
  // they hold it, else ROLE_GATEWAY_ADMIN, else ROLE_TECHNICIAN. In a home, a bound an
  // installer set under a commissioning grant has it unset to anyone but the home's residents:
  // staff are shown its value and set_at alone, so the stamp tells them nothing of when the
  // household let an installer in. An app shows an unset role as not stated.
  kusinta.iot.access.v1.Role set_by_role = 2;

  // When the bound was last given a new value. Always sent, also when it dates from before the
  // recipient's residency: it records an act of the building's, and nothing of a household.
  google.protobuf.Timestamp set_at = 3;
}

// A room's outer limits: the building's bounds on the heating it owns, set by the parties
// webrtc.v1.ConfigureRoomClimate names. Every bound is optional: a building where each home
// pays its own heating may set floors only.
//
// WHAT THEY BIND. The asset owner decides whether they can bind a device, and the
// organisation whether to use them. They bind an output only on one of the building's own
// devices (common.v1.DeviceOwnershipType COMPANY) whose asset owner is the organisation, or
// that has none recorded (common.v1.AssetOwner); never a household's asset, nor a device a
// person owns outright. The clamp is applied per output, by its device's owner: in a room with
// a valve the organisation owns and a heater a resident owns, the valve is held within the
// outer limits and the heater at the room's target. So they bind outputs, never the room: the
// room's target and its inner limits are the household's, are not rewritten when an outer bound
// moves, and hold again at those outputs once it moves back out.
//
// HELD. What an output is held at is worked out in this order, each step clamping the one
// before:
//   1. the room's target, or while a mode (ClimateMode) sets the room back its setback;
//   2. the inner limits (InnerRoomLimits): the maximum always, the minimum — the household's
//      everyday floor — only while no mode sets the room back;
//   3. at an output the outer limits bind: [min, max] while no mode sets the room back, and
//      [AWAY FLOOR, max] while one does; during the vacancy setback (webrtc.v1 household.proto,
//      VACANCY), the AWAY FLOOR itself;
//   4. an installer's equipment-safety limits — a floor's surface maximum, a supply cap
//      (commissioning.v1) — which neither tier of comfort limits widens.
// So where an inner bound and an outer bound disagree the outer one wins, and the household's
// range at those outputs is always inside the building's; outputs the outer limits do not bind
// stop at step 2. The AWAY FLOOR is away_min, or min where away_min is unset: kept apart from
// min so that a household going away may set back below its everyday floor but never below what
// the building needs — frost, damp, heat drawn from neighbours. With neither set, a room has no
// away floor, and no vacancy setback.
//
// DEVICE LIMITS. Where the gateway writes a room's outer limits into a device's own setpoint
// limits (Matter Min/MaxHeatSetpointLimit), so that a knob stops at them, it writes them only
// to devices they bind (WHAT THEY BIND), and writes the AWAY FLOOR as the minimum and max as
// the maximum, each only where set: a device holding min as its own minimum would refuse the
// setbacks of step 3. Outside a setback the gateway holds min itself: a change made by hand at
// such a device below min is adopted as the room's target as it was made, within the inner
// limits and never clamped by the outer ones, while the device's output is held at min and min
// is written back to it. Into a device the outer limits do not bind that holds room limits
// written before, it writes the device's defaults back, queued and retried as the wipe's device
// writes are (webrtc.v1 household.proto, WIPE).
//
// They stay with the home: a household handover wipes the inner limits, never these
// (webrtc.v1 household.proto, WIPE).
message OuterRoomLimits {
  // The normal minimum and maximum.
  OuterLimit min = 1;
  OuterLimit max = 2;

  // The floor under a setback; see AWAY FLOOR above.
  OuterLimit away_min = 3;

  // The target the room starts at when an empty home gains a resident (webrtc.v1
  // household.proto, MOVE-IN). A start, never a limit, and a target like any other. Always
  // within [min, max] where those are set (webrtc.v1.ConfigureRoomClimate, "limits_order").
  OuterLimit move_in_target = 4;

  // Set while min was set below the gateway's public-health threshold: the threshold in force
  // then, which min's setter explicitly accepted going below (ConfigureRoomClimate
  // .accept_below_threshold). The acceptance is recorded with min's set_by_role and set_at.
  // Unset while min is unset or was set at or above the threshold. A threshold changed later
  // re-judges nothing already set.
  optional sint32 min_accepted_threshold_centidegrees = 5;
}

// A room's inner limits: the household's own minimum and maximum, set by the home's household
// admins (webrtc.v1.SetInnerRoomLimits). They clamp the room's target, from the app or a knob
// alike, and setting them clamps the target already set. They apply to every output in the
// room, a household's own devices included, as OuterRoomLimits (HELD) orders them. Household
// data: never told to anyone but the home's residents, and wiped at a handover (webrtc.v1
// household.proto, WIPE). They belong to the room while it is in the home: cleared when it
// leaves the home, or the space stops being an apartment, so an empty home's rooms hold none
// and a move-in target meets none.
message InnerRoomLimits {
  optional sint32 min_centidegrees = 1;
  optional sint32 max_centidegrees = 2;
}

// Which bound of a room's outer limits clamps the outputs it binds.
enum OuterLimitKind {
  OUTER_LIMIT_KIND_UNSPECIFIED = 0;
  // Also when min stands in as the AWAY FLOOR for an unset away_min.
  OUTER_LIMIT_KIND_MIN = 1;
  OUTER_LIMIT_KIND_MAX = 2;
  OUTER_LIMIT_KIND_AWAY_MIN = 3;
}

// An outer bound clamping a room (RoomClimate.outer_limit_clamp).
message OuterLimitClamp {
  // Which bound. An app that does not know the value shows that the building's limits clamp the
  // room, without naming one.
  OuterLimitKind limit = 1;

  // Where the room would be held without it, in centidegrees: where outputs the outer limits do
  // not bind are held. effective_target_centidegrees is where those they bind are.
  optional sint32 unclamped_centidegrees = 2;
}

// How many of a room's heating outputs its outer limits bind (OuterRoomLimits, WHAT THEY BIND).
enum OuterLimitsCoverage {
  // Not stated: withheld, or the room has no outer limits.
  OUTER_LIMITS_COVERAGE_UNSPECIFIED = 0;

  // The room has outer limits and they bind none of its heating outputs: it heats only with a
  // household's own devices, or with nothing.
  OUTER_LIMITS_COVERAGE_NONE = 1;

  // Some of its heating outputs and not others.
  OUTER_LIMITS_COVERAGE_SOME = 2;

  // Every heating output in it.
  OUTER_LIMITS_COVERAGE_ALL = 3;
}

// Whether a plan steers a room: one that looks ahead at prices, weather and the heat
// source and moves the room within its comfort band. A standing state of the room, not a
// reason, so it is a field of its own rather than an explanation.
enum RoomPlanning {
  // Not stated.
  ROOM_PLANNING_UNSPECIFIED = 0;

  // A plan steers the room. Its explanations say what it is doing.
  ROOM_PLANNING_PLANNED = 1;

  // No plan steers the room: planning is switched off for it, or was never set up. The
  // room follows its target and schedule.
  ROOM_PLANNING_NOT_PLANNED = 2;

  // A plan would steer the room but cannot be made — prices or a forecast are missing —
  // so the room follows its target and schedule until one can.
  ROOM_PLANNING_UNAVAILABLE = 3;
}

// What held a room, or a part of its heating, where it is. A closed list of causes: the
// gateway sends a kind, never a sentence, and the app names each kind in its user's
// language. What the cause acts on is ClimateExplanation.subject, and each kind lists the
// subjects it may carry. A pair a kind does not list is shown as nothing, so a pair added
// later reaches an older app as nothing rather than as a guess.
//
// No kind identifies another household or anything about one, its activity included.
// Where a limit is shared — a building's power, a shared heat source — the explanation
// says that this room was limited, never by whom or because of whom. A kind that a source
// or limit shared with other homes drives — HOT_WATER_PRIORITY on a shared heat source,
// SHARED_POWER_BUDGET, DISTRICT_HEATING_PEAK on a shared connection — is sent only where at
// least three homes share that source or limit, in rooms in homes and outside them alike.
// Below that, its onset and end would track another home's use as it happens, and the
// room carries no explanation for it.
enum ClimateExplanationKind {
  // Sender did not set a kind, or sent one this client's schema does not know. An app
  // shows nothing for it rather than guessing.
  CLIMATE_EXPLANATION_KIND_UNSPECIFIED = 0;

  // Heated ahead of a dearer or colder period, within the comfort band, so less is needed
  // then. Subjects: ROOM, FLOOR_ZONE.
  CLIMATE_EXPLANATION_KIND_PRE_HEAT = 1;

  // Held back while stored heat carries the room, within the comfort band. Subjects: ROOM,
  // FLOOR_ZONE.
  CLIMATE_EXPLANATION_KIND_COASTING = 2;

  // Held back while energy is expensive, within the comfort band. Subjects: ROOM,
  // FLOOR_ZONE, COMFORT_LOAD, ADD_ON_HEATER.
  CLIMATE_EXPLANATION_KIND_PRICE_HIGH = 3;

  // Held back to keep the home's own electricity use below a peak it is charged for.
  // Subjects: ROOM, FLOOR_ZONE, COMFORT_LOAD, ADD_ON_HEATER.
  CLIMATE_EXPLANATION_KIND_PEAK_GUARD = 4;

  // Paused while the heat source heats domestic hot water. Subjects: ROOM, FLOOR_ZONE.
  CLIMATE_EXPLANATION_KIND_HOT_WATER_PRIORITY = 5;

  // Held back to keep electricity that several homes share — a building's connection, a
  // shared heat source — within its limit. Subjects: ROOM, FLOOR_ZONE, COMFORT_LOAD,
  // ADD_ON_HEATER.
  CLIMATE_EXPLANATION_KIND_SHARED_POWER_BUDGET = 6;

  // Held back to keep a district-heating connection below its charged peak. Subjects:
  // ROOM, FLOOR_ZONE.
  CLIMATE_EXPLANATION_KIND_DISTRICT_HEATING_PEAK = 7;

  // Not heated further because the room is at the top of its comfort band, even though
  // energy is cheap. Subjects: ROOM, FLOOR_ZONE.
  CLIMATE_EXPLANATION_KIND_AT_COMFORT_CEILING = 8;

  // Run on a cautious fixed share of the time because the reading that steers it has gone
  // quiet. Subjects: FLOOR_ZONE only — a room's own lost sensor is told by condition. In
  // the room whose sensor steers the zone, condition says the sensor is lost and this says
  // what the zone does about it.
  CLIMATE_EXPLANATION_KIND_NO_READING = 9;

  // Off because it is outside its time window — a heated floor kept warm for comfort, a
  // towel heater. Subjects: COMFORT_LOAD only.
  CLIMATE_EXPLANATION_KIND_OUTSIDE_WINDOW = 10;
}

// What a cause acts on.
enum ClimateExplanationSubject {
  // Sender did not set a subject, or sent one this client's schema does not know — some
  // decoders read an unknown value as this one. Never the room as a whole.
  CLIMATE_EXPLANATION_SUBJECT_UNSPECIFIED = 0;

  // The room's heating as a whole.
  CLIMATE_EXPLANATION_SUBJECT_ROOM = 1;

  // A floor zone heating this room. A zone's explanation is sent only in rooms on the same
  // side of a home's boundary as the zone's control room: rooms in the same home as it, or
  // rooms outside homes when it is outside one. A zone that heats rooms on both sides
  // explains itself on its control room's side alone, so a fact withheld across that
  // boundary does not cross it here.
  CLIMATE_EXPLANATION_SUBJECT_FLOOR_ZONE = 2;

  // A comfort load in the room: a heated floor kept warm for comfort, a towel heater.
  CLIMATE_EXPLANATION_SUBJECT_COMFORT_LOAD = 3;

  // The heat source's add-on heater.
  CLIMATE_EXPLANATION_SUBJECT_ADD_ON_HEATER = 4;
}

// One reason a room, or a part of its heating, is where it is.
message ClimateExplanation {
  ClimateExplanationKind kind = 1;

  // What the cause acts on. The gateway always sets it. An app shows nothing for an
  // explanation whose subject is unspecified or unknown to it, rather than presenting it
  // as the room's.
  ClimateExplanationSubject subject = 2;

  // When the explanation stops holding. Unset: while the room's latest RoomClimate carries
  // it. An app MUST NOT show an explanation past its ends_at, also while it cannot reach
  // the gateway, and while it cannot reach the gateway it shows none without an ends_at:
  // an explanation that outlives its window is a claim about the room nobody is making any
  // more. An explanation that holds because of a leased write ends no later than that
  // lease, after which the output is back at its lapse value whatever the gateway does.
  google.protobuf.Timestamp ends_at = 3;
}

// A setback that applies to every room in a space while it is on.
enum ClimateModeKind {
  // No mode: every room at its own target.
  CLIMATE_MODE_KIND_UNSPECIFIED = 0;

  // Every room to the setback until the mode is switched off.
  CLIMATE_MODE_KIND_AWAY = 1;

  // Every room to the setback between starts_at and ends_at, then back to normal on its
  // own — timed so the rooms are warm again at ends_at, not starting to heat then.
  CLIMATE_MODE_KIND_HOLIDAY = 2;
}

// A mode on a home ends when whoever switched it on stops being one of its residents: a new
// tenant does not inherit the previous one's holiday. A mode on a room ends when the room
// joins a home, whose rooms follow the apartment's mode alone. Any other mode — one switched on by
// someone who is not one of its residents now: who never lived there, or a member still
// recorded with no relation — ends when the
// home gains a resident: when anyone other than its setter, not already its resident, is
// assigned RESIDENT on the apartment, a member recorded with no relation included, or the
// space becomes an apartment with RESIDENT members on it other than its setter. A mode's
// setter recorded with no relation being assigned RESIDENT ends none of their own modes;
// being assigned SERVICE or removed ends them.
//
// A mode set on an apartment — or, for rooms that are not in one, on their floor or
// common area. While it is on it sets back every room below that space, except that a
// room inside an apartment follows only its apartment's mode: a mode on a floor does not
// reach into the flats on it. Where more than one mode could apply, the nearest enclosing
// space's wins. A room somebody changes during the mode keeps its own target
// (RoomClimate.overrides_mode) until the mode ends.
message ClimateMode {
  kusinta.iot.identity.v1.SpaceId space_id = 1;
  ClimateModeKind kind = 2;

  // The temperature every room is set back to, in centidegrees. Required while a mode is
  // on — a mode with nothing to set back to is refused, not defaulted. Clamped in each room as
  // OuterRoomLimits (HELD) orders, the away floor being what the building needs.
  optional sint32 setback_centidegrees = 3;

  // HOLIDAY: when the setback begins and when the rooms are to be back at their own
  // targets — warm by then, not starting to heat (see warm_from). AWAY: starts_at is when it
  // was switched on; ends_at is unset. starts_at is unset when it dates from before the
  // recipient's current residency in the home, or from a home they did not live in at the
  // time, save to the property owner and the gateway administrators for a mode on a home while
  // it is empty (webrtc.v1 household.proto, EMPTY HOME); an ends_at ahead is always sent.
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;

  // Who switched it on. Unset when it is withheld from the recipient: from service in a
  // home, and from anyone when it dates from before their current residency in the home, or
  // from a home they did not live in at the time (see access.v1.MembershipRelation). The
  // property owner and the gateway administrators are given it for a mode on a home while it is
  // empty, which only they can have switched on (webrtc.v1 household.proto, EMPTY HOME).
  kusinta.iot.identity.v1.UserId set_by = 6;

  // Read-only: filled by the gateway, ignored if sent to it. The moment the setback ends
  // ahead of ends_at, so that the rooms are warm by ends_at. Absent when there is no
  // lead — an AWAY mode, or one the gateway has not computed.
  optional google.protobuf.Timestamp warm_from = 7;
}

// Every room climate and mode a caller may see, in reply to a listing.
message RoomClimateList {
  repeated RoomClimate rooms = 1;
  repeated ClimateMode modes = 2;
}

// The length of the buckets a room's history is given in. Buckets are fixed and aligned to
// UTC, whatever the building's time zone.
enum RoomHistoryResolution {
  // In a request: the gateway chooses (webrtc.v1.GetRoomHistory). In an answer: quarter hours,
  // from a gateway that predates this field.
  //
  // Rollout note: an app that predates this field asks with it unset and reads every sample as
  // a quarter hour and every answer as whole. A gateway may therefore give hours, or cap an
  // answer, only to apps that read RoomHistory.resolution and its covered range: app handling
  // ships before or with the gateway that does.
  ROOM_HISTORY_RESOLUTION_UNSPECIFIED = 0;

  // 15-minute buckets (:00, :15, :30, :45).
  ROOM_HISTORY_RESOLUTION_QUARTER_HOUR = 1;

  // Hour buckets, each made of its four quarter hours as RoomHistorySample says. An hour is
  // given only where all of it lies within what the recipient may read (RoomHistory): one
  // that straddles the start of their residency, or the room joining their home, is left out,
  // never trimmed or averaged again from its readable part.
  ROOM_HISTORY_RESOLUTION_HOUR = 2;
}

// One bucket of a room's history, of the length RoomHistory.resolution names. Every reading
// is optional: absent means nothing was known for that bucket, never zero.
//
// An hour is made of its quarter hours, each reading as stated beside it. A reading none of
// the hour's quarter hours knew is absent in the hour too; a mean is taken over the quarter
// hours that knew one, and a sum likewise, so an hour partly unknown sums only what was known.
message RoomHistorySample {
  // The start of the bucket.
  google.protobuf.Timestamp at = 1;

  // The mean of the room's measured temperature over the bucket, in centidegrees. An hour:
  // the mean of its quarter hours' means.
  optional sint32 measured_centidegrees = 2;

  // RoomClimate.target_centidegrees and .effective_target_centidegrees as they were in
  // force at the bucket's start, in centidegrees. An hour: its first quarter hour's, and so
  // absent when that quarter hour did not know them, whatever the later ones knew.
  optional sint32 target_centidegrees = 3;
  optional sint32 effective_target_centidegrees = 4;

  // The mean opening over the bucket across the room's valves that report one, in
  // thousandths of fully open. Absent if none of them does. An hour: the mean of its quarter
  // hours' means.
  optional uint32 valve_open_permille = 5;

  // The seconds within the bucket during which any of the room's valves was open. An hour:
  // the sum of its quarter hours', so up to 3600.
  optional uint32 valve_open_seconds = 6;

  // The seconds within the bucket during which any floor zone heating the room was heating
  // (heating.v1.FloorZone), counted from the contact state the zone's output reports, read
  // through its closed_value, not from what was commanded. Kept apart from the valve
  // fields: a zone's duty and a valve's opening are different controls with different time
  // scales. Absent where no floor zone heats the room. An hour: the sum of its quarter
  // hours', as valve_open_seconds.
  optional uint32 floor_heating_seconds = 7;
}

// A room's history at one resolution, in reply to GetRoomHistory.
//
// A bucket is given only once the gateway has made it, never before it ends, and only where
// all of it lies within what the recipient may read. The covered range is over bucket starts,
// as the request's range is: a bucket is within it when covered_from <= at < covered_to. A
// bucket within it that is not among the samples is one for which nothing is known; of any
// other bucket this answer says nothing, and an app MUST NOT show it as empty on its account.
message RoomHistory {
  kusinta.iot.identity.v1.SpaceId room_id = 1;

  // The start of the earliest bucket the gateway still holds for this room at this resolution
  // that the recipient may read. The request's from_time and to_time are clamped to
  // [kept_from, now], so nothing before kept_from is ever returned. For a room in the
  // recipient's own home it is no earlier than the start of their current residency, nor than
  // when the room last joined their home; for any other room, no earlier than when it last
  // left a home. How far back the room's history reaches for the recipient, whether or not
  // this answer reaches that far. Always set: where nothing is held for the recipient at this
  // resolution, it is no earlier than covered_to.
  google.protobuf.Timestamp kept_from = 2;

  // The buckets within [covered_from, covered_to), in order of `at`.
  repeated RoomHistorySample samples = 3;

  // The length of the samples' buckets. An app labels and plots them by this, never by the
  // resolution it asked for.
  RoomHistoryResolution resolution = 4;

  // The range this answer covers, [covered_from, covered_to). Both unset only in an answer
  // from a gateway that predates them, which caps nothing: it covers the range asked, clamped.
  //
  // covered_to is the request's to_time as clamped, but never later than the start of the
  // oldest bucket at this resolution the gateway has still to make — for an hour, possibly
  // days after it ends — so no bucket within the range is made later. The time after it may be
  // held at a finer resolution, and an app asks for it there.
  //
  // covered_from is the request's from_time as clamped, unless more than 768 samples fall
  // between it and covered_to: then the answer is capped, keeping the newest 768, and
  // covered_from is samples[0].at. Either way it is never later than covered_to, and an answer
  // that covers nothing has the two equal.
  //
  // An answer is capped exactly when covered_from is later than kept_from and than the
  // from_time asked for, if one was. The app asks for the next page with the same from_time,
  // this answer's resolution, and to_time = covered_from, until an answer is not capped.
  google.protobuf.Timestamp covered_from = 5;
  google.protobuf.Timestamp covered_to = 6;
}

// The length of the periods an ApartmentClimateSummary is given in. Each period runs from
// the start of one local date to the start of another in the building's time zone
// (space.v1.Space.time_zone) — midnight, or the first moment of the date where daylight
// saving skips midnight — so a day is 23 or 25 hours long across a change of daylight
// saving time. A period is cut by the time zone in force when it opened, and kept as cut.
// After a change of zone, the next period runs from that cut to the first boundary of its
// length in the new zone — a midnight, a Monday or a first of the month — that leaves it
// covering at least one whole day, week or month of the new zone's calendar, so no period
// covers less than one whole day, week or month of its calendar, however many hours that
// is. While the zone is unknown — never set, or cleared — nothing is summarised, and the
// period open when it was cleared ends unsummarised; once it is known again, the first
// period begins at the first boundary of its length after that.
enum ClimateSummaryPeriod {
  CLIMATE_SUMMARY_PERIOD_UNSPECIFIED = 0;

  CLIMATE_SUMMARY_PERIOD_DAY = 1;

  // ISO weeks, Monday to Monday.
  CLIMATE_SUMMARY_PERIOD_WEEK = 2;

  // Calendar months.
  CLIMATE_SUMMARY_PERIOD_MONTH = 3;
}

// How an apartment's mean is formed from its rooms' means.
enum ClimateSummaryWeighting {
  CLIMATE_SUMMARY_WEIGHTING_UNSPECIFIED = 0;

  // Each room counts once, whatever its size: a bathroom weighs as much as a living room.
  CLIMATE_SUMMARY_WEIGHTING_ROOMS_EQUAL = 1;
}

// An apartment's climate over one period.
//
// Each room's mean is taken over the quarter hours of the period in which it was in this
// apartment and had a value; coverage likewise counts only the quarter hours it was here,
// and the apartment's mean is formed from the rooms' means as the summary's weighting says.
// Every mean is optional: absent means nothing was known, never zero.
message ClimatePeriodMean {
  // The period, half-open: starts_at <= t < ends_at.
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;

  // The mean measured temperature, in centidegrees, taken from the building's own sensors
  // only: in each room, the first of its building sensors that was heard. A reading from a
  // sensor a resident owns never enters it.
  optional sint32 measured_centidegrees = 3;

  // The mean target, in centidegrees: RoomClimate.target_centidegrees — the temperature
  // somebody asked for, not the effective target a mode set it back to, so that a
  // setback is not reported as what the residents chose. The measured mean still falls
  // while a home is set back; how much that reveals is governed by how long a period
  // service may ask for (webrtc.v1.PrivacyDisclosure.climate_summary_period).
  optional sint32 target_centidegrees = 4;

  // How much of the period the means rest on, in thousandths: the quarter hours with a
  // value, summed over the apartment's rooms, divided by the quarter hours each room was in
  // the apartment during the period, summed likewise. A room with no sensor, or one that
  // went quiet, lowers it — a mean with low coverage describes part of the apartment, or
  // part of the period.
  uint32 measured_coverage_permille = 5;
  uint32 target_coverage_permille = 6;

  // The rooms that contributed a measured value, of the rooms the apartment had at any time
  // in the period.
  uint32 rooms_measured = 7;
  uint32 rooms = 8;
}

// An apartment's climate as means over whole periods, in reply to
// webrtc.v1.GetApartmentClimateSummary. What a party who does not live there may know of
// how warm it is kept — see webrtc.v1.PrivacyDisclosure.
//
// Only CLOSED periods are given. The period running now is never included, so that a
// summary cannot be polled into a live reading.
message ApartmentClimateSummary {
  kusinta.iot.identity.v1.SpaceId apartment_id = 1;
  ClimateSummaryPeriod period = 2;
  ClimateSummaryWeighting weighting = 3;

  // The start of the earliest period the gateway still holds that the recipient may be
  // given: for a resident of this apartment, no earlier than their current residency; for
  // anyone else, of the length disclosed now, and no earlier than the first such period
  // after it was last changed (see webrtc.v1.PrivacyDisclosure.climate_summary_period).
  google.protobuf.Timestamp kept_from = 4;

  // The periods within the requested range, in order of starts_at.
  repeated ClimatePeriodMean periods = 5;
}
