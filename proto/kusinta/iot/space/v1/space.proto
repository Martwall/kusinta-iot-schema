syntax = "proto3";

package kusinta.iot.space.v1;

import "google/protobuf/timestamp.proto";
import "kusinta/iot/access/v1/roles.proto";
import "kusinta/iot/common/v1/types.proto";
import "kusinta/iot/identity/v1/identity.proto";

option optimize_for = SPEED;

message Space {
  kusinta.iot.identity.v1.SpaceId space_id = 1;
  kusinta.iot.common.v1.SpaceType space_type = 2;

  // On an apartment, the building's fixed, readable identifier for it — its number, say "Lgh
  // 1102" — given by the property owner or the gateway's administrators when it is created and
  // changed only by them (webrtc.v1.CreateSpace, webrtc.v1.UpdateSpace); never a generated id,
  // and never touched by a household's handover. The household's own name for the home is
  // home_name.
  string name = 3;
  string description = 4;
  int32 floor = 5; // meaningful for FLOOR type
  kusinta.iot.identity.v1.SpaceId parent_space_id = 6; // null for top-level Building
  // Filtered to the spaces the caller reaches, as device_ids is.
  repeated kusinta.iot.identity.v1.SpaceId sub_space_ids = 7;
  // Filtered to the devices the caller may see (see webrtc.v1.SpaceTree): for service, no
  // device a resident owns.
  repeated kusinta.iot.identity.v1.DeviceId device_ids = 8;
  // Superseded by members, which can say that more than one person lives in an apartment,
  // and how each member stands to the space. A gateway leaves it unset, so a client that
  // still reads it sees no resident anywhere; read members instead.
  kusinta.iot.identity.v1.UserId resident_user_id = 9 [deprecated = true];
  kusinta.iot.identity.v1.TenantId tenant_id = 10;
  kusinta.iot.identity.v1.GatewayId gateway_id = 11;

  // An IANA time zone name, e.g. "Europe/Stockholm". Written on the building — the
  // top-level space. When listing, a gateway fills it on every space with the effective
  // value, inherited from the nearest ancestor that has one, so every listed space
  // carries it. Empty means unknown, not UTC.
  string time_zone = 12;

  // Who is filed directly on this space, and how each stands to it. Members of a space
  // above it are listed there, not here.
  //
  // Filled according to who asks, since a membership list says who lives where:
  //
  //   * a caller holding ROLE_PROPERTY_OWNER or ROLE_GATEWAY_ADMIN who reaches the space
  //     sees every member save as below, in a home they see as service too, as the
  //     members change;
  //   * a resident of an apartment sees every member filed on it or on its rooms — who they
  //     live with, and anyone filed on their home as service, since being filed on a home
  //     is an act on it its residents should see. Service reach from a building or floor
  //     above is not listed; webrtc.v1.PrivacyDisclosure tells them what kinds of party
  //     hold it, and who, without saying where anyone lives;
  //   * anyone else sees none, residents of a building or floor included.
  //
  // To a caller who does not live in the home, a RESIDENT member is listed under the
  // residency's id (access.v1.MembershipRelation, RESIDENCY IDS) and never by name, so that
  // a home's residents are told apart from one another and from anyone's other memberships
  // without saying who they are. The people of the home see one another under their user
  // ids.
  repeated SpaceMember members = 13;

  // Set when members are not listed to this caller, so that an empty list is not read as
  // nobody being filed here.
  bool members_withheld = 14;

  // On an apartment, the name its household gave the home (webrtc.v1.SetHomeName), which may
  // name them ("The Svenssons"). Given to the home's residents only: empty for anyone else,
  // so a client shows it to residents alone and the apartment's name to everyone. Wiped at
  // the home's handover. Empty on every other space.
  string home_name = 15;
}

// One membership of a space.
message SpaceMember {
  // The member's user id, or for a RESIDENT member listed to a caller who does not live in
  // the home, the residency's id (Space.members).
  kusinta.iot.identity.v1.UserId user_id = 1;
  kusinta.iot.access.v1.MembershipRelation relation = 2;

  // The name the member gave, self-chosen and not verified, so the app shows it as the name
  // they gave rather than as an identity. Given to a caller who is a resident of the
  // apartment the member is filed on, or on one of its rooms: the people they live with,
  // and anyone filed on their home as service, whom webrtc.v1.PrivacyDisclosure already
  // names to them. Given also, for a member who is staff (access.v1.Role, STAFF), to a
  // caller holding ROLE_PROPERTY_OWNER or ROLE_GATEWAY_ADMIN, as webrtc.v1.MemberDetail.name
  // names them. Empty for every other caller — service, residents of any other home, and a
  // property owner or an administrator for a member who is not staff — and for a member
  // whose name the gateway has not learnt. A caller given names reads an empty one as not
  // known; anyone else is given none. Residents are named only to their own home.
  string name = 3;

  // As webrtc.v1.MemberSpace.since: the start of the day, in the building's time zone, on
  // which this membership began; for a resident, the current unbroken residency. Never finer
  // than a day. Unset where the gateway holds no record of it.
  google.protobuf.Timestamp since = 4;
}
