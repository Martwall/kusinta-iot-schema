syntax = "proto3";
package kusinta.iot.signaling.v1;

import "kusinta/iot/identity/v1/identity.proto";

option optimize_for = SPEED;

message SdpOffer {
  string sdp = 1;
}
message SdpAnswer {
  string sdp = 1;
}

// candidate is the SDP candidate attribute line. sdp_mid / sdp_mline_index
// bind it to a media section: WebRTC's addIceCandidate requires a non-null
// sdpMid (some native WebRTC bindings crash on a null). Under BUNDLE both are
// constant ("0" / 0) for a single-m-line session, but they must be carried so
// candidates stay correct once additional m-lines (e.g. camera video) exist.
message IceCandidate {
  string candidate = 1;
  string sdp_mid = 2;
  int32 sdp_mline_index = 3;
}

// Empty keepalive. The gateway sends this periodically on the GatewayConnect
// stream so the otherwise-idle bidi request keeps producing DATA frames, which
// resets the inactivity timers on any proxy between the two ends and stops it
// from tearing the stream down. Carries no routing target and is dropped on receipt.
message HeartBeat {}

// JWT for user auth is sent in the Authorization: Bearer metadata header, not here.
// First message carries only the target gateway for stream-specific routing.
message UserHandshake {
  kusinta.iot.identity.v1.GatewayId target_gateway_id = 1;
}
message UserHandshakeAck {
  bool accepted = 1;
  string reason = 2;
}

// Identifies one of a user's concurrent signaling sessions. Addressing by user
// alone would allow a user only one live session, because two streams opened
// with the same authenticated `sub` would be indistinguishable and an SdpAnswer
// could not be routed back to the stream whose offer it answers. A user running
// a phone and a desktop client at once is an ordinary setup, so the id appears
// on every message of both legs; fewer than all four and the return path stays
// ambiguous.
//
// Contract for the value:
//   - Opaque. Nothing above the relay parses it. A UUIDv4 is the expected form.
//   - Client-minted. A server-assigned id would force a lookup round trip before
//     a client could reattach after a stream drop.
//   - Stable across reconnects. This is what makes a reconnect a reconnect
//     rather than a new session: a client that reconnects with the same value is
//     resuming, and one that mints a fresh value is starting over.
//   - NOT a credential, and never authenticated. Identity remains the `sub` on
//     the stream — the Bearer token on the app leg, the client certificate on
//     the gateway leg. The id is scoped within that user, so a forged value can
//     only collide with the forger's own sessions. Never derive identity,
//     entitlement or trust from it.
//   - Required. An empty value is not a legacy "single session" — it makes two
//     clients indistinguishable again on exactly the path this field exists to
//     fix. An endpoint should refuse a message that omits it.

// Messages sent by the building-server gateway (GatewaySignalingService.GatewayConnect stream).
// Auth: x-client-cert-fingerprint metadata header, set from the client
// certificate by the mTLS-terminating proxy in front of this service.
message GatewayConnectRequest {
  kusinta.iot.identity.v1.UserId target_user_id = 1;
  // The session of target_user_id this message answers. See the contract above.
  // Ignored on a heartbeat, which carries no routing target at all.
  string session_id = 5;
  oneof payload {
    SdpAnswer answer = 2;
    IceCandidate ice_candidate = 3;
    HeartBeat heartbeat = 4;
  }
}

// Messages sent by the api-server to the building-server gateway.
message GatewayConnectResponse {
  kusinta.iot.identity.v1.UserId from_user_id = 1;
  // The session of from_user_id this message originates from — the value the
  // gateway must echo on the GatewayConnectRequest that answers it. See the
  // contract above.
  string session_id = 4;
  oneof payload {
    SdpOffer offer = 2;
    IceCandidate ice_candidate = 3;
  }
}

// Messages sent by the app (GatewaySignalingService.UserConnect stream).
// Auth: Authorization: Bearer <jwt> in gRPC request metadata (validated by interceptor).
message UserConnectRequest {
  // This client's session, minted by the client. See the contract above. Sent on
  // every message including the handshake, so the relay can key the stream on it
  // from the first frame.
  string session_id = 4;
  oneof payload {
    UserHandshake handshake = 1;
    SdpOffer offer = 2;
    IceCandidate ice_candidate = 3;
  }
}

// Messages sent by the api-server to the app.
message UserConnectResponse {
  // Echoes the session_id of the stream this message is delivered on, so a
  // client can assert the relay routed to the session it thinks it is. See the
  // contract above.
  string session_id = 4;
  oneof payload {
    UserHandshakeAck handshake_ack = 1;
    SdpAnswer answer = 2;
    IceCandidate ice_candidate = 3;
  }
}
