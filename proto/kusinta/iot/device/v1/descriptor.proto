syntax = "proto3";

package kusinta.iot.device.v1;

import "google/protobuf/timestamp.proto";
import "kusinta/iot/common/v1/types.proto";
import "kusinta/iot/identity/v1/identity.proto";
import "kusinta/iot/vendor/homematic/v1/homematic.proto";

option optimize_for = SPEED;

// DeviceDescriptor holds identity and Matter BasicInformation cluster fields — what the
// device IS, not what it reports. The device types it presents are one per endpoint, in
// Device.endpoints.
//
// Field bands: 1-2 identity, 3-10 Matter BasicInformation, 11-12 placement,
// 13-16 ownership and lifecycle, 18-19 vendor identity and bridging.
// 2 and 17 are burned; the next free number is 20.
message DeviceDescriptor {
  kusinta.iot.identity.v1.DeviceId device_id = 1;

  // Held the device's single Matter device type, then its primary one — the device type
  // of its lowest-numbered endpoint. Removed rather than kept: it was derived from
  // Device.endpoints and guarded only by a rule saying producers must keep the two in
  // step, so an icon could disagree with the readings under it and nothing would notice.
  // Read Endpoint.matter_device_type_id; the primary type is the lowest-numbered
  // endpoint's, computed where it is needed.
  reserved 2;
  reserved "matter_device_type_id";

  // Matter BasicInformation cluster attributes
  string vendor_name = 3;
  string product_name = 4;
  string serial_number = 5;
  string node_label = 6;
  uint32 vendor_id = 7;
  uint32 product_id = 8;
  string hardware_version_string = 9;
  string software_version_string = 10;

  kusinta.iot.identity.v1.ConnectorId connector_id = 11;
  kusinta.iot.identity.v1.SpaceId space_id = 12;

  kusinta.iot.common.v1.DeviceOwnershipType ownership = 13;
  kusinta.iot.common.v1.DeviceLifecycleState lifecycle = 14;

  // Populated when ownership == RESIDENT
  kusinta.iot.identity.v1.UserId owner_user_id = 15;
  google.protobuf.Timestamp claimed_at = 16;

  // Held a parallel endpoint list, joined to Device.endpoints by endpoint_id. Removed:
  // Device now travels on both legs, so there is one list and nothing to keep in step.
  reserved 17;
  reserved "endpoints";

  // Who the device is in its vendor's own terms — an address and a model string that
  // identify the PHYSICAL device, not one of its endpoints. It belongs here rather than
  // beside the per-endpoint vendor readings, which would duplicate it onto every
  // endpoint with no rule saying whether a producer should.
  //
  // Absent for a device with no vendor extension, which is most of them.
  // Set when this device sits behind a Matter bridge, naming the bridge's own Device.
  //
  // A bridge is one Matter node exposing many devices, and each gets its own DeviceId here
  // rather than becoming an endpoint of the bridge: a user perceives twelve bridged bulbs
  // as twelve things, and one row that cannot be placed in twelve rooms is not usable.
  //
  // So a Device is a Matter node OR one device behind one — the equivalence is deliberately
  // not exact, and this field is how a consumer tells which. Absent means the device is
  // reached directly.
  optional kusinta.iot.identity.v1.DeviceId bridged_by = 19;

  oneof vendor_identity {
    kusinta.iot.vendor.homematic.v1.HomematicDeviceIdentity homematic = 18;
  }
}
