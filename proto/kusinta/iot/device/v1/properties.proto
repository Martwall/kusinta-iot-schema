syntax = "proto3";

package kusinta.iot.device.v1;

import "kusinta/iot/device/v1/matter_options.proto";

option optimize_for = SPEED;

// Temperatures use sint32 in centidegrees (°C × 100), matching Matter's int16 × 0.01°C encoding.
// Fields 1-99 are commonly-used attributes; 100+ are optional/rarely-used.
//
// Every field carries (matter_cluster_id) and (matter_attribute); every non-vendor
// message carries (matter_device_type). Those options are the mapping — resolve a
// PropertyUpdate or a device type from them, never from the field name. Field names
// follow Matter's attribute names loosely and in a few places not at all
// (pir_occupied_to_unoccupied_delay's acronym, covering_type for the bare "Type"),
// so no string transformation of a field name is a correct substitute.
// See property_update.proto for the normative resolution rule.
//
// A message's clusters are listed in its comment for orientation only; the per-field
// (matter_cluster_id) is authoritative, and several messages span more than one cluster.

// Matter Thermostat cluster (0x0201)
message ThermostatProperties {
  option (matter_device_type) = 0x0301; // Thermostat

  sint32 local_temperature = 1 [(matter_cluster_id) = 0x0201, (matter_attribute) = "LocalTemperature"];
  sint32 occupied_heating_setpoint = 2 [(matter_cluster_id) = 0x0201, (matter_attribute) = "OccupiedHeatingSetpoint"];
  sint32 occupied_cooling_setpoint = 3 [(matter_cluster_id) = 0x0201, (matter_attribute) = "OccupiedCoolingSetpoint"];
  // Property-owner constraint
  sint32 min_heat_setpoint_limit = 4 [(matter_cluster_id) = 0x0201, (matter_attribute) = "MinHeatSetpointLimit"];
  // Property-owner constraint
  sint32 max_heat_setpoint_limit = 5 [(matter_cluster_id) = 0x0201, (matter_attribute) = "MaxHeatSetpointLimit"];
  sint32 min_cool_setpoint_limit = 6 [(matter_cluster_id) = 0x0201, (matter_attribute) = "MinCoolSetpointLimit"];
  sint32 max_cool_setpoint_limit = 7 [(matter_cluster_id) = 0x0201, (matter_attribute) = "MaxCoolSetpointLimit"];
  uint32 control_sequence_of_operation = 8 [(matter_cluster_id) = 0x0201, (matter_attribute) = "ControlSequenceOfOperation"];
  // SystemMode: Off=0,Auto=1,Cool=3,Heat=4,EmHeat=5
  uint32 system_mode = 9 [(matter_cluster_id) = 0x0201, (matter_attribute) = "SystemMode"];
  uint32 thermostat_running_mode = 10 [(matter_cluster_id) = 0x0201, (matter_attribute) = "ThermostatRunningMode"];
}

// Matter Temperature Measurement cluster (0x0402)
message TemperatureSensorProperties {
  option (matter_device_type) = 0x0302; // Temperature Sensor

  sint32 measured_value = 1 [(matter_cluster_id) = 0x0402, (matter_attribute) = "MeasuredValue"];
  sint32 min_measured_value = 2 [(matter_cluster_id) = 0x0402, (matter_attribute) = "MinMeasuredValue"];
  sint32 max_measured_value = 3 [(matter_cluster_id) = 0x0402, (matter_attribute) = "MaxMeasuredValue"];
  uint32 tolerance = 4 [(matter_cluster_id) = 0x0402, (matter_attribute) = "Tolerance"];
}

// Matter Relative Humidity Measurement cluster (0x0405)
message HumiditySensorProperties {
  option (matter_device_type) = 0x0307; // Humidity Sensor

  // % × 100, 0–10000
  uint32 measured_value = 1 [(matter_cluster_id) = 0x0405, (matter_attribute) = "MeasuredValue"];
  uint32 min_measured_value = 2 [(matter_cluster_id) = 0x0405, (matter_attribute) = "MinMeasuredValue"];
  uint32 max_measured_value = 3 [(matter_cluster_id) = 0x0405, (matter_attribute) = "MaxMeasuredValue"];
  uint32 tolerance = 4 [(matter_cluster_id) = 0x0405, (matter_attribute) = "Tolerance"];
}

// Matter Occupancy Sensing cluster (0x0406)
message OccupancySensorProperties {
  option (matter_device_type) = 0x0107; // Occupancy Sensor

  // Renamed to match the Matter attribute names now carried in (matter_attribute).
  reserved "pir_occ_to_unocc_delay", "pir_unocc_to_occ_delay";

  // Occupancy bitmask: bit 0 = occupied
  uint32 occupancy = 1 [(matter_cluster_id) = 0x0406, (matter_attribute) = "Occupancy"];
  // OccupancySensorType: PIR=0,Ultrasonic=1,PIRandUS=2,PhysicalContact=3
  uint32 occupancy_sensor_type = 2 [(matter_cluster_id) = 0x0406, (matter_attribute) = "OccupancySensorType"];
  uint32 occupancy_sensor_type_bitmap = 3 [(matter_cluster_id) = 0x0406, (matter_attribute) = "OccupancySensorTypeBitmap"];
  uint32 pir_occupied_to_unoccupied_delay = 4 [(matter_cluster_id) = 0x0406, (matter_attribute) = "PIROccupiedToUnoccupiedDelay"];
  uint32 pir_unoccupied_to_occupied_delay = 5 [(matter_cluster_id) = 0x0406, (matter_attribute) = "PIRUnoccupiedToOccupiedDelay"];
}

// Matter Boolean State cluster (0x0045)
message ContactSensorProperties {
  option (matter_device_type) = 0x0015; // Contact Sensor

  // StateValue: false = contact open (alarm), true = contact closed (normal)
  bool state_value = 1 [(matter_cluster_id) = 0x0045, (matter_attribute) = "StateValue"];
}

// Matter Window Covering cluster (0x0102)
message WindowCoveringProperties {
  option (matter_device_type) = 0x0202; // Window Covering

  // The Matter attribute is the bare "Type"; the field keeps a qualified name because
  // `type` is a poor field name and keyword-adjacent in several target languages. The
  // mapping is in (matter_attribute), so the divergence costs consumers nothing.
  uint32 covering_type = 1 [(matter_cluster_id) = 0x0102, (matter_attribute) = "Type"];
  // current_position_lift_percent100ths is the primary attribute in Matter 1.5.1 (0–10000)
  uint32 current_position_lift_percent100ths = 2 [(matter_cluster_id) = 0x0102, (matter_attribute) = "CurrentPositionLiftPercent100ths"];
  uint32 current_position_tilt_percent100ths = 3 [(matter_cluster_id) = 0x0102, (matter_attribute) = "CurrentPositionTiltPercent100ths"];
  uint32 target_position_lift_percent100ths = 4 [(matter_cluster_id) = 0x0102, (matter_attribute) = "TargetPositionLiftPercent100ths"];
  uint32 target_position_tilt_percent100ths = 5 [(matter_cluster_id) = 0x0102, (matter_attribute) = "TargetPositionTiltPercent100ths"];
  // bitmask: global, lift, tilt
  uint32 operational_status = 6 [(matter_cluster_id) = 0x0102, (matter_attribute) = "OperationalStatus"];
  uint32 end_product_type = 7 [(matter_cluster_id) = 0x0102, (matter_attribute) = "EndProductType"];
  uint32 mode = 8 [(matter_cluster_id) = 0x0102, (matter_attribute) = "Mode"];
}

// Matter Door Lock cluster (0x0101 — a cluster ID, not the 0x0101 Dimmable Light device type)
message DoorLockProperties {
  option (matter_device_type) = 0x000A; // Door Lock

  // LockState: NotFullyLocked=0,Locked=1,Unlocked=2,Unlatched=3
  uint32 lock_state = 1 [(matter_cluster_id) = 0x0101, (matter_attribute) = "LockState"];
  uint32 lock_type = 2 [(matter_cluster_id) = 0x0101, (matter_attribute) = "LockType"];
  bool actuator_enabled = 3 [(matter_cluster_id) = 0x0101, (matter_attribute) = "ActuatorEnabled"];
  // Requires door sensor hardware
  uint32 door_state = 4 [(matter_cluster_id) = 0x0101, (matter_attribute) = "DoorState"];
  uint32 operating_mode = 5 [(matter_cluster_id) = 0x0101, (matter_attribute) = "OperatingMode"];
}

// Matter On/Off cluster (0x0006)
message OnOffLightProperties {
  option (matter_device_type) = 0x0100; // On/Off Light

  bool on_off = 1 [(matter_cluster_id) = 0x0006, (matter_attribute) = "OnOff"];
  bool global_scene_control = 2 [(matter_cluster_id) = 0x0006, (matter_attribute) = "GlobalSceneControl"];
  uint32 on_time = 3 [(matter_cluster_id) = 0x0006, (matter_attribute) = "OnTime"];
  uint32 off_wait_time = 4 [(matter_cluster_id) = 0x0006, (matter_attribute) = "OffWaitTime"];
  uint32 start_up_on_off = 5 [(matter_cluster_id) = 0x0006, (matter_attribute) = "StartUpOnOff"];
}

// Matter On/Off (0x0006) + Level Control (0x0008) clusters
message DimmableLightProperties {
  option (matter_device_type) = 0x0101; // Dimmable Light

  bool on_off = 1 [(matter_cluster_id) = 0x0006, (matter_attribute) = "OnOff"];
  // CurrentLevel (0–254)
  uint32 current_level = 2 [(matter_cluster_id) = 0x0008, (matter_attribute) = "CurrentLevel"];
  uint32 min_level = 3 [(matter_cluster_id) = 0x0008, (matter_attribute) = "MinLevel"];
  uint32 max_level = 4 [(matter_cluster_id) = 0x0008, (matter_attribute) = "MaxLevel"];
  uint32 on_level = 5 [(matter_cluster_id) = 0x0008, (matter_attribute) = "OnLevel"];
  uint32 start_up_current_level = 6 [(matter_cluster_id) = 0x0008, (matter_attribute) = "StartUpCurrentLevel"];
  uint32 remaining_time = 7 [(matter_cluster_id) = 0x0008, (matter_attribute) = "RemainingTime"];
}

// Matter On/Off (0x0006) + Level Control (0x0008) + Color Control (0x0300) clusters
message ColorTemperatureLightProperties {
  option (matter_device_type) = 0x010C; // Color Temperature Light

  bool on_off = 1 [(matter_cluster_id) = 0x0006, (matter_attribute) = "OnOff"];
  uint32 current_level = 2 [(matter_cluster_id) = 0x0008, (matter_attribute) = "CurrentLevel"];
  uint32 color_temperature_mireds = 3 [(matter_cluster_id) = 0x0300, (matter_attribute) = "ColorTemperatureMireds"];
  uint32 color_temp_physical_min_mireds = 4 [(matter_cluster_id) = 0x0300, (matter_attribute) = "ColorTempPhysicalMinMireds"];
  uint32 color_temp_physical_max_mireds = 5 [(matter_cluster_id) = 0x0300, (matter_attribute) = "ColorTempPhysicalMaxMireds"];
  uint32 startup_color_temperature_mireds = 6 [(matter_cluster_id) = 0x0300, (matter_attribute) = "StartUpColorTemperatureMireds"];
  uint32 color_mode = 7 [(matter_cluster_id) = 0x0300, (matter_attribute) = "ColorMode"];
}

// Matter Electrical Power Measurement cluster (0x0090)
//
// Was Zigbee ElectricalMeasurement (0x0B04) with that cluster's RMS* attribute names;
// 0x0B04 does not exist in Matter, so a Matter connector could never have produced a
// PropertyUpdate that resolved here. Field numbers are unchanged.
//
// Scale note: Matter 0x0090 encodes these as nullable int64 in mV / mA / mW / mHz. The
// types and units below are this schema's narrower encoding, deliberately left alone here
// because changing them is a wire change, unlike the rename. active_power in particular
// cannot represent loads above ~2.1 kW, so this still needs a decision.
message EnergySensorProperties {
  option (matter_device_type) = 0x0510; // Electrical Sensor

  // Renamed from the Zigbee attribute names when the cluster was corrected to 0x0090.
  reserved "rms_voltage", "rms_current", "ac_frequency";

  // Watts
  int32 active_power = 1 [(matter_cluster_id) = 0x0090, (matter_attribute) = "ActivePower"];
  // Volts × 10
  uint32 voltage = 2 [(matter_cluster_id) = 0x0090, (matter_attribute) = "Voltage"];
  // Amps × 1000
  uint32 active_current = 3 [(matter_cluster_id) = 0x0090, (matter_attribute) = "ActiveCurrent"];
  // Hz × 100
  uint32 frequency = 4 [(matter_cluster_id) = 0x0090, (matter_attribute) = "Frequency"];
}

// Matter Pressure Measurement cluster (0x0403)
message PressureSensorProperties {
  option (matter_device_type) = 0x0305; // Pressure Sensor

  // kPa × 10
  sint32 measured_value = 1 [(matter_cluster_id) = 0x0403, (matter_attribute) = "MeasuredValue"];
  sint32 min_measured_value = 2 [(matter_cluster_id) = 0x0403, (matter_attribute) = "MinMeasuredValue"];
  sint32 max_measured_value = 3 [(matter_cluster_id) = 0x0403, (matter_attribute) = "MaxMeasuredValue"];
  uint32 tolerance = 4 [(matter_cluster_id) = 0x0403, (matter_attribute) = "Tolerance"];
}
