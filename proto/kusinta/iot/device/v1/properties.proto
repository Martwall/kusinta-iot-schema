  // LockState: NotFullyLocked=0,Locked=1,Unlocked=2,Unlatched=3
  optional uint32 lock_state = 1 [
    (matter_cluster_id) = 0x0101,
    (matter_attribute) = "LockState",
    (matter_attribute_id) = 0x0000,
    (matter_attribute_capabilities) = 5
  ];
  optional uint32 lock_type = 2 [
    (matter_cluster_id) = 0x0101,
    (matter_attribute) = "LockType",
    (matter_attribute_id) = 0x0001,
    (matter_attribute_capabilities) = 5
  ];
  optional bool actuator_enabled = 3 [
    (matter_cluster_id) = 0x0101,
    (matter_attribute) = "ActuatorEnabled",
    (matter_attribute_id) = 0x0002,
    (matter_attribute_capabilities) = 5
  ];
  // Requires door sensor hardware
  optional uint32 door_state = 4 [
    (matter_cluster_id) = 0x0101,
    (matter_attribute) = "DoorState",
    (matter_attribute_id) = 0x0003,
    (matter_attribute_capabilities) = 5
  ];
  optional uint32 operating_mode = 5 [
    (matter_cluster_id) = 0x0101,
    (matter_attribute) = "OperatingMode",
    (matter_attribute_id) = 0x0025,
    (matter_attribute_capabilities) = 7
  ];
}

