  ];
}

// Matter Occupancy Sensing cluster (0x0406)
message OccupancySensorProperties {
  option (matter_device_type) = 0x0107; // Occupancy Sensor

  // Renamed to match the Matter attribute names now carried in (matter_attribute).
  reserved "pir_occ_to_unocc_delay", "pir_unocc_to_occ_delay";

  // Occupancy bitmask: bit 0 = occupied
  optional uint32 occupancy = 1 [
    (matter_cluster_id) = 0x0406,
    (matter_attribute) = "Occupancy",
    (matter_attribute_id) = 0x0000,
    (matter_attribute_capabilities) = 5
  ];
  // OccupancySensorType: PIR=0,Ultrasonic=1,PIRandUS=2,PhysicalContact=3
  optional uint32 occupancy_sensor_type = 2 [
    (matter_cluster_id) = 0x0406,
    (matter_attribute) = "OccupancySensorType",
    (matter_attribute_id) = 0x0001,
    (matter_attribute_capabilities) = 5
  ];
  optional uint32 occupancy_sensor_type_bitmap = 3 [
    (matter_cluster_id) = 0x0406,
    (matter_attribute) = "OccupancySensorTypeBitmap",
    (matter_attribute_id) = 0x0002,
    (matter_attribute_capabilities) = 5
  ];
  optional uint32 pir_occupied_to_unoccupied_delay = 4 [
    (matter_cluster_id) = 0x0406,
    (matter_attribute) = "PIROccupiedToUnoccupiedDelay",
    (matter_attribute_id) = 0x0010,
    (matter_attribute_capabilities) = 7
  ];
  optional uint32 pir_unoccupied_to_occupied_delay = 5 [
    (matter_cluster_id) = 0x0406,
    (matter_attribute) = "PIRUnoccupiedToOccupiedDelay",
    (matter_attribute_id) = 0x0011,
    (matter_attribute_capabilities) = 7
  ];
}

// Matter Boolean State cluster (0x0045)
message ContactSensorProperties {
  option (matter_device_type) = 0x0015; // Contact Sensor

  // StateValue: false = contact open (alarm), true = contact closed (normal)
  optional bool state_value = 1 [
    (matter_cluster_id) = 0x0045,
    (matter_attribute) = "StateValue",
    (matter_attribute_id) = 0x0000,
    (matter_attribute_capabilities) = 5
  ];
}

// Matter Window Covering cluster (0x0102)
message WindowCoveringProperties {
  option (matter_device_type) = 0x0202; // Window Covering

  // The Matter attribute is the bare "Type"; the field keeps a qualified name because
  // `type` is a poor field name and keyword-adjacent in several target languages. The
  // mapping is in (matter_attribute), so the divergence costs consumers nothing.
  optional uint32 covering_type = 1 [
    (matter_cluster_id) = 0x0102,
    (matter_attribute) = "Type",
    (matter_attribute_id) = 0x0000,
    (matter_attribute_capabilities) = 5
  ];
  // current_position_lift_percent100ths is the primary attribute in Matter 1.5.1 (0–10000)
  optional uint32 current_position_lift_percent100ths = 2 [
    (matter_cluster_id) = 0x0102,
    (matter_attribute) = "CurrentPositionLiftPercent100ths",
    (matter_attribute_id) = 0x000E,
    (matter_attribute_capabilities) = 5
  ];
  optional uint32 current_position_tilt_percent100ths = 3 [
    (matter_cluster_id) = 0x0102,
    (matter_attribute) = "CurrentPositionTiltPercent100ths",
    (matter_attribute_id) = 0x000F,
    (matter_attribute_capabilities) = 5
  ];
  optional uint32 target_position_lift_percent100ths = 4 [
    (matter_cluster_id) = 0x0102,
    (matter_attribute) = "TargetPositionLiftPercent100ths",
    (matter_attribute_id) = 0x000B,
    (matter_attribute_capabilities) = 5
  ];
  optional uint32 target_position_tilt_percent100ths = 5 [
    (matter_cluster_id) = 0x0102,
    (matter_attribute) = "TargetPositionTiltPercent100ths",
    (matter_attribute_id) = 0x000C,
    (matter_attribute_capabilities) = 5
  ];
  // bitmask: global, lift, tilt
  optional uint32 operational_status = 6 [
    (matter_cluster_id) = 0x0102,
    (matter_attribute) = "OperationalStatus",
    (matter_attribute_id) = 0x000A,
    (matter_attribute_capabilities) = 5
  ];
  optional uint32 end_product_type = 7 [
    (matter_cluster_id) = 0x0102,
    (matter_attribute) = "EndProductType",
    (matter_attribute_id) = 0x000D,
    (matter_attribute_capabilities) = 5
  ];
  optional uint32 mode = 8 [
    (matter_cluster_id) = 0x0102,
    (matter_attribute) = "Mode",
    (matter_attribute_id) = 0x0017,
    (matter_attribute_capabilities) = 7
  ];
}

