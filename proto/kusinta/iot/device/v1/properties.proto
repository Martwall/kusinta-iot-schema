    (matter_attribute) = "MeasuredValue",
    (matter_attribute_id) = 0x0000,
    (matter_attribute_capabilities) = 5
  ];
  optional sint32 min_measured_value = 2 [
    (matter_cluster_id) = 0x0402,
    (matter_attribute) = "MinMeasuredValue",
    (matter_attribute_id) = 0x0001,
    (matter_attribute_capabilities) = 5
  ];
  optional sint32 max_measured_value = 3 [
    (matter_cluster_id) = 0x0402,
    (matter_attribute) = "MaxMeasuredValue",
    (matter_attribute_id) = 0x0002,
    (matter_attribute_capabilities) = 5
  ];
  optional uint32 tolerance = 4 [
    (matter_cluster_id) = 0x0402,
    (matter_attribute) = "Tolerance",
    (matter_attribute_id) = 0x0003,
    (matter_attribute_capabilities) = 5
  ];
}

