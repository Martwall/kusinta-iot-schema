syntax = "proto3";

package kusinta.iot.device.v1;

import "kusinta/iot/device/v1/matter_options.proto";

option optimize_for = SPEED;

// Temperatures use sint32 in centidegrees (°C × 100), matching Matter's int16 × 0.01°C encoding.
// Fields 1-99 are commonly-used attributes; 100+ are optional/rarely-used.
//
// Every field is `optional` — explicit presence, not a statement about how important the
// attribute is. These messages are assembled incrementally from a PropertyUpdate stream, so
// "never reported" has to be distinguishable from a reported value, and Matter gives zero a
// meaning nearly everywhere: SystemMode Off=0, LockState NotFullyLocked=0, OccupancySensorType
// PIR=0, Type Rollershade=0, a dimmer at level 0, 0.00 °C, 0 W. StateValue is the sharpest —
// false means contact open, which is the alarm, so under implicit presence a contact sensor that
// had never reported was byte-identical to one reporting an alarm.
//
// So: field absent = the device has never reported this attribute. Field present = a reading,
// including zero. Consumers MUST check presence rather than treating zero as "no data", and
// MUST NOT populate a field to mean "default" — leave it absent. Adding a field to any message
// here means adding it as `optional`; the presence tests enforce that.
//
// Every field carries (matter_cluster_id), (matter_attribute), (matter_attribute_id) and
// (matter_attribute_capabilities); every non-vendor message carries (matter_device_type).
// The first three are the mapping — resolve a PropertyUpdate or a device type from them,
// never from the field name. Field names
// follow Matter's attribute names loosely and in a few places not at all
// (pir_occupied_to_unoccupied_delay's acronym, covering_type for the bare "Type"),
// so no string transformation of a field name is a correct substitute.
// See property_update.proto for the normative resolution rule.
//
// (matter_attribute_capabilities) is the fourth, and it says something different: what the
// Matter specification says the attribute supports — READ = 1, WRITE = 2, REPORT = 4. It is
// read off the specification, not off whether any connector happens to write the field, and
// it is uniform across devices. Whether one particular device implements the attribute at
// all is a separate, runtime fact: see ClusterState.attribute_ids. And it is not permission
// — access/v1/acl.proto is that. A test asserts every field here carries a mask, so a field
// added without one fails rather than silently claiming no capability.
//
// A message's clusters are listed in its comment for orientation only; the per-field
// (matter_cluster_id) is authoritative, and several messages span more than one cluster.

// Matter Thermostat cluster (0x0201)
message ThermostatProperties {
  option (matter_device_type) = 0x0301; // Thermostat

  optional sint32 local_temperature = 1 [
    (matter_cluster_id) = 0x0201,
    (matter_attribute) = "LocalTemperature",
    (matter_attribute_id) = 0x0000,
    (matter_attribute_capabilities) = 5
  ];
  optional sint32 occupied_heating_setpoint = 2 [
    (matter_cluster_id) = 0x0201,
    (matter_attribute) = "OccupiedHeatingSetpoint",
    (matter_attribute_id) = 0x0012,
    (matter_attribute_capabilities) = 7
  ];
  optional sint32 occupied_cooling_setpoint = 3 [
    (matter_cluster_id) = 0x0201,
    (matter_attribute) = "OccupiedCoolingSetpoint",
    (matter_attribute_id) = 0x0011,
    (matter_attribute_capabilities) = 7
  ];
  // Property-owner constraint
  optional sint32 min_heat_setpoint_limit = 4 [
    (matter_cluster_id) = 0x0201,
    (matter_attribute) = "MinHeatSetpointLimit",
    (matter_attribute_id) = 0x0015,
    (matter_attribute_capabilities) = 7
  ];
  // Property-owner constraint
  optional sint32 max_heat_setpoint_limit = 5 [
    (matter_cluster_id) = 0x0201,
    (matter_attribute) = "MaxHeatSetpointLimit",
    (matter_attribute_id) = 0x0016,
    (matter_attribute_capabilities) = 7
  ];
  optional sint32 min_cool_setpoint_limit = 6 [
    (matter_cluster_id) = 0x0201,
    (matter_attribute) = "MinCoolSetpointLimit",
    (matter_attribute_id) = 0x0017,
    (matter_attribute_capabilities) = 7
  ];
  optional sint32 max_cool_setpoint_limit = 7 [
    (matter_cluster_id) = 0x0201,
    (matter_attribute) = "MaxCoolSetpointLimit",
    (matter_attribute_id) = 0x0018,
    (matter_attribute_capabilities) = 7
  ];
  optional uint32 control_sequence_of_operation = 8 [
    (matter_cluster_id) = 0x0201,
    (matter_attribute) = "ControlSequenceOfOperation",
    (matter_attribute_id) = 0x001B,
    (matter_attribute_capabilities) = 7
  ];
  // SystemMode: Off=0,Auto=1,Cool=3,Heat=4,EmHeat=5
  optional uint32 system_mode = 9 [
    (matter_cluster_id) = 0x0201,
    (matter_attribute) = "SystemMode",
    (matter_attribute_id) = 0x001C,
    (matter_attribute_capabilities) = 7
  ];
  optional uint32 thermostat_running_mode = 10 [
    (matter_cluster_id) = 0x0201,
    (matter_attribute) = "ThermostatRunningMode",
    (matter_attribute_id) = 0x001E,
    (matter_attribute_capabilities) = 5
  ];
  // Heating demanded by the control loop, 0-100 %, which is the percentage the valve is
  // open. A radiator valve's own position belongs here and not in a vendor extension: the
  // Matter attribute is specified as exactly this quantity. A thermostat that drives no
  // valve of its own does not implement it — see ClusterState.attribute_ids.
  optional uint32 pi_heating_demand = 11 [
    (matter_cluster_id) = 0x0201,
    (matter_attribute) = "PIHeatingDemand",
    (matter_attribute_id) = 0x0008,
    (matter_attribute_capabilities) = 5
  ];
}

