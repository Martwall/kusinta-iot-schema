  // CurrentLevel (0–254)
  optional uint32 current_level = 2 [
    (matter_cluster_id) = 0x0008,
    (matter_attribute) = "CurrentLevel",
    (matter_attribute_id) = 0x0000,
    (matter_attribute_capabilities) = 5
  ];
  optional uint32 min_level = 3 [
    (matter_cluster_id) = 0x0008,
    (matter_attribute) = "MinLevel",
    (matter_attribute_id) = 0x0002,
    (matter_attribute_capabilities) = 5
  ];
  optional uint32 max_level = 4 [
    (matter_cluster_id) = 0x0008,
    (matter_attribute) = "MaxLevel",
    (matter_attribute_id) = 0x0003,
    (matter_attribute_capabilities) = 5
  ];
  optional uint32 on_level = 5 [
    (matter_cluster_id) = 0x0008,
    (matter_attribute) = "OnLevel",
    (matter_attribute_id) = 0x0011,
    (matter_attribute_capabilities) = 7
  ];
  optional uint32 start_up_current_level = 6 [
    (matter_cluster_id) = 0x0008,
    (matter_attribute) = "StartUpCurrentLevel",
