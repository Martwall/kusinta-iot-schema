syntax = "proto3";

package kusinta.iot.device.v1;

import "google/protobuf/descriptor.proto";

option optimize_for = SPEED;

// Custom options that make this schema's Matter mappings machine-readable — for
// properties, for commands, and for the device types that select between them.
//
// Without them a consumer has to infer from naming convention which *Properties field a
// PropertyUpdate belongs to, which Endpoint.matter_properties case an
// Endpoint.matter_device_type_id selects, and which Matter command a DeviceCommand
// parameters case carries. Both inferences fail silently — a
// dropped attribute or an unset oneof looks identical to a device that never reported.
// These options move both mappings into the descriptor, so consumers read them.
//
// Extension numbers 50001-50999 are reserved for this schema's own annotations, Matter
// and vendor alike. Taken so far: 50001-50003 here, 50004-50005 in
// vendor/v1/vendor_options.proto. Allocate the next from that range and record it in
// both files. They are not registered with Buf's global extension registry; they are
// only ever applied to kusinta.iot.* files, so no collision is possible.
extend google.protobuf.FieldOptions {
  // The Matter cluster this attribute belongs to, e.g. 0x0201 for Thermostat.
  //
  // Required alongside matter_attribute because a properties message may span
  // clusters: DimmableLightProperties.on_off is On/Off (0x0006) while its
  // current_level is Level Control (0x0008). Matches PropertyUpdate.cluster_id, which
  // is a uint32 too, so the comparison needs no parsing.
  uint32 matter_cluster_id = 50001;

  // The Matter attribute name in the spec's own PascalCase, e.g.
  // "PIROccupiedToUnoccupiedDelay". This is the authoritative spelling; the proto
  // field name is not derived from it and must not be assumed to be. Matches
  // PropertyUpdate.attribute_name byte for byte.
  string matter_attribute = 50002;

  // The Matter attribute ID within that cluster, e.g. 0x0012 for OccupiedHeatingSetpoint.
  // This is what a PropertyUpdate resolves on — Matter addresses attributes numerically and
  // so does this schema, because the generic cluster carrier must address attributes of
  // clusters this schema does not model, and a vendor-defined cluster has no spec name to
  // address it by. One scheme rather than two.
  //
  // matter_attribute above stays as the authoritative spelling for logs and for anything
  // rendering an attribute to a human; it is not what resolution matches on.
  uint32 matter_attribute_id = 50006;
}

extend google.protobuf.MessageOptions {
  // The Matter device type IDs this properties message models, e.g. 0x0301 for
  // Thermostat. Repeated because one shape of properties can serve several device
  // types; empty on vendor extension messages, which have no Matter device type.
  //
  // A device type appears on at most one properties message, so the mapping from
  // Endpoint.matter_device_type_id to an Endpoint.matter_properties case is a
  // function.
  repeated uint32 matter_device_type = 50003;

  // The Matter cluster a command-parameters message belongs to, e.g. 0x0006 for On/Off.
  // Always exactly one — a parameters message never spans clusters.
  uint32 matter_command_cluster = 50007;

  // The Matter command ID this parameters message carries arguments for, e.g. 0x00 for
  // Thermostat's SetpointRaiseLower.
  //
  // Singular on purpose. An earlier form was repeated, so that one message could cover
  // several commands and choose between them by its own fields — but a message that
  // encodes WHICH command it is duplicates DeviceCommand.matter_command_id, in a second
  // numbering, with nothing reconciling the two. The parameters carry arguments; the
  // command ID says which command. A message shared by several commands that take the
  // same arguments simply omits this and lets matter_command_id stand alone.
  optional uint32 matter_command_id = 50008;
}
