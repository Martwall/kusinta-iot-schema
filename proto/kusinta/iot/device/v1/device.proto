syntax = "proto3";

package kusinta.iot.device.v1;

import "google/protobuf/timestamp.proto";
import "kusinta/iot/device/v1/descriptor.proto";
import "kusinta/iot/device/v1/properties.proto";
import "kusinta/iot/vendor/homematic/v1/homematic.proto";

option optimize_for = SPEED;

// Device combines a DeviceDescriptor with a strongly-typed oneof for its current state.
// Field number convention: 1 = descriptor, 2-49 = standard Matter device types,
// 50-99 = vendor extensions, 20+ = timestamps.
message Device {
  DeviceDescriptor descriptor = 1;

  oneof properties {
    ThermostatProperties          thermostat              = 2;
    TemperatureSensorProperties   temperature_sensor      = 3;
    HumiditySensorProperties      humidity_sensor         = 4;
    OccupancySensorProperties     occupancy_sensor        = 5;
    ContactSensorProperties       contact_sensor          = 6;
    WindowCoveringProperties      window_covering         = 7;
    DoorLockProperties            door_lock               = 8;
    OnOffLightProperties          on_off_light            = 9;
    DimmableLightProperties       dimmable_light          = 10;
    ColorTemperatureLightProperties color_temp_light      = 11;
    EnergySensorProperties        energy_sensor           = 12;
    PressureSensorProperties      pressure_sensor         = 13;
    // Vendor extensions (fields 50-99)
    kusinta.iot.vendor.homematic.v1.HomematicVendorExtension homematic = 50;
  }

  google.protobuf.Timestamp last_seen    = 20;
  google.protobuf.Timestamp last_updated = 21;
}
