syntax = "proto3";

package kusinta.iot.device.v1;

option optimize_for = SPEED;

// Matter null. Distinct from a field being absent: Matter types many attributes as
// nullable, where null is a reported value meaning "not currently known" — a thermostat
// that cannot read its local temperature reports null, which is not the same as never
// having reported at all.
message NullValue {}

// A Matter attribute value of any shape, including the ones a scalar cannot carry.
//
// Self-describing rather than Matter's own TLV as opaque bytes: an app that cannot decode
// a value cannot show it, and TLV would make the generic path useful only to the gateway.
// The cost is a recursive message; the benefit is that an attribute this schema has never
// heard of is still renderable.
//
// Widths are deliberately wider than most attributes need — sint64 covers every signed
// Matter integer type and uint64 every unsigned one, so a generic carrier never has to
// know an attribute's declared width to carry its value.
message AttributeValue {
  oneof value {
    bool bool_value = 1;
    sint64 int_value = 2;
    uint64 uint_value = 3;
    double double_value = 4;
    string string_value = 5;
    bytes bytes_value = 6;
    AttributeValueList list_value = 7;
    AttributeValueStruct struct_value = 8;
    NullValue null_value = 9;
  }
}

message AttributeValueList {
  repeated AttributeValue values = 1;
}

// Matter struct fields are addressed by numeric context tag, not by name, so the map is
// keyed by tag. A consumer that knows the struct's definition reads the tags it wants; one
// that does not can still carry and re-emit the whole thing.
message AttributeValueStruct {
  map<uint32, AttributeValue> fields = 1;
}

message AttributeState {
  uint32 attribute_id = 1;
  AttributeValue value = 2;
}

// One cluster hosted by an endpoint: what it is, what it supports, and any attribute value
// that has no typed home.
//
// An entry exists for EVERY cluster the endpoint hosts, including clusters this schema
// models with a typed properties message. That is not a contradiction of the
// one-value-one-place rule below — cluster_revision, feature_map and
// accepted_command_ids describe the cluster itself and have nowhere else to live.
//
// attributes is where the rule applies: it holds ONLY the attribute values that no typed
// field covers. An attribute the schema models is carried in its typed field and MUST NOT
// be repeated here — a value that exists in two places is a value that can disagree with
// itself.
//
// This is what lets an endpoint report something useful when its device type is not
// modelled, or when it carries a cluster beyond its device type's set, which the Matter
// specification explicitly permits.
message ClusterState {
  uint32 cluster_id = 1;

  // Matter's ClusterRevision. Which revision of the cluster definition the device
  // implements.
  optional uint32 cluster_revision = 2;

  // Matter's FeatureMap: a bitmap of the optional features this cluster supports on this
  // endpoint.
  //
  // Worth carrying even for fully-modelled clusters, because it resolves an ambiguity the
  // presence rule cannot. properties.proto says an absent field means "never reported" —
  // but without a FeatureMap, absent is also what an attribute the device does not
  // implement looks like. With it, a consumer can tell "not supported" from "not yet
  // seen".
  optional uint32 feature_map = 3;

  // Attribute values with no typed field. See the message comment.
  repeated AttributeState attributes = 4;

  // Matter's AcceptedCommandList: which commands this cluster accepts on this endpoint.
  // Without it a consumer must infer a device's capabilities from its device type and
  // discover the truth by sending a command and watching it fail.
  repeated uint32 accepted_command_ids = 5;

  // Matter's AttributeList (0xFFFB): which attributes this cluster instance actually
  // implements HERE, on this endpoint of this device.
  //
  // It answers the question presence cannot. A typed field that is absent means "never
  // reported" — and a device that will never report it, because it does not have the
  // hardware, looks exactly the same. A wall thermostat drives no valve, so it has no
  // PIHeatingDemand; a radiator valve has one it has not sent yet. Listed here with no
  // value in the properties message = implemented, not yet reported. Absent from this
  // list = the device does not have it.
  //
  // Distinct from feature_map, which is per-feature rather than per-attribute, and from
  // (matter_attribute_capabilities), which says what the attribute IS — readable,
  // writable, reportable — uniformly for every device, at compile time. Neither
  // substitutes for the other: an app needs both to decide whether to draw a control,
  // draw a value, or draw nothing.
  //
  // An empty list is "not stated", not "implements nothing". A producer that does not
  // know its device's attribute list leaves it empty; one that does SHOULD fill it at
  // announcement, where it costs nothing per update.
  repeated uint32 attribute_ids = 6;

  // The step each writable attribute is set in, keyed by attribute id, in the attribute's
  // own wire unit: 50 on OccupiedHeatingSetpoint is a half degree, since the setpoint is
  // carried in centidegrees.
  //
  // Matter defines no granularity for a setpoint, and devices differ by a factor of ten —
  // one valve holds tenths, another half degrees, another whole degrees. A consumer that
  // guesses offers steps the device silently rounds away, and one that compares a written
  // value with the device's report on the wrong grid never sees the two agree. A value
  // written on this step is one the device holds as written.
  //
  // Stated by the producer at announcement, like attribute_ids, and the same rule
  // applies: an absent key is "not stated", never a step of zero, and a consumer falls
  // back to its own default. A value of 0 means nothing and is treated as absent.
  map<uint32, uint32> attribute_steps = 7;

  // What a write to each attribute leaves behind, and how late its reports arrive, keyed by
  // attribute id. See AttributeBehaviour. Its step stays in attribute_steps.
  //
  // Per endpoint because a ClusterState belongs to one endpoint: a device with several
  // independently switched outputs states each output's behaviour on that output's
  // endpoint. A vendor parameter, which has no cluster, states its behaviour in
  // Endpoint.vendor_attribute_behaviours.
  //
  // Stated by the producer at announcement. An absent key is "not stated".
  map<uint32, AttributeBehaviour> attribute_behaviours = 8;
}

// What a write to one attribute leaves behind, and how late its reports arrive. Stated per
// attribute, per endpoint, by the producer that knows the device.
//
// A consumer that leaves a written value in place while it is gone — a gateway steering
// heat — needs to know what the device does on its own. Not stated is read as the worst
// case: a write whose kind is not stated is held as if sticky, and a reading whose latency
// is not stated is never treated as real-time.
//
// A gateway MUST NOT drive a heat source, a heating circuit or a floor zone through an
// attribute whose write kind is not stated here: it refuses the write. This is the
// opposite default to attribute_ids or a connector's known_links, where not stated only
// means not known; for an output that heats a home, not stated means no. Rollout order: a
// producer that carries such outputs states their behaviour before a gateway that drives
// them takes the release that enforces this.
message AttributeBehaviour {
  // What a write leaves behind when its writer goes quiet. Unset: not stated.
  oneof write {
    StickyWrite sticky = 1;
    LeasedWrite leased = 2;
  }

  // The value the attribute takes when the device's power returns. Stated only for an
  // attribute whose cluster has no startup attribute of its own: where the cluster has one
  // (OnOff's StartUpOnOff, Level Control's StartUpCurrentLevel), that attribute says it and
  // this stays unset, so the value lives in one place. Unset: not stated.
  AttributeValue power_on_value = 3;

  // How late a reported value reaches the producer. Unset: not stated, never REAL_TIME.
  ReadLatency read_latency = 4;
}

// The device holds a written value until something writes it again: through the writer's
// absence and a lost network. A writer that may go quiet writes a value it can live with
// being left in place.
message StickyWrite {}

// The device itself returns the attribute to lapse_value when a write's lease runs out,
// whether or not anything is still talking to it. The lease is kept by the device — a
// timer, or a watchdog on the device's own link — never by the writer re-sending: a value
// that lapses only because its writer keeps renewing it is sticky to anyone who has to
// plan for the writer failing.
message LeasedWrite {
  // The shortest and longest lease, in seconds, the device accepts. Absent: no bound on
  // that side, never zero. A lease outside them is refused rather than clamped.
  optional uint32 min_lease_seconds = 1;
  optional uint32 max_lease_seconds = 2;

  // Whether a write that arrives before the lease runs out starts the lease again from
  // that write. False or unset (not stated): a writer MUST NOT assume that writing the
  // same value again extends how long it holds.
  optional bool renewal_restarts_lease = 3;

  // The value the attribute returns to when the lease runs out. It is the state a site
  // falls back to whenever its writer is gone, so it is what an installer checks first and
  // what a consumer shows as "what happens if this stops". A producer always states it; a
  // consumer reads a lease without it as a write kind not stated.
  AttributeValue lapse_value = 4;
}

// How late a reported value reaches the producer after it changes at the device.
enum ReadLatency {
  // Not stated. Never treated as REAL_TIME.
  READ_LATENCY_UNSPECIFIED = 0;

  // Within a few minutes of the change, every time.
  READ_LATENCY_REAL_TIME = 1;

  // Late enough that acting on it as current would be wrong: values collected by a
  // vendor's service and handed on in batches, hourly values made available the next day.
  // Fit for records, models and reports; not for a decision that has to be made now.
  READ_LATENCY_DELAYED = 2;
}
