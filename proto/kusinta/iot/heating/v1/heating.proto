syntax = "proto3";

package kusinta.iot.heating.v1;

import "google/protobuf/timestamp.proto";
import "kusinta/iot/access/v1/acl.proto";
import "kusinta/iot/access/v1/roles.proto";
import "kusinta/iot/climate/v1/climate.proto";
import "kusinta/iot/device/v1/cluster_state.proto";
import "kusinta/iot/identity/v1/identity.proto";

option optimize_for = SPEED;

// What heats a space, and which device outputs the building-server gateway may drive to
// steer it: plants (heat sources), their circuits, the floor zones on a floor circuit and
// the rooms each zone heats, and the comfort loads in rooms.
//
// No device is part of the heating by being filed in a room. A relay is nothing to the
// heating until a record here binds one of its outputs to a role.
//
// Records are flat: a circuit names its plant, a floor zone its circuit, a comfort load its
// room. Each is put, revisioned and authorized on its own, so a zone mapping, a plant's
// inputs and a comfort load are edited by whoever may edit that record without touching
// the others. Every record carries a revision, set by the gateway and bumped by every
// change to it except a comfort load's windows, which have a revision of their own; a put
// that replaces a record, and a remove, names the revision it acts on. Ids are assigned by
// the gateway, unique among heating records, opaque and not sequential.
//
// Who may see and change them goes by the rooms a record names, not by the plant's space.
// All of a floor zone's rooms lie in one home, or all lie outside homes. A floor zone or
// comfort load naming a room in a home is that home's: given only to its residents and to
// an installer under a commissioning grant on that home (commissioning.v1.CommissioningGrant),
// changed by a household admin of the home (access.v1.MEMBERSHIP_RELATION_HOUSEHOLD_ADMIN) or
// that installer, whatever space its plant serves. Such a record may name a
// parent the caller cannot see — a circuit of a central plant — as a bare id: a layout may
// hold it without its parent, and a put of it needs no rights over the parent. Moving a
// zone to another circuit does. Residents set a comfort load's windows; an installer under a
// commissioning grant is given the comfort load without them (windows_withheld), since a
// grant covers no comfort settings. A caller who reaches the home as service gets none of
// these records, and a request naming one is refused as NOT_ENTITLED, however it is named —
// save that while the home is empty (webrtc.v1 household.proto, EMPTY HOME), the property owner
// and the gateway administrators who reach it are given its floor zones, not its plants,
// circuits or comfort loads, with FloorZone.uncontrolled_since but without uncontrolled_by, and
// may change a zone's rooms and control room as webrtc.v1 management.proto (PutFloorZone) says.
// A plant and its circuits are given to and changed by whoever holds those rights over the
// plant's space: in a home as above; outside homes, the property owner and the gateway's
// administrators.
//
// A zone relay at a central manifold is filed in the home it serves, on its apartment, wherever
// it physically hangs (webrtc.v1.PlaceDeviceInSpace). It is then the home's device: its state
// is withheld from service as any device's in a home is (access.v1.MembershipRelation), and its
// outputs are bound by those who bind the home's — its household admins, or an installer whose
// commissioning grant covers the home — so its binding never crosses a home's boundary
// (webrtc.v1 management.proto, HEATING ACROSS A HOME). One device serves one home: a relay
// whose channels would serve two homes cannot be bound to both, and each home has a relay of
// its own.
//
// The gateway drives a bound output away from rest only while it holds a current pass of its
// commissioning test (commissioning.v1, TEST_KIND_OUTPUT_LEASE), and only while its producer
// states it as leased (device.v1.LeasedWrite) with a lapse value that leaves the contact where
// its role rests. That is checked each time it drives, not only when the output is bound: an
// output whose producer stops stating it so, or whose device is gone, is not driven until that
// changes.
//
// UNCONTROLLED ZONES. A deletion drops the rooms it deletes from every floor zone that names
// them, the area shares of the rooms each keeps made whole again in proportion, and clears a
// zone's control room if that went (webrtc.v1 management.proto, HEATING ACROSS A HOME). A
// zone whose rooms all go keeps its output binding, with no room, until a put names rooms
// again — where the deletion leaves it whose it was; one the deletion would carry across a
// home's boundary goes as management.proto says. A floor zone is uncontrolled while it has
// no room, or no control room: none named, or the one named no longer within its plant's
// space. An uncontrolled zone is not driven until a put names a control room among its rooms
// (a put names both, and is refused without them). Not driven, its output is at rest, and a
// floor zone rests closed — on normally-closed wiring, the output off — so it heats without
// control, capped only by its circuit's supply limiter (FloorZone.uncontrolled_since;
// reporting.v1.PROBLEM_KIND_FLOOR_ZONE_UNCONTROLLED).
//
// No record reaches across a home's boundary: a change that would leave one so is refused or
// undone as webrtc.v1 management.proto (HEATING ACROSS A HOME) says. A binding across it, or a
// floor zone split by it, stored before that rule is undone once, when the gateway starts
// (management.proto, START-UP); a binding across it is never driven or read for its record
// meanwhile, and blocks its feature (commissioning.v1.BLOCK_REASON_DEVICE_ACROSS_HOME). When an output stops being bound — its
// record removed, or a put binding another output in its place — the gateway writes its lapse
// value, ending any lease at once; where the device cannot be reached then, the lease running
// out returns it to rest, and that is the guarantee.

// One attribute of one device: what a role reads or writes. Endpoint_id is required on the
// Matter branch of the attribute here — an absent endpoint is refused, never read as the
// root node.
message DeviceAttribute {
  kusinta.iot.identity.v1.DeviceId device_id = 1;
  kusinta.iot.access.v1.AttributeRef attribute = 2;
}

// One device output switching one contact on the heating side: a floor zone's thermostat
// input, a heat-source input, a comfort load's supply.
message ContactBinding {
  // OnOff on a relay channel, or a vendor parameter.
  DeviceAttribute output = 1;

  // The value of the output with which the contact is closed. A wiring fact, not a device
  // fact: a changeover relay wired through its normally closed contact closes it with the
  // channel off, so OnOff false. The producer cannot know it; whoever wires the relay
  // states it, and the gateway reads every state of the role through it — never from the
  // output's value alone.
  //
  // Each role has a fixed rest state (see the role), and the output's lapse value
  // (device.v1.LeasedWrite.lapse_value), read through this value, must leave the contact
  // where the role rests. Every comparison with this value matches type as well as value:
  // an int 0 is not a bool false.
  kusinta.iot.device.v1.AttributeValue closed_value = 2;
}

enum HeatSourceKind {
  HEAT_SOURCE_KIND_UNSPECIFIED = 0;
  HEAT_SOURCE_KIND_EXHAUST_AIR_HEAT_PUMP = 1;
  HEAT_SOURCE_KIND_GROUND_SOURCE_HEAT_PUMP = 2;
  HEAT_SOURCE_KIND_AIR_WATER_HEAT_PUMP = 3;
  HEAT_SOURCE_KIND_DISTRICT_HEATING = 4;
  HEAT_SOURCE_KIND_ELECTRIC_BOILER = 5;
  HEAT_SOURCE_KIND_FUEL_BOILER = 6;
}

// One heat source.
message HeatingPlant {
  // Assigned by the gateway, unique among heating records; empty when creating.
  string plant_id = 1;

  // The space the plant serves: a home, or a space outside homes for a central plant.
  kusinta.iot.identity.v1.SpaceId space_id = 2;

  string name = 3;
  HeatSourceKind source = 4;

  // The device the heat source's own readings come from — its temperatures, compressor and
  // hot-water state — when it has one; its temperatures are the device's
  // device.v1.HeatSourceReadings. Read only: the gateway drives a heat source through the
  // plant's control, never through this device.
  kusinta.iot.identity.v1.DeviceId readings_device_id = 5;

  // How the gateway steers the heat source. Unset: it does not; the plant is read only. A
  // control set binds at least one input.
  oneof control {
    HeatPumpControl heat_pump = 6;
  }

  // The electricity or heat meter the plant is measured by.
  DeviceAttribute meter = 7;

  // See the file comment.
  uint64 revision = 8;

  // Every price rule the gateway runs for this plant, each once, with its mode as it stands:
  // the latest change of each (PriceRuleChange), OFF included. A rule not listed is one the
  // gateway does not run for this plant, and a client offers no switch for it. A rule whose mode
  // was never set is listed in the mode it started in — OFF, or SHADOW as the rollout note under
  // PRICE RULES (WHO SWITCHES THEM) says — with at, set_by_role and set_by unset.
  //
  // Read-only: set with webrtc.v1.SetPriceRuleMode, never in a put, which keeps them and ignores
  // them, and does not bump revision. Sent to whoever is given the plant, set_by as
  // PriceRuleChange says. An app tells a gateway that predates price rules by an empty list with
  // price_rules_revision 0, and offers no switch.
  repeated PriceRuleChange price_rules = 9;

  // Set by the gateway and bumped by every change of price_rules; see webrtc.v1.SetPriceRuleMode.
  uint64 price_rules_revision = 10;
}

// A heat pump's control inputs.
message HeatPumpControl {
  // The SG Ready inputs, by what each means closed alone: sg_ready_block closed alone
  // blocks the heat pump, sg_ready_boost closed alone recommends running harder, both
  // closed commands it to, and both open is normal operation. Both rest open, so a lapsed
  // lease or a stopped gateway leaves the heat pump running normally. Bound together or not
  // at all.
  //
  // They lapse separately, so their leases are ordered: while both are closed, the gateway
  // gives sg_ready_block no longer a lease than sg_ready_boost, so the heat pump never passes
  // through "blocked" on its way back to normal. In general, of two bound inputs, the one
  // whose half-state blocks heat never lapses last.
  ContactBinding sg_ready_block = 1;
  ContactBinding sg_ready_boost = 2;

  // The input that blocks the heat pump's add-on (electric) heater while closed. Rests
  // open: the add-on heater is allowed.
  ContactBinding add_on_heater_block = 3;
}

// One heating circuit of a plant. Supply temperature and its cap are per circuit.
message HeatingCircuit {
  // Assigned by the gateway, unique among heating records; empty when creating.
  string circuit_id = 1;

  string plant_id = 2;
  string name = 3;

  oneof distribution {
    RadiatorCircuit radiator = 4;
    FloorCircuit floor = 5;
  }

  // See the file comment.
  uint64 revision = 6;
}

// A radiator circuit. Its valves belong to the rooms (climate.v1.RoomClimate).
message RadiatorCircuit {}

// Hydronic floor heating: its own pump, mixing and supply cap, and the floor zones on its
// manifold.
message FloorCircuit {
  // Whether a mixing valve feeds the circuit.
  bool mixing_valve = 1;

  // The supply temperature its self-acting limiter caps it at, in centidegrees. Absent: not
  // known, never 0 °C.
  optional sint32 supply_cap_centidegrees = 2;

  // Probes on the supply (after mixing) and the return. Each names the Matter Temperature
  // Measurement cluster's MeasuredValue (cluster 0x0402, attribute 0x0000, in centidegrees) on
  // the probe's endpoint; a put naming any other attribute, or a vendor parameter, is refused as
  // INVALID_REQUEST, so that every reading of a probe is a temperature in one unit.
  DeviceAttribute supply_probe = 3;
  DeviceAttribute return_probe = 4;
}

// One loop or group of loops on a floor circuit's manifold, switched by one output on its
// wiring centre's thermostat input. The output's contact closed means the zone heats, and it
// rests closed: when the gateway is gone the zone heats, capped only by the circuit's supply
// limiter.
message FloorZone {
  // Assigned by the gateway, unique among heating records; empty when creating.
  string zone_id = 1;

  // A FLOOR circuit.
  string circuit_id = 2;

  // As marked on the manifold or the drawing ("SL 2").
  string name = 3;

  ContactBinding output = 4;

  // The rooms the zone heats, each a room within its plant's space, listed once, with a
  // share above 0 and shares summing to 1000. A zone may heat several rooms and a room may
  // be heated by several zones. A put names at least one; empty only for a zone whose rooms
  // were all deleted, which is uncontrolled (see the file comment, UNCONTROLLED ZONES).
  repeated FloorZoneRoom rooms = 5;

  // One of rooms. Only its error, its sensor and its open window steer the zone. A put names
  // one; unset only once a deletion cleared it, and always while rooms is empty. A zone
  // without one is uncontrolled (see the file comment, UNCONTROLLED ZONES).
  kusinta.iot.identity.v1.SpaceId control_room_id = 6;

  // See the file comment.
  uint64 revision = 7;

  // While the zone is uncontrolled — no room, or no control room (see the file comment,
  // UNCONTROLLED ZONES): since when it has been so, and the user whose change left it so — the
  // deletion of its control room or its last room; uncontrolled_by is unset where no user's
  // change did. Both unset while the zone is controlled. Read-only: set by the gateway, ignored
  // in a put. A put that names a control room among its rooms ends it.
  //
  // uncontrolled_by is erased at the home's wipe with the record of who did what in the home
  // (webrtc.v1 household.proto, WIPE); uncontrolled_since stays with the zone, which describes
  // the house.
  //
  // For a home's zone — one left uncontrolled stays whose it was — sent only to the home's
  // household admins (access.v1.MEMBERSHIP_RELATION_HOUSEHOLD_ADMIN) and an installer under a
  // commissioning grant on the home, and unset for the home's other residents; never sent to
  // service. Unset, too, when it dates from before the recipient's current residency in the
  // home, or from a home they did not live in at the time (see access.v1.MembershipRelation).
  // While the home is empty (webrtc.v1 household.proto, EMPTY HOME), the property owner and the
  // gateway administrators who reach it are sent uncontrolled_since, never uncontrolled_by (see
  // the file comment).
  // For a zone outside homes, sent to whoever is given the zone. That rooms is empty, or
  // control_room_id unset, is what says the zone is uncontrolled; these say only since when
  // and by whom, where the recipient is given them.
  google.protobuf.Timestamp uncontrolled_since = 8;
  kusinta.iot.identity.v1.UserId uncontrolled_by = 9;
}

message FloorZoneRoom {
  kusinta.iot.identity.v1.SpaceId room_id = 1;

  // This room's share of the zone's loop area, in thousandths.
  uint32 area_share_permille = 2;
}

// An electric load kept warm for comfort rather than heating a room to a target — a heated
// bathroom floor, a towel heater — run inside its time windows. Its output's contact closed
// means the load may heat under its own thermostat, and it rests closed: when the gateway is
// gone the load works as it did before.
message ComfortLoad {
  // Assigned by the gateway, unique among heating records; empty when creating.
  string comfort_load_id = 1;

  kusinta.iot.identity.v1.SpaceId room_id = 2;
  string name = 3;
  ContactBinding output = 4;

  // When the load may heat: the union of its windows, at most 16. Empty: only when the
  // plan allows it for price. Set with SetComfortWindows, never in a put, which keeps them.
  // While the building's time zone is not known (space.v1.Space.time_zone unset) no window
  // applies and the load is left at rest, heating under its own thermostat.
  repeated ComfortWindow windows = 5;

  // See the file comment.
  uint64 revision = 6;

  // Set by the gateway and bumped by every SetComfortWindows; see SetComfortWindows.
  uint64 windows_revision = 7;

  // Set when windows is left out for the recipient — an installer under a commissioning
  // grant — so that an empty list is not read as "only when the plan allows it for price".
  bool windows_withheld = 8;
}

// A recurring stretch of the building's local day (space.v1.Space.time_zone).
message ComfortWindow {
  // The days it starts on: bit 0 Monday through bit 6 Sunday, at least one, no higher bit.
  // Not Matter's day bitmap, which starts on Sunday.
  uint32 weekdays = 1;

  // Minutes after local midnight: start 0–1439, end 1–1440 and exclusive, never equal, so 0
  // to 1440 is a whole day. A window whose end is before its start runs past midnight into
  // the next day.
  //
  // On a day that changes to or from daylight saving, minutes are local wall-clock time: a
  // start or end in the skipped hour falls at the first minute after it, and a repeated
  // hour counts once, at its first occurrence.
  uint32 start_minute = 2;
  uint32 end_minute = 3;
}

// The heating records a caller may see under a space, in reply to ListHeating.
message HeatingLayout {
  repeated HeatingPlant plants = 1;
  repeated HeatingCircuit circuits = 2;
  repeated FloorZone floor_zones = 3;
  repeated ComfortLoad comfort_loads = 4;
}

// One heating record as stored, in reply to a put.
message HeatingRecord {
  oneof record {
    HeatingPlant plant = 1;
    HeatingCircuit circuit = 2;
    FloorZone floor_zone = 3;
    ComfortLoad comfort_load = 4;
  }
}

// PRICE RULES. A price rule steers one lever of a heat source by the price of electricity, by
// rules fixed in advance rather than by an optimiser's plan. Each runs per plant, judges the
// rooms it heats by their comfort band (climate.v1.ComfortPreference, THE BAND), and is switched
// per plant (PriceRuleMode). Every safety rule holds over each, whatever its mode: the plant's
// block cap and the compressor's rules ("plant.max_block_minutes", commissioning.v1 BLOCKS ON A
// COMPRESSOR); the leases and rest states (see the file comment); a running commissioning test,
// which takes the output it drives; and the public-health floor (ComfortPreference, THE BAND).
//
// WHO SWITCHES THEM.
//   * A plant in a home: its household admins (access.v1.MEMBERSHIP_RELATION_HOUSEHOLD_ADMIN), and
//     an installer under a commissioning grant covering the home (commissioning.v1, GRANTS).
//     Consent to have a home's own heat source driven LIVE is its household's.
//   * A plant outside homes: the property owner and the gateway's administrators who reach its
//     space, and an installer under a commissioning grant covering it.
// Nobody else, whatever else they may set of the plant.
//
// A plant's rules start OFF. Rollout note: a gateway that ran a rule in shadow by a setting of its
// own, before this contract, starts that rule SHADOW instead on each plant it ran it for, so that
// the evidence a shadow gathers runs on across the upgrade; SHADOW drives nothing, so no consent is
// presumed. No other rule starts anywhere but OFF, and none starts LIVE.
// Every change is recorded (PriceRuleChange): a record of what
// happened, never rewritten, and corrected by a newer change.
//
// HEAT BLOCKS. A block is a stretch of time in which a price rule holds closed an input of the
// plant that blocks heat (HeatPumpControl.add_on_heater_block, sg_ready_block), or, in SHADOW,
// would have. Each is recorded (HeatBlock) with why it started and how it ended. A plant's
// blocks are released by hand (webrtc.v1.ReleaseHeatBlock): every LIVE block under way ends,
// and the plant's blocking rules start no LIVE block until the hold the release states runs out
// (HeatBlockRelease). Only the plant's blocks are released: a floor zone a rule holds off is
// not a heat block, and is told by its rooms' explanations (climate.v1.ClimateExplanation).
//
// WHO SEES THEM. A plant's blocks, releases and changes of mode (HeatBlockStatus,
// HeatBlockHistory), and a home's shadow summary (ShadowSummary):
//   * of a plant in a home: its residents only, from the start of their current residency
//     (access.v1.MembershipRelation). Never service, never the property owner or the gateway
//     administrators, the home empty or not, and never an installer under a commissioning grant,
//     which covers no history of a home (commissioning.v1, GRANTS). The blocks, the releases and
//     the shadow summary are part of the home's climate history: erased by its household's Clear
//     history and by its wipe (webrtc.v1 household.proto, CLIMATE HISTORY, WIPE). The record of
//     changes of mode goes at the wipe;
//   * of a plant outside homes: the property owner and the gateway's administrators who reach
//     its space, and technicians who reach it, who may release its blocks; never a resident as
//     such. A shared plant's blocks never tell one home's comfort to anyone: an end caused by a
//     room in a home is told only where at least three homes share the plant, as
//     climate.v1.ClimateExplanationKind tells a shared cause, and otherwise as
//     HEAT_BLOCK_END_UNSTATED.
// Blocks, releases and changes are kept for 25 months, as a plant's hours are
// (climate.v1.PlantHistory); a shadow summary for 180 days, as a room's quarter hours are.

// A price rule (PRICE RULES). A closed list that grows only by a release of this schema: a
// client words a rule it does not know as a price rule, unnamed, and offers no switch for it.
enum PriceRule {
  // Not stated, or a rule this client's schema does not know. Refused in a request.
  PRICE_RULE_UNSPECIFIED = 0;

  // Blocks the add-on heater (HeatPumpControl.add_on_heater_block) in the day's dearest quarter
  // hours, the compressor running on: each block within "plant.max_block_minutes"
  // (commissioning.v1), and ended early where a room it heats falls below its comfort band or,
  // where the plant reports it, its hot water runs low. A blocking rule.
  PRICE_RULE_ADD_ON_HEATER_BLOCK = 1;

  // Heats the plant's floor zones (FloorZone) ahead in cheap quarter hours, within the top of
  // their rooms' comfort band, and holds them off in dear ones, within its bottom. Holds no input
  // of the plant: not a blocking rule.
  PRICE_RULE_FLOOR_PRE_HEAT = 2;

  // Raises the heat source's hot water in cheap quarter hours (HeatPumpControl.sg_ready_boost),
  // so that the tank is full before dear ones; never during a block. Not a blocking rule.
  PRICE_RULE_HOT_WATER = 3;
}

// How a price rule runs on a plant.
enum PriceRuleMode {
  // Not stated, or a mode this client's schema does not know: read as OFF. Refused in a
  // request.
  PRICE_RULE_MODE_UNSPECIFIED = 0;

  // The rule decides nothing and drives nothing. A plant's rules start OFF, save as the rollout
  // note under PRICE RULES (WHO SWITCHES THEM) says.
  PRICE_RULE_MODE_OFF = 1;

  // The rule decides as LIVE would and records what it decided (HeatBlock, ShadowSummary), but
  // drives nothing, so that its saving, and any comfort it would have cost, can be judged before
  // it goes live. Needs no input bound, and no hold applies to it.
  PRICE_RULE_MODE_SHADOW = 2;

  // The rule decides and drives. It drives only while the gateway may drive the input it steers:
  // bound, under a current pass of its commissioning test, the plant's feature not blocked
  // (commissioning.v1 FEATURE_PLANT), "plant.max_block_minutes" answered for a blocking rule, and
  // no hold running (HeatBlockRelease). Meanwhile it drives nothing and stays LIVE, and the
  // plant's feature status says why. A rule is put LIVE only while the input it steers is bound
  // (webrtc.v1.SetPriceRuleMode).
  PRICE_RULE_MODE_LIVE = 3;
}

// One change of a price rule's mode on a plant (PRICE RULES, WHO SWITCHES THEM); as
// HeatingPlant.price_rules, the mode the latest change left the rule in.
message PriceRuleChange {
  PriceRule rule = 1;

  // The mode it set, and the mode before it: before a rule's first change, the mode it started in
  // (WHO SWITCHES THEM).
  PriceRuleMode mode = 2;
  PriceRuleMode previous_mode = 3;

  google.protobuf.Timestamp at = 4;

  // The role its setter acted in: ROLE_RESIDENT for a household admin of the home,
  // ROLE_TECHNICIAN for an installer under a commissioning grant, otherwise ROLE_PROPERTY_OWNER
  // where they hold it, else ROLE_GATEWAY_ADMIN. UNSPECIFIED, with set_by unset, for a change the
  // gateway made itself: a home's wipe taking a LIVE rule back to SHADOW (webrtc.v1
  // household.proto, WIPE).
  kusinta.iot.access.v1.Role set_by_role = 5;

  // Who set it. For a plant in a home, given to its residents, and unset when it dates from
  // before their current residency; to an installer, only on a change of their own. For a plant
  // outside homes, given to the property owner and the gateway administrators. Unset to anyone
  // else, set_by_role kept.
  kusinta.iot.identity.v1.UserId set_by = 6;
}

// How a heat block ended (HeatBlock.end).
enum HeatBlockEnd {
  // Under way, or a cause this client's schema does not know: an app shows that it ended,
  // without a cause.
  HEAT_BLOCK_END_UNSPECIFIED = 0;

  // It ran to the end its rule planned for it.
  HEAT_BLOCK_END_PLANNED = 1;

  // A room the plant heats fell below its comfort band (climate.v1.ComfortPreference, THE
  // BAND).
  HEAT_BLOCK_END_ROOM_BELOW_BAND = 2;

  // The plant's hot water ran low, where the plant reports it.
  HEAT_BLOCK_END_HOT_WATER_LOW = 3;

  // Released by hand (webrtc.v1.ReleaseHeatBlock; HeatBlockRelease).
  HEAT_BLOCK_END_RELEASED = 4;

  // Its rule's mode changed (PriceRuleChange).
  HEAT_BLOCK_END_RULE_SWITCHED = 5;

  // The gateway stopped holding it for a cause of its own: the input could no longer be driven
  // (PRICE_RULE_MODE_LIVE), a commissioning test took it, or the gateway restarted.
  HEAT_BLOCK_END_INTERRUPTED = 6;

  // Ended early for a cause not told to the recipient (WHO SEES THEM).
  HEAT_BLOCK_END_UNSTATED = 7;
}

// One heat block (HEAT BLOCKS).
message HeatBlock {
  // Assigned by the gateway, opaque.
  string block_id = 1;

  // The rule that started it, and its mode then: LIVE held the input, SHADOW only decided to.
  PriceRule rule = 2;
  PriceRuleMode mode = 3;

  // Why it started, as a room's explanation names the cause (climate.v1.ClimateExplanationKind;
  // subject ADD_ON_HEATER for the add-on heater): PRICE_HIGH for dear hours. A kind the client
  // does not know is shown as a block without a cause.
  kusinta.iot.climate.v1.ClimateExplanationKind reason = 4;

  google.protobuf.Timestamp started_at = 5;

  // The end its rule planned for it, within "plant.max_block_minutes".
  google.protobuf.Timestamp planned_end_at = 6;

  // When it ended, and how. Both unset while it is under way.
  google.protobuf.Timestamp ended_at = 7;
  HeatBlockEnd end = 8;
}

// One release of a plant's blocks by hand (webrtc.v1.ReleaseHeatBlock), and the hold it set.
message HeatBlockRelease {
  google.protobuf.Timestamp at = 1;

  // Until when the plant's blocking rules start no LIVE block. Unset: the release ended a hold
  // early, and blocks may start again as the rules plan them.
  google.protobuf.Timestamp hold_until = 2;

  // The blocks under way that it ended (HeatBlock.block_id).
  repeated string ended_block_ids = 3;

  // The role its maker acted in — ROLE_RESIDENT on a plant in a home; ROLE_PROPERTY_OWNER,
  // ROLE_GATEWAY_ADMIN or ROLE_TECHNICIAN on one outside homes — and who they are, given as
  // PriceRuleChange.set_by is.
  kusinta.iot.access.v1.Role set_by_role = 4;
  kusinta.iot.identity.v1.UserId set_by = 5;
}

// A plant's blocks as they stand now: what is blocked, by which rule and why, and the hold a
// release set. Given as WHO SEES THEM says, in reply to webrtc.v1.ListHeatBlockStatus and
// webrtc.v1.ReleaseHeatBlock, and pushed (webrtc.v1 GatewayMessage.heat_block_status) to the
// sessions given it whenever a block starts or ends, or a hold begins, changes or ends. Apply as
// an upsert keyed on plant_id.
message HeatBlockStatus {
  string plant_id = 1;

  // The plant's space and name, so that a technician who is not given the plant record knows
  // which plant it is.
  kusinta.iot.identity.v1.SpaceId space_id = 2;
  string plant_name = 3;

  // The blocks under way, LIVE and SHADOW, at most one per rule and mode. Empty: none.
  repeated HeatBlock current = 4;

  // The release whose hold runs now. Unset: none.
  HeatBlockRelease hold = 5;

  // The plant's rules and their modes, as HeatingPlant.price_rules, so that whoever may release
  // a block is told whether a rule is LIVE.
  repeated PriceRuleChange price_rules = 6;
}

// The answer to webrtc.v1.ListHeatBlockStatus.
message HeatBlockStatuses {
  repeated HeatBlockStatus statuses = 1;
}

// A plant's blocks, releases and changes of mode over a range, in reply to
// webrtc.v1.GetHeatBlockHistory. Blocks in order of started_at, releases and changes in order
// of at.
message HeatBlockHistory {
  string plant_id = 1;

  // The earliest time the gateway still holds of this plant's records that the recipient may
  // read: for a plant in a home, no earlier than the start of their current residency, nor than
  // the home's last Clear history (space.v1.Space.climate_history_cleared_at). Nothing before it
  // is returned.
  google.protobuf.Timestamp kept_from = 2;

  repeated HeatBlock blocks = 3;
  repeated HeatBlockRelease releases = 4;
  repeated PriceRuleChange rule_changes = 5;
}

// One day of one price rule scored against one comfort band (ShadowBandSeries): what the rule,
// had it been live with that band, would have saved, and what it would have cost in comfort. A
// day is the building's local date (space.v1.Space.time_zone), cut as
// climate.v1.CLIMATE_SUMMARY_PERIOD_DAY is, and given only once the gateway has scored it, never
// before it ends. A day on which the building's time zone was unknown is not scored.
message ShadowDay {
  // The local date, as an ISO 8601 calendar date (YYYY-MM-DD).
  string date = 1;

  // The saving, in millionths of a euro, the currency day-ahead prices are in
  // (planning.v1.PriceInterval): the cost of the energy the rule would have moved or avoided, at
  // the prices it decided by, with the recovery cost already taken off. Negative: it would have
  // cost more than it saved. A client converts it as it converts prices
  // (planning.v1.ExchangeRate).
  sint64 net_saving_micro_eur = 2;

  // The cost, in millionths of a euro, of making up afterwards for what was blocked or coasted:
  // already taken off net_saving_micro_eur, and told so that a client may show both.
  sint64 recovery_cost_micro_eur = 3;

  // The quarter hours of the day the rule would have blocked or coasted.
  uint32 blocked_quarters = 4;

  // The quarter hours of the day in which at least one room the rule judges was, or was
  // predicted to be, below the band's low edge (a breach), and above its high edge
  // (overheated). A quarter hour in which a room's window was open is not counted for that room.
  uint32 breach_quarters = 5;
  uint32 overheat_quarters = 6;

  // The quarter hours of the day that had no price, in which the rule decided nothing: all of
  // them on a day with no price at all, when every other count is 0.
  uint32 no_price_quarters = 7;
}

// One price rule of one plant of a home, scored day by day against one comfort band.
message ShadowBandSeries {
  string plant_id = 1;
  PriceRule rule = 2;

  // The band scored, as a comfort preference gives one (climate.v1.ComfortPreference, THE
  // BAND), in centidegrees. Which bands are scored is the gateway's choice: a set the same for
  // every home, the presets' among them, and besides it the home's own chosen band where that
  // is outside the set, from the day it is chosen. A band the home chose before and no longer
  // holds keeps the days scored while it held it.
  uint32 below_target_centidegrees = 3;
  uint32 above_target_centidegrees = 4;

  // In order of date.
  repeated ShadowDay days = 5;
}

// What a home's price rules would have saved, and cost in comfort, under each band the gateway
// scores, so that the household can choose its comfort preference knowing what each would bring
// (climate.v1.ComfortPreference). In reply to webrtc.v1.GetShadowSummary. The household's data,
// given as WHO SEES THEM says of a plant in a home: to the home's residents only, never to
// service, the property owner, the gateway's administrators, an installer under a commissioning
// grant or another home; erased by the household's Clear history and by the home's wipe.
message ShadowSummary {
  kusinta.iot.identity.v1.SpaceId home_id = 1;

  // The earliest date still held that the recipient may read: no earlier than the first whole
  // day of their current residency, nor than the first whole day after the home's last Clear
  // history. An ISO 8601 calendar date; empty where nothing is held for them.
  string kept_from = 2;

  // One per plant, rule and band scored, ordered by plant, rule, then below_target: of the home's
  // own plants (HeatingPlant.space_id the home) only, each rule while it ran in SHADOW or LIVE.
  // A plant outside homes is scored for no home. Empty where none is held.
  repeated ShadowBandSeries series = 3;
}
