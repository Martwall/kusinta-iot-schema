syntax = "proto3";

package kusinta.iot.heating.v1;

import "google/protobuf/timestamp.proto";
import "kusinta/iot/access/v1/acl.proto";
import "kusinta/iot/access/v1/roles.proto";
import "kusinta/iot/climate/v1/climate.proto";
import "kusinta/iot/device/v1/cluster_state.proto";
import "kusinta/iot/device/v1/device.proto";
import "kusinta/iot/identity/v1/identity.proto";
import "kusinta/iot/planning/v1/planning.proto";

option optimize_for = SPEED;

// What heats a space, and which device outputs the building-server gateway may drive to
// steer it: plants (heat sources), their circuits, the floor zones on a floor circuit and
// the rooms each zone heats, and the comfort loads in rooms.
//
// No device is part of the heating by being filed in a room. A relay is nothing to the
// heating until a record here binds one of its outputs to a role.
//
// Records are flat: a circuit names its plant, a floor zone its circuit, a comfort load its
// room. Each is put, revisioned and authorized on its own, so a zone mapping, a plant's
// inputs and a comfort load are edited by whoever may edit that record without touching
// the others. Every record carries a revision, set by the gateway and bumped by every
// change to it except a comfort load's windows, which have a revision of their own; a put
// that replaces a record, and a remove, names the revision it acts on. Ids are assigned by
// the gateway, unique among heating records, opaque and not sequential.
//
// Who may see and change them goes by the rooms a record names, not by the plant's space.
// All of a floor zone's rooms lie in one home, or all lie outside homes. A floor zone or
// comfort load naming a room in a home is that home's: given only to its residents and to
// an installer under a commissioning grant on that home (commissioning.v1.CommissioningGrant),
// changed by a household admin of the home (access.v1.MEMBERSHIP_RELATION_HOUSEHOLD_ADMIN) or
// that installer, whatever space its plant serves. Such a record may name a
// parent the caller cannot see — a circuit of a central plant — as a bare id: a layout may
// hold it without its parent, and a put of it needs no rights over the parent. Moving a
// zone to another circuit does. Residents set a comfort load's windows; an installer under a
// commissioning grant is given the comfort load without them (windows_withheld), since a
// grant covers no comfort settings. A caller who reaches the home as service gets none of
// these records, and a request naming one is refused as NOT_ENTITLED, however it is named —
// save that while the home is empty (webrtc.v1 household.proto, EMPTY HOME), the property owner
// and the gateway administrators who reach it are given its floor zones, not its plants,
// circuits or comfort loads, with FloorZone.uncontrolled_since but without uncontrolled_by, and
// may change a zone's rooms and control room as webrtc.v1 management.proto (PutFloorZone) says.
// A plant and its circuits are given to and changed by whoever holds those rights over the
// plant's space: in a home as above; outside homes, the property owner and the gateway's
// administrators.
//
// A zone relay at a central manifold is filed in the home it serves, on its apartment, wherever
// it physically hangs (webrtc.v1.PlaceDeviceInSpace). It is then the home's device: its state
// is withheld from service as any device's in a home is (access.v1.MembershipRelation), and its
// outputs are bound by those who bind the home's — its household admins, or an installer whose
// commissioning grant covers the home — so its binding never crosses a home's boundary
// (webrtc.v1 management.proto, HEATING ACROSS A HOME). One device serves one home: a relay
// whose channels would serve two homes cannot be bound to both, and each home has a relay of
// its own.
//
// The gateway drives a bound output away from rest only while it holds a current pass of its
// commissioning test (commissioning.v1, TEST_KIND_OUTPUT_LEASE), and only while its producer
// states it as leased (device.v1.LeasedWrite) with a lapse value that leaves the contact where
// its role rests. That is checked each time it drives, not only when the output is bound: an
// output whose producer stops stating it so, or whose device is gone, is not driven until that
// changes.
//
// UNCONTROLLED ZONES. A deletion drops the rooms it deletes from every floor zone that names
// them, the area shares of the rooms each keeps made whole again in proportion, and clears a
// zone's control room if that went (webrtc.v1 management.proto, HEATING ACROSS A HOME). A
// zone whose rooms all go keeps its output binding, with no room, until a put names rooms
// again — where the deletion leaves it whose it was; one the deletion would carry across a
// home's boundary goes as management.proto says. A floor zone is uncontrolled while it has
// no room, or no control room: none named, or the one named no longer within its plant's
// space. An uncontrolled zone is not driven until a put names a control room among its rooms
// (a put names both, and is refused without them). Not driven, its output is at rest, and a
// floor zone rests closed — on normally-closed wiring, the output off — so it heats without
// control, capped only by its circuit's supply limiter (FloorZone.uncontrolled_since;
// reporting.v1.PROBLEM_KIND_FLOOR_ZONE_UNCONTROLLED).
//
// No record reaches across a home's boundary: a change that would leave one so is refused or
// undone as webrtc.v1 management.proto (HEATING ACROSS A HOME) says. A binding across it, or a
// floor zone split by it, stored before that rule is undone once, when the gateway starts
// (management.proto, START-UP); a binding across it is never driven or read for its record
// meanwhile, and blocks its feature (commissioning.v1.BLOCK_REASON_DEVICE_ACROSS_HOME). When an output stops being bound — its
// record removed, or a put binding another output in its place — the gateway writes its lapse
// value, ending any lease at once; where the device cannot be reached then, the lease running
// out returns it to rest, and that is the guarantee.

// One attribute of one device: what a role reads or writes. Endpoint_id is required on the
// Matter branch of the attribute here — an absent endpoint is refused, never read as the
// root node.
message DeviceAttribute {
  kusinta.iot.identity.v1.DeviceId device_id = 1;
  kusinta.iot.access.v1.AttributeRef attribute = 2;
}

// One device output switching one contact on the heating side: a floor zone's thermostat
// input, a heat-source input, a comfort load's supply.
message ContactBinding {
  // OnOff on a relay channel, or a vendor parameter.
  DeviceAttribute output = 1;

  // The value of the output with which the contact is closed. A wiring fact, not a device
  // fact: a changeover relay wired through its normally closed contact closes it with the
  // channel off, so OnOff false. The producer cannot know it; whoever wires the relay
  // states it, and the gateway reads every state of the role through it — never from the
  // output's value alone.
  //
  // Each role has a fixed rest state (see the role), and the output's lapse value
  // (device.v1.LeasedWrite.lapse_value), read through this value, must leave the contact
  // where the role rests. Every comparison with this value matches type as well as value:
  // an int 0 is not a bool false.
  kusinta.iot.device.v1.AttributeValue closed_value = 2;
}

enum HeatSourceKind {
  HEAT_SOURCE_KIND_UNSPECIFIED = 0;
  HEAT_SOURCE_KIND_EXHAUST_AIR_HEAT_PUMP = 1;
  HEAT_SOURCE_KIND_GROUND_SOURCE_HEAT_PUMP = 2;
  HEAT_SOURCE_KIND_AIR_WATER_HEAT_PUMP = 3;
  HEAT_SOURCE_KIND_DISTRICT_HEATING = 4;
  HEAT_SOURCE_KIND_ELECTRIC_BOILER = 5;
  HEAT_SOURCE_KIND_FUEL_BOILER = 6;
}

// One heat source.
message HeatingPlant {
  // Assigned by the gateway, unique among heating records; empty when creating.
  string plant_id = 1;

  // The space the plant serves: a home, or a space outside homes for a central plant.
  kusinta.iot.identity.v1.SpaceId space_id = 2;

  string name = 3;
  HeatSourceKind source = 4;

  // The device the heat source's own readings come from — its temperatures, compressor and
  // hot-water state — when it has one; its temperatures are the device's
  // device.v1.HeatSourceReadings. Read only: the gateway drives a heat source through the
  // plant's control, never through this device.
  kusinta.iot.identity.v1.DeviceId readings_device_id = 5;

  // How the gateway steers the heat source. Unset: it does not; the plant is read only. A
  // control set binds at least one input.
  oneof control {
    HeatPumpControl heat_pump = 6;
  }

  // The electricity or heat meter the plant is measured by.
  DeviceAttribute meter = 7;

  // See the file comment.
  uint64 revision = 8;

  // Every price rule the gateway runs for this plant, each once, with its mode as it stands:
  // the latest change of each (PriceRuleChange), OFF included. A rule not listed is one the
  // gateway does not run for this plant, and a client offers no switch for it. A rule whose mode
  // was never set is listed in the mode it started in — OFF, or SHADOW as the rollout note under
  // PRICE RULES (WHO SWITCHES THEM) says — with at, set_by_role and set_by unset.
  //
  // Read-only: set with webrtc.v1.SetPriceRuleMode, never in a put, which keeps them and ignores
  // them, and does not bump revision. Sent to whoever is given the plant, set_by as
  // PriceRuleChange says. An app tells a gateway that predates price rules by an empty list with
  // price_rules_revision 0, and offers no switch.
  repeated PriceRuleChange price_rules = 9;

  // Set by the gateway and bumped by every change of price_rules; see webrtc.v1.SetPriceRuleMode.
  uint64 price_rules_revision = 10;
}

// A heat pump's control inputs.
message HeatPumpControl {
  // The SG Ready inputs, by what each means closed alone: sg_ready_block closed alone
  // blocks the heat pump, sg_ready_boost closed alone recommends running harder, both
  // closed commands it to, and both open is normal operation. Both rest open, so a lapsed
  // lease or a stopped gateway leaves the heat pump running normally. Bound together or not
  // at all.
  //
  // They lapse separately, so their leases are ordered: while both are closed, the gateway
  // gives sg_ready_block no longer a lease than sg_ready_boost, so the heat pump never passes
  // through "blocked" on its way back to normal. In general, of inputs held together, one that
  // holds heat back (a blocking input, or curve_adjustment where its steps are negative) never
  // lapses after one that asks for more (sg_ready_boost, or curve_adjustment where its steps
  // are positive). Among inputs that only hold heat back the order is free: each lapse alone
  // gives back what it held.
  ContactBinding sg_ready_block = 1;
  ContactBinding sg_ready_boost = 2;

  // The input that blocks the heat pump's add-on (electric) heater while closed. Rests
  // open: the add-on heater is allowed.
  ContactBinding add_on_heater_block = 3;

  // The inputs below are bound by what each does at the heat source, as its installer set
  // the input there (NIBE: an AUX input's function, menu 5.4), never by a vendor's composite
  // state: an SG Ready state may mean more on one model than another (on one heat pump,
  // "low price" brings in its add-on heater), and a rule drives only what it means to.
  // Either may be bound without the SG Ready inputs, and they without it.

  // The input that blocks the heat source's hot-water production while closed: no charge of
  // its tank starts, and one under way stops, while space heating runs on. Rests open: hot
  // water is made as the heat source decides. A blocking input (HEAT BLOCKS). Stopping a
  // charge under way may stop the compressor, so it is held to the rules of a block that
  // stops it (commissioning.v1, BLOCKS ON A COMPRESSOR).
  ContactBinding hot_water_block = 4;

  // The input that moves the heat source's curve by its external adjustment while closed:
  // the supply it aims for shifts by the steps set at the heat source for that input
  // ("plant.curve_adjustment_steps", commissioning.v1), up or down as they are signed. Rests
  // open: the curve as set. Not a blocking input. The heat source's own report of it, where
  // it gives one, is device.v1.HeatSourceReadings.external_adjustment_active.
  ContactBinding curve_adjustment = 5;
}

// One heating circuit of a plant. Supply temperature and its cap are per circuit.
message HeatingCircuit {
  // Assigned by the gateway, unique among heating records; empty when creating.
  string circuit_id = 1;

  string plant_id = 2;
  string name = 3;

  oneof distribution {
    RadiatorCircuit radiator = 4;
    FloorCircuit floor = 5;
  }

  // See the file comment.
  uint64 revision = 6;
}

// Whether a circuit is fed through a mixing valve, as its installer states it.
//
// SUPPLY. What heats a circuit's radiators or slab is the water entering it. Where a circuit is
// UNMIXED, fed straight from its heat source, that is the heat source's own measured supply,
// less a little pipe loss (not the supply it aims for, and not while it heats hot water, when its
// flow goes to the tank), and the gateway may use the heat source's reading for it. Where it is
// MIXED, or a floor circuit's mixing is not stated (CIRCUIT_MIXING_UNSPECIFIED), the water is
// cooler than the heat source makes and only a supply probe
// after the mixer says what it is: without one, a model of what the circuit heats cannot be
// fitted on its heated quarters. A return probe is never required: without one a circuit is
// modelled on its rooms alone.
enum CircuitMixing {
  // Not stated. Read for the supply as the usual case for the circuit's kind: a floor circuit as
  // MIXED (the heat source's reading is not used), a radiator circuit as UNMIXED (it is). An
  // installer's answer always wins.
  CIRCUIT_MIXING_UNSPECIFIED = 0;
  // A mixing (shunt) valve blends return water into the circuit's supply.
  CIRCUIT_MIXING_MIXED = 1;
  // No mixing valve: the circuit takes the heat source's supply as it is.
  CIRCUIT_MIXING_UNMIXED = 2;
}

// A radiator circuit. Its valves belong to the rooms (climate.v1.RoomClimate).
message RadiatorCircuit {
  // As stated by its installer (CircuitMixing, SUPPLY). Usually UNMIXED, and read so while not
  // stated.
  CircuitMixing mixing = 1;

  // A probe on the supply after the mixer, as FloorCircuit.supply_probe names one: needed only
  // where the circuit is stated MIXED, for its supply to be known.
  DeviceAttribute supply_probe = 2;
}

// Hydronic floor heating: its own pump, mixing and supply cap, and the floor zones on its
// manifold.
message FloorCircuit {
  // Whether a mixing valve feeds the circuit. Superseded by mixing, which can also say that it is
  // not stated: a client that sets mixing sets this to mixing == MIXED, and a gateway reading a
  // circuit whose mixing is UNSPECIFIED takes this true as MIXED and false as not stated, never as
  // UNMIXED, since false is also what a client that never asked sends.
  bool mixing_valve = 1;

  // As stated by its installer (CircuitMixing, SUPPLY).
  CircuitMixing mixing = 5;

  // The supply temperature its self-acting limiter caps it at, in centidegrees. Absent: not
  // known, never 0 °C.
  optional sint32 supply_cap_centidegrees = 2;

  // Probes on the supply (after mixing) and the return. Each names the Matter Temperature
  // Measurement cluster's MeasuredValue (cluster 0x0402, attribute 0x0000, in centidegrees) on
  // the probe's endpoint; a put naming any other attribute, or a vendor parameter, is refused as
  // INVALID_REQUEST, so that every reading of a probe is a temperature in one unit.
  DeviceAttribute supply_probe = 3;
  DeviceAttribute return_probe = 4;
}

// One loop or group of loops on a floor circuit's manifold, switched by one output on its
// wiring centre's thermostat input. The output's contact closed means the zone heats, and it
// rests closed: when the gateway is gone the zone heats, capped only by the circuit's supply
// limiter.
message FloorZone {
  // Assigned by the gateway, unique among heating records; empty when creating.
  string zone_id = 1;

  // A FLOOR circuit.
  string circuit_id = 2;

  // As marked on the manifold or the drawing ("SL 2").
  string name = 3;

  ContactBinding output = 4;

  // The rooms the zone heats, each a room within its plant's space, listed once, with a
  // share above 0 and shares summing to 1000. A zone may heat several rooms and a room may
  // be heated by several zones. A put names at least one; empty only for a zone whose rooms
  // were all deleted, which is uncontrolled (see the file comment, UNCONTROLLED ZONES).
  repeated FloorZoneRoom rooms = 5;

  // One of rooms. Only its error, its sensor and its open window steer the zone. A put names
  // one; unset only once a deletion cleared it, and always while rooms is empty. A zone
  // without one is uncontrolled (see the file comment, UNCONTROLLED ZONES).
  kusinta.iot.identity.v1.SpaceId control_room_id = 6;

  // See the file comment.
  uint64 revision = 7;

  // While the zone is uncontrolled — no room, or no control room (see the file comment,
  // UNCONTROLLED ZONES): since when it has been so, and the user whose change left it so — the
  // deletion of its control room or its last room; uncontrolled_by is unset where no user's
  // change did. Both unset while the zone is controlled. Read-only: set by the gateway, ignored
  // in a put. A put that names a control room among its rooms ends it.
  //
  // uncontrolled_by is erased at the home's wipe with the record of who did what in the home
  // (webrtc.v1 household.proto, WIPE); uncontrolled_since stays with the zone, which describes
  // the house.
  //
  // For a home's zone — one left uncontrolled stays whose it was — sent only to the home's
  // household admins (access.v1.MEMBERSHIP_RELATION_HOUSEHOLD_ADMIN) and an installer under a
  // commissioning grant on the home, and unset for the home's other residents; never sent to
  // service. Unset, too, when it dates from before the recipient's current residency in the
  // home, or from a home they did not live in at the time (see access.v1.MembershipRelation).
  // While the home is empty (webrtc.v1 household.proto, EMPTY HOME), the property owner and the
  // gateway administrators who reach it are sent uncontrolled_since, never uncontrolled_by (see
  // the file comment).
  // For a zone outside homes, sent to whoever is given the zone. That rooms is empty, or
  // control_room_id unset, is what says the zone is uncontrolled; these say only since when
  // and by whom, where the recipient is given them.
  google.protobuf.Timestamp uncontrolled_since = 8;
  kusinta.iot.identity.v1.UserId uncontrolled_by = 9;
}

message FloorZoneRoom {
  kusinta.iot.identity.v1.SpaceId room_id = 1;

  // This room's share of the zone's loop area, in thousandths.
  uint32 area_share_permille = 2;
}

// An electric load kept warm for comfort rather than heating a room to a target — a heated
// bathroom floor, a towel heater — run inside its time windows. Its output's contact closed
// means the load may heat under its own thermostat, and it rests closed: when the gateway is
// gone the load works as it did before.
message ComfortLoad {
  // Assigned by the gateway, unique among heating records; empty when creating.
  string comfort_load_id = 1;

  kusinta.iot.identity.v1.SpaceId room_id = 2;
  string name = 3;
  ContactBinding output = 4;

  // When the load may heat: the union of its windows, at most 16. Empty: only when the
  // plan allows it for price. Set with SetComfortWindows, never in a put, which keeps them.
  // While the building's time zone is not known (space.v1.Space.time_zone unset) no window
  // applies and the load is left at rest, heating under its own thermostat.
  repeated ComfortWindow windows = 5;

  // See the file comment.
  uint64 revision = 6;

  // Set by the gateway and bumped by every SetComfortWindows; see SetComfortWindows.
  uint64 windows_revision = 7;

  // Set when windows is left out for the recipient — an installer under a commissioning
  // grant — so that an empty list is not read as "only when the plan allows it for price".
  bool windows_withheld = 8;
}

// A recurring stretch of the building's local day (space.v1.Space.time_zone).
message ComfortWindow {
  // The days it starts on: bit 0 Monday through bit 6 Sunday, at least one, no higher bit.
  // Not Matter's day bitmap, which starts on Sunday.
  uint32 weekdays = 1;

  // Minutes after local midnight: start 0–1439, end 1–1440 and exclusive, never equal, so 0
  // to 1440 is a whole day. A window whose end is before its start runs past midnight into
  // the next day.
  //
  // On a day that changes to or from daylight saving, minutes are local wall-clock time: a
  // start or end in the skipped hour falls at the first minute after it, and a repeated
  // hour counts once, at its first occurrence.
  uint32 start_minute = 2;
  uint32 end_minute = 3;
}

// The heating records a caller may see under a space, in reply to ListHeating.
message HeatingLayout {
  repeated HeatingPlant plants = 1;
  repeated HeatingCircuit circuits = 2;
  repeated FloorZone floor_zones = 3;
  repeated ComfortLoad comfort_loads = 4;
}

// One heating record as stored, in reply to a put.
message HeatingRecord {
  oneof record {
    HeatingPlant plant = 1;
    HeatingCircuit circuit = 2;
    FloorZone floor_zone = 3;
    ComfortLoad comfort_load = 4;
  }
}

// PRICE RULES. A price rule steers one lever of a heat source by the price of electricity, by
// rules fixed in advance rather than by an optimiser's plan. Each runs per plant, judges the
// rooms it heats by their comfort band (climate.v1.ComfortPreference, THE BAND), and is switched
// per plant (PriceRuleMode). Every safety rule holds over each, whatever its mode: the plant's
// block cap and the compressor's rules ("plant.max_block_minutes", commissioning.v1 BLOCKS ON A
// COMPRESSOR); the leases and rest states (see the file comment); a running commissioning test,
// which takes the output it drives; and the public-health floor (ComfortPreference, THE BAND).
//
// WHO SWITCHES THEM.
//   * A plant in a home: its household admins (access.v1.MEMBERSHIP_RELATION_HOUSEHOLD_ADMIN), and
//     an installer under a commissioning grant covering the home (commissioning.v1, GRANTS).
//     Consent to have a home's own heat source driven LIVE is its household's.
//   * A plant outside homes: the property owner and the gateway's administrators who reach its
//     space, and an installer under a commissioning grant covering it.
// Nobody else, whatever else they may set of the plant.
//
// A plant's rules start OFF. Rollout note: a gateway that ran a rule in shadow by a setting of its
// own, before this contract, starts that rule SHADOW instead on each plant it ran it for, so that
// the evidence a shadow gathers runs on across the upgrade; SHADOW drives nothing, so no consent is
// presumed. No other rule starts anywhere but OFF, and none starts LIVE.
// Every change is recorded (PriceRuleChange): a record of what
// happened, never rewritten, and corrected by a newer change.
//
// HEAT BLOCKS. A block is a stretch of time in which a price rule holds closed an input of the
// plant that blocks heat (HeatPumpControl.add_on_heater_block, hot_water_block, sg_ready_block), or, in SHADOW,
// would have. Each is recorded (HeatBlock) with why it started and how it ended. A plant's
// blocks are released by hand (webrtc.v1.ReleaseHeatBlock): every LIVE block under way ends,
// and the plant's blocking rules start no LIVE block until the hold the release states runs out
// (HeatBlockRelease). Only the plant's blocks are released: a floor zone a rule holds off is
// not a heat block, and is told by its rooms' explanations (climate.v1.ClimateExplanation).
//
// WHO SEES THEM. A plant's blocks, releases and changes of mode (HeatBlockStatus,
// HeatBlockHistory), and a home's shadow summary (ShadowSummary):
//   * of a plant in a home: its residents only, from the start of their current residency
//     (access.v1.MembershipRelation). Never service, never the property owner or the gateway
//     administrators, the home empty or not, and never an installer under a commissioning grant,
//     which covers no history of a home (commissioning.v1, GRANTS). The blocks, the releases and
//     the shadow summary are part of the home's climate history: erased by its household's Clear
//     history and by its wipe (webrtc.v1 household.proto, CLIMATE HISTORY, WIPE). The record of
//     changes of mode goes at the wipe;
//   * of a plant outside homes: the property owner and the gateway's administrators who reach
//     its space, and technicians who reach it, who may release its blocks; never a resident as
//     such. A shared plant's blocks never tell one home's comfort to anyone: an end caused by a
//     room in a home is told only where at least three homes share the plant, as
//     climate.v1.ClimateExplanationKind tells a shared cause, and otherwise as
//     HEAT_BLOCK_END_UNSTATED.
// Blocks, releases and changes are kept for 25 months, as a plant's hours are
// (climate.v1.PlantHistory); a shadow summary for 180 days, as a room's quarter hours are. A
// plant's energy price adder is given as ENERGY PRICE ADDER (WHO SEES IT) says.

// A price rule (PRICE RULES). A closed list that grows only by a release of this schema: a
// client words a rule it does not know as a price rule, unnamed, and offers no switch for it.
enum PriceRule {
  // Not stated, or a rule this client's schema does not know. Refused in a request.
  PRICE_RULE_UNSPECIFIED = 0;

  // Blocks the add-on heater (HeatPumpControl.add_on_heater_block) in the day's dearest quarter
  // hours, the compressor running on: each block within "plant.max_block_minutes"
  // (commissioning.v1), and ended early where a room it heats falls below its comfort band or,
  // where the plant reports it, its hot water runs low. A blocking rule.
  PRICE_RULE_ADD_ON_HEATER_BLOCK = 1;

  // Heats the plant's floor zones (FloorZone) ahead in cheap quarter hours, within the top of
  // their rooms' comfort band, and holds them off in dear ones, within its bottom. Holds no input
  // of the plant: not a blocking rule.
  PRICE_RULE_FLOOR_PRE_HEAT = 2;

  // Holds back the heat source's hot water in dear quarter hours (HeatPumpControl.hot_water_block)
  // and lets it be made in cheap ones: each block within "plant.max_block_minutes" and the rules
  // of a block that stops the compressor (commissioning.v1, BLOCKS ON A COMPRESSOR), ended early
  // where the tank's top falls to "hot_water.block_floor_centidegrees" (HEAT_BLOCK_END_HOT_WATER_LOW)
  // or is not heard (HEAT_BLOCK_END_INTERRUPTED), never across the heat source's periodic
  // increase, and released so that the charge it then makes lands in the cheapest quarter hours
  // after it. A blocking rule, whose input is hot_water_block; SHADOW models the blocks whether
  // or not it is bound. It starts no block where the plant does not report its tank's top, or
  // that report is not heard. LIVE, it drives nothing while the periodic increase is not known:
  // "hot_water.periodic_increase" unanswered or answered unknown, or answered true with its
  // interval or start unanswered or unknown, since it could not keep clear of a step it does not
  // know the time of. Besides,
  // where the plant binds sg_ready_boost and "plant.boost_uses_add_on" is false, it may ask for
  // hot water in cheap quarter hours, never during a block, and only while that input too may be
  // driven (PRICE_RULE_MODE_LIVE): never otherwise, since a boost that brings in the add-on
  // heater buys its heat at the dearest rate.
  PRICE_RULE_HOT_WATER = 3;
}

// How a price rule runs on a plant.
enum PriceRuleMode {
  // Not stated, or a mode this client's schema does not know: read as OFF. Refused in a
  // request.
  PRICE_RULE_MODE_UNSPECIFIED = 0;

  // The rule decides nothing and drives nothing. A plant's rules start OFF, save as the rollout
  // note under PRICE RULES (WHO SWITCHES THEM) says.
  PRICE_RULE_MODE_OFF = 1;

  // The rule decides as LIVE would and records what it decided (HeatBlock, ShadowSummary), but
  // drives nothing, so that its saving, and any comfort it would have cost, can be judged before
  // it goes live. Needs no input bound, and no hold applies to it.
  PRICE_RULE_MODE_SHADOW = 2;

  // The rule decides and drives. It drives only while the gateway may drive the input it steers:
  // bound, under a current pass of its commissioning test, the plant's feature not blocked
  // (commissioning.v1 FEATURE_PLANT), "plant.max_block_minutes" answered for a blocking rule, the
  // periodic increase known for HOT_WATER (PRICE_RULE_HOT_WATER), and no hold running
  // (HeatBlockRelease). Meanwhile it drives nothing and stays LIVE, and the
  // plant's feature status says why. A rule is put LIVE only while the input it steers is bound
  // (webrtc.v1.SetPriceRuleMode).
  PRICE_RULE_MODE_LIVE = 3;
}

// One change of a price rule's mode on a plant (PRICE RULES, WHO SWITCHES THEM); as
// HeatingPlant.price_rules, the mode the latest change left the rule in.
message PriceRuleChange {
  PriceRule rule = 1;

  // The mode it set, and the mode before it: before a rule's first change, the mode it started in
  // (WHO SWITCHES THEM).
  PriceRuleMode mode = 2;
  PriceRuleMode previous_mode = 3;

  google.protobuf.Timestamp at = 4;

  // The role its setter acted in: ROLE_RESIDENT for a household admin of the home,
  // ROLE_TECHNICIAN for an installer under a commissioning grant, otherwise ROLE_PROPERTY_OWNER
  // where they hold it, else ROLE_GATEWAY_ADMIN. UNSPECIFIED, with set_by unset, for a change the
  // gateway made itself: a home's wipe taking a LIVE rule back to SHADOW (webrtc.v1
  // household.proto, WIPE).
  kusinta.iot.access.v1.Role set_by_role = 5;

  // Who set it. For a plant in a home, given to its residents, and unset when it dates from
  // before their current residency; to an installer, only on a change of their own. For a plant
  // outside homes, given to the property owner and the gateway administrators. Unset to anyone
  // else, set_by_role kept.
  kusinta.iot.identity.v1.UserId set_by = 6;
}

// How a heat block ended (HeatBlock.end).
enum HeatBlockEnd {
  // Under way, or a cause this client's schema does not know: an app shows that it ended,
  // without a cause.
  HEAT_BLOCK_END_UNSPECIFIED = 0;

  // It ran to the end its rule planned for it.
  HEAT_BLOCK_END_PLANNED = 1;

  // A room the plant heats fell below its comfort band (climate.v1.ComfortPreference, THE
  // BAND).
  HEAT_BLOCK_END_ROOM_BELOW_BAND = 2;

  // The plant's hot water ran low, where the plant reports it.
  HEAT_BLOCK_END_HOT_WATER_LOW = 3;

  // Released by hand (webrtc.v1.ReleaseHeatBlock; HeatBlockRelease).
  HEAT_BLOCK_END_RELEASED = 4;

  // Its rule's mode changed (PriceRuleChange).
  HEAT_BLOCK_END_RULE_SWITCHED = 5;

  // The gateway stopped holding it for a cause of its own: the input could no longer be driven
  // (PRICE_RULE_MODE_LIVE), a reading its rule bounds it by was not heard, a commissioning test
  // took it, or the gateway restarted.
  HEAT_BLOCK_END_INTERRUPTED = 6;

  // Ended early for a cause not told to the recipient (WHO SEES THEM).
  HEAT_BLOCK_END_UNSTATED = 7;
}

// One heat block (HEAT BLOCKS).
message HeatBlock {
  // Assigned by the gateway, opaque.
  string block_id = 1;

  // The rule that started it, and its mode then: LIVE held the input, SHADOW only decided to.
  PriceRule rule = 2;
  PriceRuleMode mode = 3;

  // Why it started, as a room's explanation names the cause (climate.v1.ClimateExplanationKind;
  // subject ADD_ON_HEATER for the add-on heater): PRICE_HIGH for dear hours. A kind the client
  // does not know is shown as a block without a cause.
  kusinta.iot.climate.v1.ClimateExplanationKind reason = 4;

  google.protobuf.Timestamp started_at = 5;

  // The end its rule planned for it, within "plant.max_block_minutes".
  google.protobuf.Timestamp planned_end_at = 6;

  // When it ended, and how. Both unset while it is under way.
  google.protobuf.Timestamp ended_at = 7;
  HeatBlockEnd end = 8;
}

// One release of a plant's blocks by hand (webrtc.v1.ReleaseHeatBlock), and the hold it set.
message HeatBlockRelease {
  google.protobuf.Timestamp at = 1;

  // Until when the plant's blocking rules start no LIVE block. Unset: the release ended a hold
  // early, and blocks may start again as the rules plan them.
  google.protobuf.Timestamp hold_until = 2;

  // The blocks under way that it ended (HeatBlock.block_id).
  repeated string ended_block_ids = 3;

  // The role its maker acted in — ROLE_RESIDENT on a plant in a home; ROLE_PROPERTY_OWNER,
  // ROLE_GATEWAY_ADMIN or ROLE_TECHNICIAN on one outside homes — and who they are, given as
  // PriceRuleChange.set_by is.
  kusinta.iot.access.v1.Role set_by_role = 4;
  kusinta.iot.identity.v1.UserId set_by = 5;
}

// A plant's blocks as they stand now: what is blocked, by which rule and why, and the hold a
// release set. Given as WHO SEES THEM says, in reply to webrtc.v1.ListHeatBlockStatus and
// webrtc.v1.ReleaseHeatBlock, and pushed (webrtc.v1 GatewayMessage.heat_block_status) to the
// sessions given it whenever a block starts or ends, or a hold begins, changes or ends. Apply as
// an upsert keyed on plant_id.
message HeatBlockStatus {
  string plant_id = 1;

  // The plant's space and name, so that a technician who is not given the plant record knows
  // which plant it is.
  kusinta.iot.identity.v1.SpaceId space_id = 2;
  string plant_name = 3;

  // The blocks under way, LIVE and SHADOW, at most one per rule and mode. Empty: none.
  repeated HeatBlock current = 4;

  // The release whose hold runs now. Unset: none.
  HeatBlockRelease hold = 5;

  // The plant's rules and their modes, as HeatingPlant.price_rules, so that whoever may release
  // a block is told whether a rule is LIVE.
  repeated PriceRuleChange price_rules = 6;
}

// The answer to webrtc.v1.ListHeatBlockStatus.
message HeatBlockStatuses {
  repeated HeatBlockStatus statuses = 1;
}

// A plant's blocks, releases and changes of mode over a range, in reply to
// webrtc.v1.GetHeatBlockHistory. Blocks in order of started_at, releases and changes in order
// of at.
message HeatBlockHistory {
  string plant_id = 1;

  // The earliest time the gateway still holds of this plant's records that the recipient may
  // read: for a plant in a home, no earlier than the start of their current residency, nor than
  // the home's last Clear history (space.v1.Space.climate_history_cleared_at). Nothing before it
  // is returned.
  google.protobuf.Timestamp kept_from = 2;

  repeated HeatBlock blocks = 3;
  repeated HeatBlockRelease releases = 4;
  repeated PriceRuleChange rule_changes = 5;
}

// PRICE BASIS. Every money figure of a shadow (ShadowDay) is on one price basis, stated with it
// (ShadowPriceBasis): the raw day-ahead spot price, or the price its payer pays. On the payer's
// price, a figure parts the energy a rule decides into two:
//   * energy moved: the same kWh used at another time, as a pre-heat or a tank filled in cheap
//     quarter hours uses it. Priced at spot plus VAT: the energy tax and the adder are the same
//     on every kWh, so they cancel between the time the energy left and the time it went to,
//     and VAT, a share of the price, does not. The adder is read as flat per kWh: a grid energy
//     fee that varies with the time of day would not cancel, and is no part of it;
//   * extra energy: kWh used that would not have been used otherwise — what is made up after a
//     block or a coast, a pre-heat's losses, and in the cautious figure what is made up at full
//     electric energy. Priced at spot plus the energy tax plus the adder, all of it with VAT.
//     Energy a rule avoids using at all is the reverse of extra energy, and saves its full
//     price: spot plus the energy tax plus the adder, all of it with VAT.
// recovery_cost_micro_eur is extra energy; net_saving_micro_eur is the moved and the avoided
// energy, the recovery cost taken off. A share-scored day (ShadowDay.saving_share_permille)
// prices the heat cost it is a share of on its basis too.
//
// WHAT THE GATEWAY SUPPLIES. The VAT rate, by the country of the building's price area (its
// bidding zone, webrtc.v1 BUILDING PLANNING), and the energy tax, from a table of rates by the
// date each takes effect, are the gateway's own: no request sets either. The adder is the
// payer's (EnergyPriceAdder). The energy tax and the adder are in the currency of the price
// area's country, and the gateway converts them to euros for a day at the rate in force on it as
// it holds the rates when it scores the day: the latest published on or before it
// (planning.v1.ExchangeRate). The day names that rate (ShadowDay.rate_published_on), and a client
// converts the day's figures back at that rate, never at another, so that it gets the amount the
// payer pays however late a rate reached the gateway. A day for which the gateway holds no
// exchange rate on or before it, or lacks the country's VAT rate, energy tax or default adder,
// is scored on SPOT. A client is given the terms only to say what the figures include ("incl.
// 25 % VAT"; ShadowSummary.price_terms), and never reprices a figure with them.
//
// A day keeps the basis, the terms, the rate and the adder it was scored on. A change of the
// adder, a correction of a mistaken one included, of the VAT rate or of the tax table applies
// from the next day scored, and a day already kept is never scored again: it keeps its
// price_basis and adder_source, and a day kept before price bases stays on spot. A client that
// adds the days of a span together adds only days of one basis, or says that the total mixes
// bases; and where any day of the span rests on the default adder
// (ENERGY_PRICE_ADDER_SOURCE_DEFAULT), it says that the total is approximate.
//
// ENERGY PRICE ADDER. The part of the payer's price per kWh that the gateway cannot know: the
// grid fee's variable part plus the supplier's markup, as one figure (EnergyPriceAdder). One
// per home, for the home's own plants (those whose HeatingPlant.space_id, the space each serves,
// is the home), and one per plant outside homes (every other plant), for that plant. Until its
// payer states one, and again once they reset it, the gateway's default for the country is in
// force (ENERGY_PRICE_ADDER_SOURCE_DEFAULT).
//
// WHO SETS IT (webrtc.v1.SetEnergyPriceAdder): whoever answers for the bill. For a home, its
// household admins (access.v1.MEMBERSHIP_RELATION_HOUSEHOLD_ADMIN). For a plant outside homes,
// the owner organisation: the property owner and the gateway's administrators who reach the
// plant's space. Nobody else, never an installer under a commissioning grant, which covers no
// savings (commissioning.v1, GRANTS). A household sets its home's adder even where the home is on
// the building's shared grid connection: where it pays nothing per kWh beyond spot, as when the
// grid or the electricity comes with the rent, it states the adder it does pay, which may be 0,
// and the default stands until it does.
//
// WHO SEES IT. It is the payer's contract information.
//   * A home's: its residents only, as its shadow summary is (PRICE RULES, WHO SEES THEM). Never
//     service, the property owner or the gateway's administrators, the home empty or not; never
//     an installer under a commissioning grant. Household data: part of the household's export,
//     and erased at the home's wipe, the home's adder going back to the default (webrtc.v1
//     household.proto, EXPORT, WIPE). Not climate history: the household's Clear history keeps it.
//   * A plant outside homes': the property owner and the gateway's administrators who reach the
//     plant's space; never a resident or a technician as such. Where its money figures are given
//     to one who is not given its adder, such as a technician who reaches it (PRICE RULES, WHO
//     SEES THEM), figures on PAYER with adder_source STATED, beside the terms, let them roughly
//     work the adder back. That is accepted: it is the owner organisation's business data, of low
//     sensitivity. The adder itself is never given to them.
// Neither is part of any message the gateway sends the api-server.

// One day of one price rule scored against one comfort band (ShadowBandSeries): what the rule,
// had it been live with that band, would have saved, and what it would have cost in comfort. A
// day is the building's local date (space.v1.Space.time_zone), cut as
// climate.v1.CLIMATE_SUMMARY_PERIOD_DAY is, and given only once the gateway has scored it, never
// before it ends. A day on which the building's time zone was unknown is not scored.
message ShadowDay {
  // The local date, as an ISO 8601 calendar date (YYYY-MM-DD).
  string date = 1;

  // The saving, in millionths of a euro, the currency day-ahead prices are in
  // (planning.v1.PriceInterval): the cost of the energy the rule would have moved or avoided, on
  // the day's price basis (price_basis), with the recovery cost already taken off. Negative: it
  // would have cost more than it saved. A client converts it as it converts prices
  // (planning.v1.ExchangeRate).
  sint64 net_saving_micro_eur = 2;

  // The cost, in millionths of a euro, of making up afterwards for what was blocked or coasted:
  // already taken off net_saving_micro_eur, and told so that a client may show both. Extra
  // energy (PRICE BASIS).
  sint64 recovery_cost_micro_eur = 3;

  // The quarter hours of the day the rule would have blocked or coasted.
  uint32 blocked_quarters = 4;

  // The quarter hours of the day in which at least one room the rule judges was, or was
  // predicted to be, below the band's low edge (a breach), and above its high edge
  // (overheated). A quarter hour in which a room's window was open is not counted for that room.
  uint32 breach_quarters = 5;
  uint32 overheat_quarters = 6;

  // The quarter hours of the day that had no price, in which the rule decided nothing: all of
  // them on a day with no price at all, when every other count is 0.
  uint32 no_price_quarters = 7;

  // The cautious saving, in millionths of a euro: as net_saving_micro_eur, but with what was
  // blocked or coasted made up at its full electric energy, crediting a heat pump's efficiency
  // only in quarter hours its compressor is known to have had capacity to spare. It is the
  // figure to judge a rule by before relying on it. Unset where the saving is not known in
  // money (saving_share_permille), or on a day kept before it was computed.
  optional sint64 cautious_net_saving_micro_eur = 8;

  // Where the saving is not known in money, for a rule whose energy is known only relative to
  // its own heating: the saving as thousandths of the heat cost of what it decides that day,
  // recovery taken off; negative where it would have cost more. Where set,
  // net_saving_micro_eur and recovery_cost_micro_eur are 0 and say nothing; a client shows the
  // share instead. Unset where the saving is in money.
  optional sint32 saving_share_permille = 9;

  // The cautious figure as a share, for a rule whose saving is given as saving_share_permille:
  // made up at full electric energy as cautious_net_saving_micro_eur is, never above the share.
  // Unset where the saving is in money, or on a day kept before it was computed.
  optional sint32 cautious_saving_share_permille = 10;

  // A day given for its counts alone: a share-scored rule's day whose share could not be known
  // (its heat cost too near zero to divide by). Then saving_share_permille and
  // cautious_saving_share_permille are unset and the money fields 0, and a client shows its
  // breaches and overheats only, never a saving of 0.
  bool counts_only = 11;

  // What the day's share is a share of, in a unit of the gateway's that is comparable only
  // between days of one series (its plant, rule and band), so that a client weighs days' shares
  // into a share over a span: the sum of share × weight over the sum of weight, and the
  // cautious share (cautious_saving_share_permille) by the same weight, so that it stays no
  // higher than the share over the span. Where a day of the span has the share but no weight (a
  // day kept before the weight, or an older gateway), a client takes the plain mean of the span's
  // shares; a span whose weights sum to 0 has no share, and a client shows its counts. Set where
  // saving_share_permille is; never shown.
  optional uint64 share_weight = 12;

  // The basis the day's money figures and shares are on (PRICE BASIS); UNSPECIFIED is read as
  // SPOT.
  ShadowPriceBasis price_basis = 13;

  // On PAYER, whether the adder the day was priced with was the gateway's default or the payer's
  // own, so that a client can say a figure on the default is approximate. UNSPECIFIED on SPOT.
  EnergyPriceAdderSource adder_source = 14;

  // On PAYER, the exchange rate the day's energy tax and adder were converted with, by its
  // planning.v1.ExchangeRate.published_on (PRICE BASIS, WHAT THE GATEWAY SUPPLIES): a client
  // converts the day's figures at that rate, listed in ShadowSummary.exchange_rates, and never at
  // another. Empty on SPOT, and then a client converts the day at the rate in force on it.
  string rate_published_on = 15;
}

// One price rule of one plant of a home, scored day by day against one comfort band.
message ShadowBandSeries {
  string plant_id = 1;
  PriceRule rule = 2;

  // The band scored, as a comfort preference gives one (climate.v1.ComfortPreference, THE
  // BAND), in centidegrees. Which bands are scored is the gateway's choice: a set the same for
  // every home, the presets' among them, and besides it the home's own chosen band where that
  // is outside the set, from the day it is chosen. A band the home chose before and no longer
  // holds keeps the days scored while it held it, as long as any band's days are kept.
  uint32 below_target_centidegrees = 3;
  uint32 above_target_centidegrees = 4;

  // In order of date.
  repeated ShadowDay days = 5;
}

// What a home's price rules would have saved, and cost in comfort, under each band the gateway
// scores, so that the household can choose its comfort preference knowing what each would bring
// (climate.v1.ComfortPreference). In reply to webrtc.v1.GetShadowSummary. The household's data,
// given as WHO SEES THEM says of a plant in a home: to the home's residents only, never to
// service, the property owner, the gateway's administrators, an installer under a commissioning
// grant or another home; erased by the household's Clear history and by the home's wipe.
message ShadowSummary {
  kusinta.iot.identity.v1.SpaceId home_id = 1;

  // The earliest date still held that the recipient may read: no earlier than the first whole
  // day of their current residency, nor than the first whole day after the home's last Clear
  // history. An ISO 8601 calendar date; empty where nothing is held for them.
  string kept_from = 2;

  // One per plant, rule and band scored, ordered by plant, rule, then below_target: of the home's
  // own plants (HeatingPlant.space_id the home) only, each rule while it ran in SHADOW or LIVE.
  // A plant outside homes is scored for no home. Empty where none is held.
  repeated ShadowBandSeries series = 3;

  // The reference rates a client converts the savings at, as webrtc.v1.DayAheadPrices gives
  // them for prices: every rate the gateway holds from kept_from on, the last one before it, and
  // any older rate a day given names (ShadowDay.rate_published_on), oldest first. A day that names
  // a rate is converted at it; any other day at the rate in force on it. Empty where it holds
  // none; a client then shows euros.
  repeated kusinta.iot.planning.v1.ExchangeRate exchange_rates = 4;

  // The terms the gateway priced PAYER days with (PRICE BASIS, WHAT THE GATEWAY SUPPLIES), so that
  // a client can say what the figures include: every set it priced a day from kept_from on with,
  // and the last one before it, oldest first, whatever price area the home had then. A PAYER day
  // was priced with the set in force on its date (EnergyPriceTerms.valid_from). Empty where none
  // is held, and from a gateway that predates price bases.
  repeated EnergyPriceTerms price_terms = 5;
}

// What a shadow's money figures include (PRICE BASIS). A basis this client's schema does not know:
// a client shows the figure without saying what it includes.
enum ShadowPriceBasis {
  // Not stated: a day kept before price bases, or from a gateway that predates them. Read as SPOT.
  SHADOW_PRICE_BASIS_UNSPECIFIED = 0;

  // The raw day-ahead spot price (planning.v1.PriceInterval) on every kWh: no VAT, no energy tax,
  // no adder.
  SHADOW_PRICE_BASIS_SPOT = 1;

  // The payer's price, as PRICE BASIS parts it between energy moved and extra energy.
  SHADOW_PRICE_BASIS_PAYER = 2;
}

// Where the adder in force comes from (ENERGY PRICE ADDER).
enum EnergyPriceAdderSource {
  // Not stated: no adder applies (a SPOT day, a payer whose building has no price area).
  ENERGY_PRICE_ADDER_SOURCE_UNSPECIFIED = 0;

  // The gateway's default for the price area's country. A figure priced with it is approximate.
  ENERGY_PRICE_ADDER_SOURCE_DEFAULT = 1;

  // The payer's own, set with webrtc.v1.SetEnergyPriceAdder.
  ENERGY_PRICE_ADDER_SOURCE_STATED = 2;
}

// The terms the gateway supplies itself for a price area's country, from one date on (PRICE
// BASIS, WHAT THE GATEWAY SUPPLIES). In force from valid_from until the next set's.
message EnergyPriceTerms {
  // The building's local date from which the gateway prices with them, as an ISO 8601 calendar
  // date (YYYY-MM-DD): the date they take effect, or where the gateway took them up only after it
  // had scored a day from that date on, the first day it scored with them. So a day already
  // scored is never listed under terms it was not priced with.
  string valid_from = 1;

  // The VAT rate, in thousandths: 250 for 25 %.
  uint32 vat_permille = 2;

  // The currency the energy tax and the adder are in, as ISO 4217 names it: "SEK".
  string currency = 3;

  // The energy tax per kWh, excluding VAT, in millionths of currency: 360000 for 0.36 SEK.
  uint32 energy_tax_micro_per_kwh = 4;

  // The highest adder the gateway takes in this currency (EnergyPriceAdder.micro_per_kwh), in the
  // same unit: a bound against a mistyped value, well above any real grid fee and markup, never a
  // price. The lowest is 0.
  uint32 adder_max_micro_per_kwh = 5;
}

// Whose energy price adder (ENERGY PRICE ADDER): a home, for the home's own plants, or a plant
// outside homes.
message EnergyPricePayer {
  oneof payer {
    kusinta.iot.identity.v1.SpaceId home_id = 1;
    string plant_id = 2;
  }
}

// A payer's energy price adder as it stands (ENERGY PRICE ADDER), in reply to
// webrtc.v1.GetEnergyPriceAdder and SetEnergyPriceAdder. Given as WHO SEES IT says.
message EnergyPriceAdder {
  EnergyPricePayer payer = 1;

  // The terms in force now for the price area's country: the adder is in their currency, and a
  // set names it. Unset where the building has no price area, or one whose country the gateway
  // holds no terms for: then no adder applies, source is UNSPECIFIED, and the figures are on
  // SPOT.
  EnergyPriceTerms terms = 2;

  // The adder in force: the grid fee's variable part plus the supplier's markup per kWh,
  // excluding VAT, in millionths of the terms' currency: 450000 for 0.45 SEK, 45 öre. From 0 to
  // terms.adder_max_micro_per_kwh. Millionths, so that one shape serves every currency, on the
  // scale of the figures it prices (millionths of a euro), and an invoice's fraction of an öre is
  // held exactly. Excluding VAT, since the gateway adds VAT to the whole price once (PRICE
  // BASIS): a value with VAT in it would carry it twice. An invoice to a household usually states
  // the grid fee with VAT; a client that takes it so divides it by 1 + terms.vat_permille / 1000
  // before setting it.
  uint32 micro_per_kwh = 3;

  // DEFAULT until the payer states one, and again once they reset it; STATED once they have.
  // A stated value equal to the default is STATED: it is the payer's own.
  EnergyPriceAdderSource source = 4;

  // The gateway's default for the country, so that a client can show what a reset would put in
  // force. Unset where terms is; 0 is a default of no grid fee or markup.
  optional uint32 default_micro_per_kwh = 5;
}

// HEAT CURVE. Whether a heat source's heating curve is set higher than what it heats needs. A
// heat source works out the supply it aims for from the outdoor temperature by its curve
// (device.v1.HeatSourceReadings.calculated_supply_centidegrees); the zones it heats show how
// much of that supply they take, by how far they open. Where even the most demanding zone opens
// little at the coldest outdoor temperatures seen, the curve could come down, and a lower supply
// lets a heat pump run more efficiently and start its add-on heat less often.
//
// WHAT IT SHOWS (HeatCurveView). The plant's quarter hours over a window, by bands of outdoor
// temperature: per band, the typical calculated and measured supply, the add-on heat's use,
// and the zone that needed the most, which is what limits the curve (HeatCurveLimit). An
// opening is a zone's: a floor zone's duty, the share of a quarter hour its output held it
// heating, or a radiator valve's opening, in thousandths. The most demanding zone of a band is
// the one whose opening, at a high percentile of the band's quarter hours
// (HeatCurveView.opening_percentile), is highest: not the average, since one zone left short is
// what a lower curve would cost. The curve could come down while the most demanding zone of the
// coldest band seen opens at most the gateway's threshold (HeatCurveView.threshold_permille,
// 850 for 85 %), which leaves it headroom to recover after a block or a setback. A zone's
// quarter hours in which a price rule or a commissioning test drove it, or its room's window was
// open, are left out of its openings. A quarter hour in which an external input moved the curve
// for any part of it (device.v1.HeatSourceReadings.external_adjustment_active), as an away
// switch does, is left out of the view altogether: its calculated supply was off the curve, and
// its openings answer another supply. The heat source made hot water in a quarter hour where it
// reported so (HeatSourceReadings.producing) or where the gateway detected a charge of the tank
// itself, as it must for a heat source that reports no production. The view observes: it names
// no new curve, and the gateway sets nothing on the heat source by it.
//
// WHO SEES IT, given in reply to webrtc.v1.GetHeatCurveView:
//   * a plant in a home: its household admins (access.v1.MEMBERSHIP_RELATION_HOUSEHOLD_ADMIN),
//     who set the heat source, and an installer under a commissioning grant covering the home
//     (commissioning.v1, GRANTS), for whom setting a curve is commissioning. The home's other
//     residents are given its limits alone, their own home's rooms, with every figure withheld
//     (HeatCurveView.figures_withheld). Never service, the property owner or the gateway's
//     administrators, the home empty or not;
//   * a plant outside homes: the owner organisation — the property owner and the gateway's
//     administrators who reach its space — and an installer under a commissioning grant covering
//     it. Never a resident as such. Where the zone that limits lies in a home, they are told that
//     a home limits the curve and the kind of reason, and whether it leaves headroom: never which
//     home, its rooms, its zones or its openings (HeatCurveLimit.home_withheld), and a limit in
//     one home reads the same as in another. FEWER THAN THREE HOMES: where fewer than three homes
//     have a zone the plant heats, a limit in a home is not given to them at all: the band's
//     limit is unset, as where none is known, so that the withholding itself says nothing. The
//     same threshold as a shared plant's blocks (PRICE RULES, WHO SEES THEM), and set here on its
//     own, so that it can change without that one. A limit outside homes is given them however
//     many homes share the plant. The home that limits is told so in its own reading
//     (GetHeatCurveView by home_id): its residents are given the plant's limits that lie in their
//     home, with their room and its opening, and every figure of the plant withheld.
// Never a room's temperature, setpoint, contact state or events to anyone a room's own readings
// are not given to. A zone in a home counts only with the quarter hours still kept of it: none
// from before its household's last Clear history or its wipe (webrtc.v1 household.proto, CLIMATE
// HISTORY, WIPE), and for a resident, none from before their current residency
// (access.v1.MembershipRelation). The view is worked out when read, from what the gateway keeps,
// and is not itself kept.
//
// SHARING, reserved. A household may later choose to let the owner organisation know that its
// home is the one that limits a shared plant's curve, and why. Until a release of this schema
// says how, no reading names it to them.

// The kind of reason a zone limits a heat curve (HeatCurveLimit). A closed list that grows only
// by a release of this schema.
enum HeatCurveLimitReason {
  // Not known, as with too few zones to compare, or a reason this client's schema does not know:
  // a client shows the limit without a reason.
  HEAT_CURVE_LIMIT_REASON_UNSPECIFIED = 0;

  // Only this zone runs high while most others run low: it is short of flow rather than of
  // supply temperature. It points to balancing the system, not to the curve.
  HEAT_CURVE_LIMIT_REASON_HYDRAULIC_BALANCE = 1;

  // Most zones run high: what is heated needs the supply the curve gives.
  HEAT_CURVE_LIMIT_REASON_DEMAND = 2;
}

// The zone that limits a heat curve in one outdoor band, and why (HEAT CURVE, WHAT IT SHOWS).
message HeatCurveLimit {
  HeatCurveLimitReason reason = 1;

  // The zone's opening at the view's percentile (HeatCurveView.opening_percentile), in
  // thousandths. Unset where the zone lies in a home the recipient is not given (home_withheld).
  optional uint32 opening_permille = 2;

  // Whether that opening is at most HeatCurveView.threshold_permille: the zone has headroom, and
  // in the coldest band seen the curve could come down. Given whoever the limit is given to,
  // home_withheld or not.
  bool has_headroom = 3;

  // The room the zone heats: a radiator valve's room, or a floor zone's control room
  // (FloorZone.control_room_id). Unset where home_withheld.
  kusinta.iot.identity.v1.SpaceId room_id = 4;

  // The floor zone (FloorZone.zone_id) where the opening is a floor zone's duty; empty for a
  // radiator valve, and where home_withheld.
  string floor_zone_id = 5;

  // Set where the zone lies in a home the recipient is not given (HEAT CURVE, WHO SEES IT): the
  // limit says that a home limits, and the reason, and nothing of which.
  bool home_withheld = 6;
}

// One band of outdoor temperature of a heat curve view, over the view's window.
message HeatCurveBand {
  // The band, in centidegrees, half-open: [outdoor_from, outdoor_to), by the outdoor mean of
  // each quarter hour (climate.v1.PlantHistorySample.outdoor_centidegrees). Band edges and width
  // are the gateway's choice, the same for every plant.
  sint32 outdoor_from_centidegrees = 1;
  sint32 outdoor_to_centidegrees = 2;

  // The quarter hours of the window whose outdoor mean fell in the band, leaving out those in
  // which an external input moved the curve (WHAT IT SHOWS).
  uint32 quarters = 3;

  // The median over the band's quarter hours of the calculated supply and of the measured
  // supply, in centidegrees, as the heat source reads them (device.v1.HeatSourceReadings), each
  // leaving out the quarter hours in which the heat source made hot water (WHAT IT SHOWS). Unset
  // where not known, and where figures are withheld (HeatCurveView.figures_withheld).
  optional sint32 calculated_supply_centidegrees = 4;
  optional sint32 supply_centidegrees = 5;

  // The add-on heat's energy over the band's quarter hours, in watt-hours, and the share of them
  // in which it drew, in thousandths (device.v1.HeatSourceReadings.add_on_heat_watts). Unset
  // where not known, and where figures are withheld.
  optional uint32 add_on_heat_wh = 6;
  optional uint32 add_on_running_permille = 7;

  // The zone that limits the curve in this band. Unset where none is known: no zone with an
  // opening read in the band, too few quarter hours in it for the gateway to judge; in a home's
  // reading of a plant outside it, a band its home does not limit; and, to the owner
  // organisation, a limit in a home on a plant fewer than three homes share (WHO SEES IT,
  // FEWER THAN THREE HOMES). A client reads each the same: no limit known.
  HeatCurveLimit limit = 8;
}

// One plant's heating curve against what its zones draw (HEAT CURVE). Given as WHO SEES IT says.
message HeatCurveView {
  string plant_id = 1;

  // The plant's name, so that one who is not given the plant record knows which plant it is.
  string plant_name = 2;

  // The quarter hours counted, [window_from, window_to): a window of the gateway's choice, such
  // as the last 28 days, starting no earlier than the curve settings last changed
  // (curve_settings_changed_at), so that the bands judge the curve in force.
  google.protobuf.Timestamp window_from = 3;
  google.protobuf.Timestamp window_to = 4;

  // Coldest first. A band with no quarter hour is not given. Empty where none is known: a plant
  // without outdoor readings, or nothing kept in the window.
  repeated HeatCurveBand bands = 5;

  // The opening, in thousandths, at most which the most demanding zone of the coldest band leaves
  // the curve room to come down (HEAT CURVE, WHAT IT SHOWS): 850 for 85 %. The gateway's.
  uint32 threshold_permille = 6;

  // The percentile of a zone's openings over a band's quarter hours that a limit is judged by
  // (HeatCurveLimit.opening_permille), such as 90. The gateway's.
  uint32 opening_percentile = 7;

  // The heat source's curve settings as last read, as its readings state them
  // (device.v1.HeatSourceReadings, SETTINGS): only its curve's fields set — own_curve_in_force,
  // heating_curve, heating_curve_offset, min_supply_centidegrees, own_curve_supply_* and
  // curve_point_* — each where read, every other field unset. Which curve is in force is read as
  // those readings say: without own_curve_in_force, neither the numbered curve nor the own
  // curve's points is read as the one in force. Never external_adjustment_active, a state and
  // not a setting. Unset where none is read, and where figures are withheld.
  kusinta.iot.device.v1.HeatSourceReadings curve_settings = 8;

  // When one of the fields curve_settings carries, own_curve_in_force included, was last seen to
  // change. Unset where none was, or none is read, and where figures are withheld.
  google.protobuf.Timestamp curve_settings_changed_at = 9;

  // Set where the recipient is given the plant's limits alone (WHO SEES IT): the bands' supplies
  // and add-on figures and the curve settings are left out, so that their absence is not read as
  // not known.
  bool figures_withheld = 10;
}

// The answer to webrtc.v1.GetHeatCurveView.
message HeatCurveViews {
  repeated HeatCurveView views = 1;
}
