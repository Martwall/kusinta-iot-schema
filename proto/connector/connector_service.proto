syntax = "proto3";

package kusinta.iot.v1.connector;

import "connector/connector.proto";

option optimize_for = SPEED;

// ConnectorGatewayService: connector dials the gateway on startup.
// A single persistent bidirectional stream carries all traffic for the connector's lifetime.
service ConnectorGatewayService {
  rpc Connect(stream ConnectorToGatewayMessage) returns (stream GatewayToConnectorMessage);
}
