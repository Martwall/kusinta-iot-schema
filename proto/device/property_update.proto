syntax = "proto3";

package kusinta.iot.v1.device;

import "google/protobuf/timestamp.proto";
import "identity/identity.proto";

option optimize_for = SPEED;

// PropertyUpdate carries a single attribute change from connector to gateway,
// or from gateway to Flutter app.
// attribute_name uses PascalCase Matter attribute naming (e.g. "OccupiedHeatingSetpoint").
// cluster_id_hex is the Matter cluster ID as a 4-char hex string (e.g. "0201" for Thermostat).
message PropertyUpdate {
  kusinta.iot.v1.identity.DeviceId device_id = 1;
  string attribute_name = 2;

  oneof value {
    sint32 int_value    = 3;
    uint32 uint_value   = 4;
    bool   bool_value   = 5;
    float  float_value  = 6;
    string string_value = 7;
    bytes  bytes_value  = 8;
  }

  google.protobuf.Timestamp timestamp = 9;
  string cluster_id_hex = 10;
}

message PropertyUpdateBatch {
  repeated PropertyUpdate updates = 1;
  google.protobuf.Timestamp batch_timestamp = 2;
}
